<script>
/** Utilidades compartilhadas. Valores e descrições financeiros não persistem no navegador. */
const MukiranaFinance = (() => {
  const date = value => typeof value === "string" && /^(?!0000)\d{4}-\d{2}-\d{2}$/.test(value) &&
    Number.isFinite(new Date(value + "T12:00:00Z").getTime()) && new Date(value + "T12:00:00Z").toISOString().slice(0,10) === value;
  function today() {
    const parts = new Intl.DateTimeFormat("en-US", { timeZone: "America/Sao_Paulo", year: "numeric", month: "2-digit", day: "2-digit" }).formatToParts(new Date());
    const get = type => parts.find(part => part.type === type).value;
    return `${get("year")}-${get("month")}-${get("day")}`;
  }
  function money(value) {
    if (value === null || value === undefined) return "Não informado";
    const text = String(value);
    if (!/^-?\d+$/.test(text)) return "—";
    const amount = BigInt(text), negative = amount < 0n;
    const digits = (negative ? -amount : amount).toString().padStart(3,"0");
    return `${negative ? "−" : ""}R$ ${digits.slice(0,-2).replace(/\B(?=(\d{3})+(?!\d))/g,".")},${digits.slice(-2)}`;
  }
  function parseAmount(text) {
    const raw = text.trim();
    if (!/^(?:\d+|\d{1,3}(?:\.\d{3})+)(?:,\d{1,2})?$/.test(raw)) return null;
    const [whole, cents = ""] = raw.replace(/\./g,"").split(",");
    const amount = Number(whole + cents.padEnd(2,"0"));
    return Number.isSafeInteger(amount) && amount > 0 && amount <= 99999999999999 ? amount : null;
  }
  function amountInput(cents) {
    const text = String(cents).padStart(3,"0");
    return text.slice(0,-2) + "," + text.slice(-2);
  }
  const dateLabel = value => date(value) ? new Intl.DateTimeFormat("pt-BR", { timeZone:"UTC" }).format(new Date(value+"T12:00:00Z")) : "—";
  function month(value = today(), delta = 0) {
    const d = new Date(value + "T12:00:00Z");
    d.setUTCDate(1); d.setUTCMonth(d.getUTCMonth() + delta);
    const startDate = d.toISOString().slice(0,10);
    d.setUTCMonth(d.getUTCMonth()+1); d.setUTCDate(0);
    return { startDate, endDate:d.toISOString().slice(0,10) };
  }
  let selected = month();
  const period = Object.freeze({
    get: () => ({ ...selected }),
    set(startDate, endDate) {
      if ((startDate !== null && !date(startDate)) || (endDate !== null && !date(endDate))) return false;
      if (startDate && !endDate) endDate = today();
      if (startDate && endDate && startDate > endDate) return false;
      selected = { startDate, endDate }; document.dispatchEvent(new CustomEvent("mukirana:period", { detail: { ...selected } }));
      return true;
    },
    reset() { selected = month(); },
  });
  return Object.freeze({ date, today, money, parseAmount, amountInput, dateLabel, month, period });
})();
</script>
