<script>
(()=>{'use strict';if(window.MukiranaTema)return;
const themes=[{value:'claro',name:'Claro'},{value:'escuro',name:'Escuro'},{value:'sepia',name:'Sépia'}],valid=value=>themes.some(t=>t.value===value),normalize=value=>({Claro:'claro',Escuro:'escuro','Sépia':'sepia',Sepia:'sepia'})[value]||value,embedded=document.querySelector('meta[name="mukirana-theme-context"]')?.content==='embedded';
let current='claro',scheduled=false;const watched=new WeakSet();
function storageGet(key){try{return localStorage.getItem(key);}catch{return null;}}
const actor=()=>storageGet('mukirana_id')||'visitante',key=()=> 'mukirana-ux:'+actor()+':theme';
function preferred(profile){const own=normalize(storageGet(key()));if(valid(own))return own;const legacy=normalize(profile||storageGet('mukirana_tema'));return valid(legacy)?legacy:'claro';}
function frames(){return [...document.querySelectorAll('#ln-live-frame,#painel-frame,iframe[data-mukirana-theme]')];}
function send(frame){frame.contentWindow?.postMessage({channel:'mk-ux-theme',theme:current},'*');}
function apply(value){if(!valid(value))return;current=value;document.documentElement.classList.add('ux-theme-change');requestAnimationFrame(()=>requestAnimationFrame(()=>document.documentElement.classList.remove('ux-theme-change')));document.documentElement.dataset.theme=value;document.documentElement.style.colorScheme=value==='escuro'?'dark':'light';if(document.body){document.body.dataset.theme=value;document.body.classList.toggle('tema-escuro',value==='escuro');document.body.classList.toggle('tema-sepia',value==='sepia');}document.querySelectorAll('[data-ux-theme]').forEach(s=>{s.value=value;});const icon=document.getElementById('icone-tema-sessao');if(icon)icon.textContent=({claro:'light_mode',escuro:'dark_mode',sepia:'menu_book'})[value];const b=document.getElementById('botao-tema-sessao');if(b){b.title='Tema '+themes.find(t=>t.value===value).name+' · preferência deste navegador';b.setAttribute('aria-label','Alternar tema visual entre claro, escuro e sépia');}if(!embedded)frames().forEach(send);window.dispatchEvent(new CustomEvent('mukirana:theme',{detail:{theme:value}}));}
function choose(value){value=normalize(value);if(!valid(value))return;try{localStorage.setItem(key(),value);}catch{}apply(value);}
function control(id,extra=''){const label=document.createElement('label');label.id=id;label.className='ux-theme-control '+extra;label.title='Tema visual · salvo para você neste navegador';label.innerHTML='<span>Tema</span><select data-ux-theme aria-label="Tema visual'+(extra?' do menu':'')+'">'+themes.map(t=>'<option value="'+t.value+'">'+t.name+'</option>').join('')+'</select>';label.querySelector('select').value=current;return label;}
function mount(){scheduled=false;if(embedded||!document.body)return;const header=document.getElementById('topbar-app');if(header&&!document.getElementById('ux-theme-header'))header.insertBefore(control('ux-theme-header'),document.getElementById('topbar-contexto-app'));const nav=document.getElementById('menu-lateral');if(nav&&!document.getElementById('ux-theme-menu'))nav.insertBefore(control('ux-theme-menu','ux-theme-menu'),nav.querySelector('.lista-menu'));if(!document.getElementById('ux-theme-guest'))document.body.append(control('ux-theme-guest'));for(const frame of frames())if(!watched.has(frame)){watched.add(frame);frame.addEventListener('load',()=>send(frame));send(frame);}const route=window.mukiranaTelaAtual?.nomeTela||document.body.dataset.uxRoute;document.querySelectorAll('#menu-lateral a[onclick]').forEach(a=>{const match=a.getAttribute('onclick')?.match(/navegarPara\('([^']+)'\)/);if(!match)return;if(match[1]===route)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');});}
function schedule(){if(scheduled)return;scheduled=true;queueMicrotask(mount);}
window.MukiranaTema={get:()=>current,choose,refresh:profile=>apply(preferred(profile)),cycle:()=>choose(themes[(themes.findIndex(t=>t.value===current)+1)%themes.length].value),themes:themes.map(t=>({...t}))};
window.addEventListener('message',e=>{const m=e.data;if(m?.channel!=='mk-ux-theme')return;if(embedded){if(e.source===parent&&valid(m.theme))apply(m.theme);}else if(m.ready){const frame=frames().find(f=>f.contentWindow===e.source);if(frame)send(frame);}});
window.addEventListener('storage',e=>{if(e.key===key()&&!embedded)apply(preferred());});document.addEventListener('change',e=>{if(e.target.matches('[data-ux-theme]'))choose(e.target.value);});
function ready(){apply(current);if(embedded){parent.postMessage({channel:'mk-ux-theme',ready:true},'*');return;}mount();new MutationObserver(schedule).observe(document.body,{childList:true,subtree:true});}
apply(embedded?normalize(document.querySelector('meta[name="mukirana-theme"]')?.content)||'claro':preferred());if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',ready,{once:true});else ready();
})();
</script>
