<script>
(()=>{'use strict';const $=id=>document.getElementById(id),C=LNCore,esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=C.money,requests=new Map();let sequence=0,pack=null,investment=false,epoch=0,lastFocus=null;
const handset=/iPhone|iPod|Android.+Mobile/i.test(navigator.userAgent),tablet=!handset&&(/iPad|Tablet|Android(?!.*Mobile)/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1)),phone=document.querySelector('meta[name="mukirana-interface"]')?document.querySelector('meta[name="mukirana-interface"]').content==='phone':handset||!tablet&&(/iPhone|iPod|Android.+Mobile/i.test(navigator.userAgent)||(matchMedia('(pointer:coarse)').matches&&Math.min(screen.width,screen.height)<768));document.body.classList.toggle('is-phone',phone);document.body.dataset.interface=phone?'phone':'large';
function call(type,value){return new Promise((resolve,reject)=>{const id=++sequence,timer=setTimeout(()=>{requests.delete(id);reject(Error('A resposta demorou. Tente novamente.'));},90000);requests.set(id,{resolve,reject,timer});parent.postMessage({channel:'mk-painel',type,value,requestId:id},'*');});}
window.addEventListener('message',e=>{if(e.source!==parent||e.data?.channel!=='mk-painel')return;const m=e.data;if(m.type==='refresh'){load();return;}const r=requests.get(m.requestId);if(!r)return;clearTimeout(r.timer);requests.delete(m.requestId);m.ok?r.resolve(m.data):r.reject(Error(m.error));});
const monthName=m=>new Date(m+'-01T12:00:00Z').toLocaleDateString('pt-BR',{month:phone?'short':'long',year:'numeric'}),ratio=(a,b)=>Number(b)>0?Math.min(100,Math.max(0,Number(a)/Number(b)*100)):0;
function draw(){if(!pack)return;$('mount').innerHTML='';$('mount').append($(phone?'phone-template':'desktop-template').content.cloneNode(true));$('include-investment').checked=investment;const s=PainelCore.compute(pack,investment,C);$('period').textContent=(pack.period.start?monthName(pack.period.start):'Início do histórico')+' — '+(pack.period.end?monthName(pack.period.end):'todos os meses')+' · '+(investment?'Todas as contas':'Consumo e Crédito');
$('months').innerHTML=s.months.map(m=>`<button class="card" data-month="${m.month}" aria-pressed="${pack.period.start===m.month&&pack.period.end===m.month}"><span class="month-name">${monthName(m.month)}</span><strong class="${C.compare(m.resultCents,'0')<0?'negative':''}">${money(m.resultCents)}</strong><small>Receitas ${money(m.incomeCents)}<br>Despesas ${money(m.expenseCents)}</small></button>`).join('');
$('positions').innerHTML=s.positions.map((p,i)=>`<button class="card" data-position="${i}"><span><small>${['Disponível em Consumo','Saldo dos cartões','Patrimônio em Investimento'][i]}</small>${phone?'':'<small>Efetivado até '+new Date(pack.today+'T12:00:00Z').toLocaleDateString('pt-BR')+'</small>'}</span><strong class="${C.compare(p.currentCents,'0')<0?'negative':''}">${money(p.currentCents)}</strong>${!phone&&i===2?'<small>Movimento no período '+money(p.periodCents)+'</small>':''}</button>`).join('');
$('categories').innerHTML=s.categories.map(c=>`<div class="line"><button data-category="${esc(c.id)}">${esc(c.name)}</button><strong>${money(c.cents)}</strong></div><div class="bar"><i style="width:${ratio(c.cents,s.consumption.expenseCents)}%"></i></div>`).join('')||'<p class="muted note">Nenhuma despesa no recorte.</p>';$('commitment').textContent=s.commitment;
$('goals').innerHTML=s.goals.slice(0,3).map(g=>`<div class="line"><button data-goal="${g.category}">${esc(g.name)}<small style="display:block">${g.income?'Mínimo':'Teto'} ${money(g.targetCents)} · ${g.months} mês(es)</small></button><strong class="${C.compare(g.differenceCents,'0')<0?'negative':'positive'}">${money(g.actualCents)}</strong></div><div class="bar"><i style="width:${ratio(g.actualCents,g.targetCents)}%"></i></div><small>${C.compare(g.differenceCents,'0')<0?g.income?'Faltam ':'Excesso de ':g.income?'Acima do objetivo: ':'Disponível no teto: '}${money(g.differenceCents.replace(/^-/,'')).replace('− ','')}</small>`).join('')||'<p class="muted note">Defina mínimos de receitas e tetos de despesas por categoria.</p>';
$('acertar').hidden=s.receivableCents==='0'&&s.payableCents==='0'&&!s.approvalCount&&!(pack.rateios?.settlements||[]).some(a=>a.canAttach||a.canReject);
$('acertar').innerHTML=`<div><h2>A acertar</h2><p><strong>${money(s.receivableCents)}</strong> a receber · <strong>${money(s.payableCents)}</strong> a pagar</p><small>${s.approvalCount?s.approvalCount+' aprovação(ões) pendente(s)':'Saldos acumulados entre pessoas'}</small></div><button class="btn" data-rateios="true">Ver rateios e acertos →</button>`;
}
async function load(){const current=++epoch;try{const [p,state]=await Promise.all([call('load'),call('state')]);if(current!==epoch)return;pack=p;investment=state.investment;draw();if(state.goals)goal('new');}catch(e){if(current!==epoch)return;pack=null;$('mount').innerHTML='<div class="empty"><h2>Não foi possível carregar o painel</h2><p class="error">'+esc(e.message)+'</p><button class="btn" data-retry="true">Tentar novamente</button></div>';}}
function close(){$('overlay').hidden=true;$('mount').inert=false;lastFocus?.focus();}
function sheet(title,html){lastFocus=document.activeElement;$('sheet').innerHTML='<header><h2 id="sheet-title">'+esc(title)+'</h2><button class="btn" data-close="true" aria-label="Fechar detalhe">×</button></header>'+html;$('overlay').hidden=false;$('mount').inert=true;setTimeout(()=>$('sheet').querySelector('input,select,button')?.focus(),0);}
function categoryDetail(id){const s=PainelCore.compute(pack,investment,C),items=s.analysisRows.filter(r=>r.type==='expense'&&(id==='others'?!s.categories.filter(c=>c.id!=='others').some(c=>r.category===c.id||r.categoryPath.includes(c.id)):r.category===id||r.categoryPath.includes(id))),name=s.categories.find(c=>c.id===id)?.name||'Despesas';sheet(name,`<p class="note muted">Valores pessoais do período, incluindo sua participação nos rateios. Pagamentos e recebimentos de acerto não geram novo consumo.</p>${items.map(r=>`<div class="line"><span>${esc(r.description)}<small style="display:block">${new Date(r.date+'T12:00:00Z').toLocaleDateString('pt-BR')}${r.special==='participation'?' · Sua participação':''}</small></span><strong>${money(r.amountCents)}</strong></div>`).join('')}<div class="line"><span>Total</span><strong>${money(items.reduce((v,r)=>C.add(v,r.amountCents),'0'))}</strong></div>${items.some(r=>r.special==='participation')?'<button class="btn" data-rateios="true">Ver rateios e categorias pessoais</button>':''}`);}
function goal(category){const operationId=crypto.randomUUID(),dirty=new Set();let family=[];
 sheet('Metas mensais',`<form id="goal-form"><p class="note muted">Receitas usam mínimos; despesas usam tetos. O valor configurado se aplica a cada mês completo consultado.</p><label>Categoria<select id="goal-category" required><option value="">Selecione</option>${pack.categories.filter(c=>c.active).map(c=>`<option value="${c.id}" ${c.id===category?'selected':''}>${esc(c.name)} · ${esc(c.type)}</option>`).join('')}</select></label><div id="goal-family"></div><p class="note muted">Zero desativa a meta. Subtetos são limites adicionais, sem reservar dinheiro. Sem teto na principal, ela acompanha a soma das filhas; um teto manual maior é preservado.</p><p class="error" id="goal-error" role="alert"></p><footer><button type="button" class="btn" data-close="true">Fechar</button><button class="btn primary" type="submit">Salvar metas</button></footer></form>`);
 function familyFields(){dirty.clear();const selected=pack.categories.find(c=>c.id===$('goal-category').value);if(!selected){$('goal-family').innerHTML='';family=[];return;}const parent=pack.categories.find(c=>c.id===(selected.parent||selected.id));family=[parent,...pack.categories.filter(c=>c.parent===parent.id&&c.active)];$('goal-family').innerHTML=family.map((c,i)=>{const g=pack.goals.find(g=>g.category===c.id);return `<label>${i?'↳ ':''}${esc(c.name)} · ${c.type==='Receita'?'mínimo':'teto'}${g?.automatic?' automático':''}<input id="goal-amount${c.id===selected.id?'':'-'+c.id}" data-goal-value="${c.id}" inputmode="decimal" value="${g?(Number(g.amountCents)/100).toFixed(2).replace('.',','):'0,00'}" required></label>`;}).join('');$('goal-family').oninput=e=>{if(e.target.dataset.goalValue)dirty.add(e.target.dataset.goalValue);};}
 $('goal-category').onchange=familyFields;familyFields();$('goal-form').onsubmit=async e=>{e.preventDefault();const buttons=[...$('goal-form').querySelectorAll('button')];buttons.forEach(b=>b.disabled=true);try{const goals=[...$('goal-family').querySelectorAll('[data-goal-value]')].filter(i=>dirty.has(i.dataset.goalValue)).map(input=>{const raw=input.value.trim();if(!/^\d+(?:,\d{1,2})?$/.test(raw))throw Error('Use um valor como 1500,00.');const [whole,fraction='']=raw.split(',');return {category:input.dataset.goalValue,amountCents:String(Number(whole)*100+Number(fraction.padEnd(2,'0')))};});if(!goals.length){if(!family.length)throw Error('Escolha uma categoria.');close();return;}await call('goal',{action:'goals',goals,operationId});close();await load();}catch(err){$('goal-error').textContent=err.message;}finally{buttons.forEach(b=>b.disabled=false);}};}
document.addEventListener('change',e=>{if(e.target.id==='include-investment'){investment=e.target.checked;call('investment',investment).then(draw).catch(err=>sheet('Não foi possível alterar',esc(err.message)));}});
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;try{const d=b.dataset;if(d.close)close();if(d.retry)load();if(d.month)await call('month',d.month);if(d.rateios)await call('navigate',{route:'Lancamentos',rateios:true});if(d.category)categoryDetail(d.category);if(d.goal)goal(d.goal);if(d.position){const p=PainelCore.compute(pack,investment,C).positions[Number(d.position)];sheet(['Disponível em Consumo','Saldo dos cartões','Patrimônio em Investimento'][Number(d.position)],`<p class="note muted">Posição atual: somente movimentos efetivados até hoje. Projeção: registros e previsões até o final do período global.</p>${p.items.map(a=>`<div class="line"><span>${esc(a.name)}</span><strong>${money(a.currentCents)}</strong></div>`).join('')||'<p class="note">Sem contas deste tipo.</p>'}<div class="line"><span>Movimento no período</span><strong>${money(p.periodCents)}</strong></div><div class="line"><span>Saldo projetado</span><strong>${money(p.forecastCents)}</strong></div><p class="note muted">Crédito negativo representa dívida; positivo representa saldo a favor. O movimento de Investimento não é rentabilidade.</p><button class="btn primary" data-accounts-type="${esc(p.type)}">Ver contas</button>`);}if(d.accountsType)await call('navigate',{route:'Contas',type:d.accountsType});}catch(err){sheet('Não foi possível concluir','<p class="error">'+esc(err.message)+'</p>');}});
document.addEventListener('keydown',e=>{if($('overlay').hidden)return;if(e.key==='Escape'){e.preventDefault();close();}if(e.key==='Tab'){const focus=[...$('sheet').querySelectorAll('button,input,select')].filter(x=>!x.disabled),first=focus[0],last=focus.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});load();})();
</script>
