<script>
(()=>{'use strict';const $=id=>document.getElementById(id),C=LNCore,esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=C.money,requests=new Map();let sequence=0,pack=null,investment=false,epoch=0,lastFocus=null;
const handset=/iPhone|iPod|Android.+Mobile/i.test(navigator.userAgent),tablet=!handset&&(/iPad|Tablet|Android(?!.*Mobile)/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1)),phone=document.querySelector('meta[name="mukirana-interface"]')?document.querySelector('meta[name="mukirana-interface"]').content==='phone':handset||!tablet&&(/iPhone|iPod|Android.+Mobile/i.test(navigator.userAgent)||(matchMedia('(pointer:coarse)').matches&&Math.min(screen.width,screen.height)<768));document.body.classList.toggle('is-phone',phone);document.body.dataset.interface=phone?'phone':'large';
function call(type,value){return new Promise((resolve,reject)=>{const id=++sequence,timer=setTimeout(()=>{requests.delete(id);reject(Error('A resposta demorou. Tente novamente.'));},90000);requests.set(id,{resolve,reject,timer});parent.postMessage({channel:'mk-painel',type,value,requestId:id},'*');});}
window.addEventListener('message',e=>{if(e.source!==parent||e.data?.channel!=='mk-painel')return;const m=e.data;if(m.type==='refresh'){load();return;}const r=requests.get(m.requestId);if(!r)return;clearTimeout(r.timer);requests.delete(m.requestId);m.ok?r.resolve(m.data):r.reject(Error(m.error));});
const monthName=m=>new Date(m+'-01T12:00:00Z').toLocaleDateString('pt-BR',{month:phone?'short':'long',year:'numeric'}),ratio=(a,b)=>Number(b)>0?Math.min(100,Math.max(0,Number(a)/Number(b)*100)):0;
const badge=(signal,text)=>`<span class="signal signal-badge" data-signal="${signal}">${esc(text)}</span>`,abs=value=>value.replace(/^-/,'');
let chartMode='three',chartAccount='all',selectedWealthMonth='';
const chartMonth=(month,long=false)=>new Date(month+'-01T12:00:00Z').toLocaleDateString('pt-BR',{month:long?'long':'short',timeZone:'UTC'}).replace('.','');
const dateLabel=date=>new Date(date+'T12:00:00Z').toLocaleDateString('pt-BR',{timeZone:'UTC'});
function goalLabel(g){const comparison=C.compare(g.actualCents,g.targetCents),pct=Number(g.targetCents)>0?Math.floor(Number(g.actualCents)/Number(g.targetCents)*100):0;return g.income?(comparison>=0?'Mínimo atingido':pct+'% do mínimo'):(comparison>0?'Teto excedido':pct+'% do teto');}
function draw(){
 if(!pack)return;
 $('mount').innerHTML='';$('mount').append($(phone?'phone-template':'desktop-template').content.cloneNode(true));$('include-investment').checked=investment;
 const s=PainelCore.compute(pack,investment,C),reference=pack.wealth.reference,now=pack.today.slice(0,7);
 $('period').textContent=(pack.period.start?monthName(pack.period.start):'Início do histórico')+' — '+(pack.period.end?monthName(pack.period.end):'todos os meses')+' · '+(investment?'Todas as contas':'Consumo e Crédito');
 $('months').innerHTML=s.months.map((m,i)=>{
  const signal=PainelCore.balanceSignal(m.resultCents,C),comparison=C.compare(m.resultCents,'0'),label=['Mês anterior',reference===now?'Mês atual':'Mês selecionado','Próximo mês'][i];
  return `<button class="card signal" data-signal="${signal}" data-month="${m.month}" aria-pressed="${pack.period.start===m.month&&pack.period.end===m.month}"><span class="card-title">${label}</span><span class="month-name">${monthName(m.month)}</span><strong class="metric">${money(m.resultCents)}</strong>${badge(signal,comparison<0?'Resultado negativo':comparison===0?'Sem margem':'Resultado positivo')}<small class="month-detail">Receitas ${money(m.incomeCents)}<br>Despesas ${money(m.expenseCents)}${m.month>now?'<br>Resultado previsto':''}</small></button>`;
 }).join('');
 $('positions').innerHTML=s.positions.map((p,i)=>`<button class="card signal" data-signal="${PainelCore.balanceSignal(p.currentCents,C)}" data-position="${i}"><span class="card-title">${['Disponível em Consumo','Saldo dos cartões','Patrimônio atual'][i]}</span><small>${i===2?'Contas de investimento · ':''}Efetivado até ${dateLabel(pack.today)}</small><strong class="metric">${money(p.currentCents)}</strong>${badge(PainelCore.balanceSignal(p.currentCents,C),C.compare(p.currentCents,'0')<0?(i===1?'Faturas a pagar':'Saldo negativo'):p.currentCents==='0'?'Saldo zerado':i===1?'Saldo a favor':'Saldo positivo')}${i===2?'<small class="month-detail">Movimento no período '+money(p.periodCents)+'</small>':''}</button>`).join('');
 const accountsTotal=s.positions.reduce((sum,p)=>C.add(sum,p.currentCents),'0');$('positions').insertAdjacentHTML('afterbegin',`<button class="card signal accounts-total" data-signal="${PainelCore.balanceSignal(accountsTotal,C)}" data-accounts-total><span class="card-title">Saldo das contas</span><small>Consumo + Crédito + Investimento · efetivado até ${dateLabel(pack.today)}</small><strong class="metric">${money(accountsTotal)}</strong><small>Inclui os saldos iniciais. Transferências entre suas contas se anulam.</small></button>`);
 const net=C.add(s.receivableCents,C.negate(s.payableCents)),pending=(pack.rateios?.settlements||[]).filter(a=>a.canAttach||a.canReject).length,signal=net==='0'?(s.payableCents!=='0'||s.approvalCount||pending?'warning':'good'):PainelCore.balanceSignal(net,C),netLabel=C.compare(net,'0')>0?'A receber líquido':C.compare(net,'0')<0?'A pagar líquido':s.payableCents!=='0'?'Saldos entre pessoas':s.approvalCount||pending?'Conferências pendentes':'Em dia';
 $('positions').insertAdjacentHTML('beforeend',`<button class="card rateio-card signal" data-signal="${signal}" data-rateios="true" aria-label="Saldo do rateio: ${esc(money(abs(net)))} ${netLabel.toLowerCase()}. Abrir Rateios e acertos"><span class="card-top"><span class="card-title">Saldo do rateio</span><span class="card-arrow" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 18 18 6M6 6h12v12"/></svg></span></span><small>Acumulado entre pessoas · abrir rateios</small><strong class="metric">${C.compare(net,'0')>0?'+ ':''}${money(net)}</strong>${badge(signal,netLabel)}<span class="rateio-split"><span>A receber<b class="positive">${money(s.receivableCents)}</b></span><span>A pagar<b class="negative">${money(s.payableCents)}</b></span></span>${s.approvalCount||pending?'<small class="rateio-status">'+s.approvalCount+' aprovação(ões) · '+pending+' acerto(s) para conferir</small>':''}</button>`);
 $('categories').innerHTML=s.categories.map(c=>`<div class="line"><button data-category="${esc(c.id)}">${esc(c.name)}</button><strong>${money(c.cents)}</strong></div><div class="bar"><i style="width:${ratio(c.cents,s.consumption.expenseCents)}%"></i></div>`).join('')||'<p class="muted note">Nenhuma despesa no recorte.</p>';
 $('commitment').innerHTML=s.commitmentSignal?badge(s.commitmentSignal,s.commitment):esc(s.commitment);
 $('goals').innerHTML=s.goals.slice(0,3).map(g=>{const signal=PainelCore.goalSignal(g,C),negative=C.compare(g.differenceCents,'0')<0;return `<article class="goal signal" data-signal="${signal}"><div class="goal-heading"><button data-goal="${g.category}">${esc(g.name)}</button>${badge(signal,goalLabel(g))}</div><div class="goal-values"><strong class="signal-number">${money(g.actualCents)}</strong><span>${g.income?'Mínimo':'Teto'} ${money(g.targetCents)}</span></div><div class="bar" role="meter" aria-label="${esc(g.name)}" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${ratio(g.actualCents,g.targetCents)}" aria-valuetext="${esc(goalLabel(g))}; ${esc(money(g.actualCents))} de ${esc(money(g.targetCents))}"><i style="width:${ratio(g.actualCents,g.targetCents)}%"></i></div><p class="note muted">${negative?g.income?'Faltam ':'Excesso de ':g.income?'Acima do objetivo: ':'Disponível no teto: '}${money(abs(g.differenceCents))}<br>${g.months} mês(es) · ${money(g.amountCents)} por mês</p></article>`;}).join('')||'<p class="muted note">Defina mínimos de receitas e tetos de despesas por categoria.</p>';
 const options=pack.wealth.accounts;
 if(chartAccount!=='all'&&!options.some(a=>a.id===chartAccount))chartAccount='all';
 $('wealth-account').innerHTML='<option value="all">Todas as contas</option>'+options.map(a=>`<option value="${esc(a.id)}">${esc(a.name)}${a.active?'':' · inativa'}</option>`).join('');$('wealth-account').value=chartAccount;$('wealth-account').disabled=!options.length;
 drawChart();
}
function wealthPoints(){
 const accounts=pack.wealth.accounts.filter(a=>chartAccount==='all'||a.id===chartAccount);
 return PainelCore.chartMonths(pack.wealth.reference,chartMode).map(month=>{const date=month===pack.today.slice(0,7)?pack.today:PainelCore.monthEnd(month);return {month,date,projected:month>pack.today.slice(0,7),cents:accounts.reduce((sum,a)=>{const p=a.points.find(p=>p.month===month);if(!p||!C.cents(p.cents))throw Error('Patrimônio indisponível. Atualize o painel.');return C.add(sum,p.cents);},'0')};});
}
const pointLabel=p=>p.projected?'Projetado':p.month===pack.today.slice(0,7)?'Até '+dateLabel(p.date):'Realizado';
function drawChart(){
 const target=$('wealth-body'),scroll=target.querySelector('.chart-months')?.scrollLeft||0;
 document.querySelectorAll('[data-chart-mode]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.chartMode===chartMode));
 if(!pack.wealth.accounts.length){target.innerHTML='<div class="empty"><h3>Seu patrimônio começa nas contas de investimento</h3><p class="note muted">Nenhuma conta sua está classificada como Investimento. Revise os tipos das contas para acompanhar a evolução.</p><button class="btn" data-accounts-type="Investimento">Ver contas</button></div>';return;}
 const points=wealthPoints(),keys=points.map(p=>p.month);
 if(!keys.includes(selectedWealthMonth))selectedWealthMonth=keys.includes(pack.wealth.reference)?pack.wealth.reference:keys[0];
 const selected=points.find(p=>p.month===selectedWealthMonth),diff=C.add(points.at(-1).cents,C.negate(points[0].cents)),signal=PainelCore.balanceSignal(diff,C);
 const width=phone?340:960,height=phone?240:250,left=phone?48:62,right=phone?25:30,top=24,bottom=40,values=points.map(p=>Number(p.cents)),min=Math.min(...values,0),max=Math.max(...values,100)*1.2,span=max-min;
 const x=i=>left+i*(width-left-right)/(points.length-1),y=value=>top+(max-value)/span*(height-top-bottom),path=ps=>ps.map((p,i)=>(i?'L':'M')+x(keys.indexOf(p.month)).toFixed(1)+','+y(Number(p.cents)).toFixed(1)).join(' '),actual=points.filter(p=>!p.projected),future=points.filter(p=>p.projected),projected=future.length&&actual.length?[actual.at(-1),...future]:future;
 const area=path(points)+` L${x(points.length-1)},${y(0)} L${x(0)},${y(0)} Z`,tickEvery=Math.ceil(points.length/(phone?4:12)),compact=value=>(value/100).toLocaleString('pt-BR',{notation:'compact',maximumFractionDigits:1});
 target.innerHTML=`<div class="chart-summary"><div><small>${esc(pointLabel(selected))} · ${chartMonth(selected.month,true)} de ${selected.month.slice(0,4)}</small><strong class="signal-number signal" data-signal="${PainelCore.balanceSignal(selected.cents,C)}">${money(selected.cents)}</strong>${badge(signal,(C.compare(diff,'0')>0?'+ ':'')+money(diff)+' no intervalo')}</div><div class="chart-range">${chartMonth(keys[0],true)} ${keys[0].slice(0,4)} — ${chartMonth(keys.at(-1),true)} ${keys.at(-1).slice(0,4)}</div></div><div class="chart-plot"><span class="chart-unit">Saldo (R$)</span><svg viewBox="0 0 ${width} ${height}" role="img" aria-labelledby="wealth-svg-title wealth-svg-description"><title id="wealth-svg-title">Evolução patrimonial em ${points.length} meses</title><desc id="wealth-svg-description">${points.map(p=>chartMonth(p.month,true)+' de '+p.month.slice(0,4)+': '+money(p.cents)+', '+pointLabel(p)).join('; ')}. Selecione um mês abaixo para consultar seu valor.</desc><defs><linearGradient id="wealth-fill" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="var(--ux-primary)" stop-opacity=".15"/><stop offset="100%" stop-color="var(--ux-primary)" stop-opacity="0"/></linearGradient></defs>${Array.from({length:4},(_,i)=>{const v=min+span*i/3;return `<line class="chart-grid" x1="${left}" y1="${y(v)}" x2="${width-right}" y2="${y(v)}"/><text class="chart-axis" x="${left-9}" y="${y(v)+4}" text-anchor="end">${compact(v)}</text>`;}).join('')}<path d="${area}" fill="url(#wealth-fill)"/>${actual.length?'<path class="chart-line" d="'+path(actual)+'"/>':''}${projected.length?'<path class="chart-line projected" d="'+path(projected)+'"/>':''}${points.map((p,i)=>`<circle class="chart-dot ${p.month===selectedWealthMonth?'is-selected':''}" cx="${x(i)}" cy="${y(Number(p.cents))}" r="${p.month===selectedWealthMonth?5:3.5}"><title>${chartMonth(p.month,true)}: ${money(p.cents)} · ${pointLabel(p)}</title></circle>${i%tickEvery===0||i===points.length-1?'<text class="chart-axis" x="'+x(i)+'" y="'+(height-12)+'" text-anchor="middle">'+chartMonth(p.month)+'</text>':''}`).join('')}</svg></div><div class="chart-months" role="group" aria-label="Valores mensais do patrimônio">${points.map(p=>`<button data-wealth-month="${p.month}" aria-pressed="${p.month===selectedWealthMonth}" aria-label="${chartMonth(p.month,true)} de ${p.month.slice(0,4)}, ${money(p.cents)}, ${pointLabel(p)}"><span>${chartMonth(p.month)}</span><b>${money(p.cents)}</b><small>${pointLabel(p)}</small></button>`).join('')}</div><div class="wealth-selection" role="status" aria-live="polite">${chartMonth(selected.month,true)}: ${money(selected.cents)} · ${pointLabel(selected)}${selected.projected?' — lançamentos e recorrências previstos; sem presumir rendimentos.':''}</div><div class="chart-footer"><div class="chart-key"><span><i></i>Realizado</span><span><i class="dashed"></i>Projetado</span></div><button data-wealth-table>Ver dados do gráfico →</button></div>`;
 target.querySelector('.chart-months').scrollLeft=scroll;
}
function wealthTable(){sheet('Dados da evolução patrimonial',`<p class="note muted">${esc(chartAccount==='all'?'Todas as suas contas de investimento':pack.wealth.accounts.find(a=>a.id===chartAccount).name)}. Histórico: efetivados até o fechamento; mês atual: até hoje. Futuro: lançamentos e recorrências previstos. A variação inclui aportes e resgates; não equivale à rentabilidade. O filtro do gráfico não altera o período global.</p><table><thead><tr><th>Mês</th><th>Patrimônio</th><th>Posição</th></tr></thead><tbody>${wealthPoints().map(p=>`<tr><td>${chartMonth(p.month)} ${p.month.slice(0,4)}</td><td>${money(p.cents)}</td><td>${pointLabel(p)}</td></tr>`).join('')}</tbody></table>`);}
function signalRules(){sheet('Como interpretar as cores',`<p class="note muted">Cada cor vem acompanhada de texto e valores. Os indicadores não bloqueiam lançamentos.</p><div class="goal">${badge('good','Verde · em dia')}<p class="note">Resultado positivo, saldo a receber, patrimônio crescente; despesa abaixo de 80% do teto ou receita com mínimo atingido.</p></div><div class="goal">${badge('warning','Amarelo · acompanhar')}<p class="note">Resultado zerado, patrimônio estável; despesa de 80% a 100% do teto ou receita de 80% a menos de 100% do mínimo.</p></div><div class="goal">${badge('danger','Vermelho · atenção')}<p class="note">Resultado negativo, saldo a pagar, redução patrimonial; despesa acima do teto ou receita abaixo de 80% do mínimo.</p></div><p class="note muted">Na evolução patrimonial, a diferença compara o último com o primeiro mês visível. A variação não representa rentabilidade. O saldo líquido do rateio resume valores entre pessoas, sem quitar dívidas cruzadas nem aumentar o dinheiro disponível. Aprovações e acertos pendentes permanecem sinalizados.</p>`);}

async function load(){const current=++epoch;try{const [p,state]=await Promise.all([call('load'),call('state')]);if(current!==epoch)return;pack=p;investment=state.investment;draw();if(state.goals)goal('new');}catch(e){if(current!==epoch)return;pack=null;$('mount').innerHTML='<div class="empty"><h2>Não foi possível carregar o painel</h2><p class="error">'+esc(e.message)+'</p><button class="btn" data-retry="true">Tentar novamente</button></div>';}}
function close(){$('overlay').hidden=true;$('mount').inert=false;lastFocus?.focus();}
function sheet(title,html){lastFocus=document.activeElement;$('sheet').innerHTML='<header><h2 id="sheet-title">'+esc(title)+'</h2><button class="btn" data-close="true" aria-label="Fechar detalhe">×</button></header>'+html;$('overlay').hidden=false;$('mount').inert=true;setTimeout(()=>$('sheet').querySelector('input,select,button')?.focus(),0);}
function categoryDetail(id){const s=PainelCore.compute(pack,investment,C),items=s.analysisRows.filter(r=>r.type==='expense'&&(id==='others'?!s.categories.filter(c=>c.id!=='others').some(c=>r.category===c.id||r.categoryPath.includes(c.id)):r.category===id||r.categoryPath.includes(id))),name=s.categories.find(c=>c.id===id)?.name||'Despesas';sheet(name,`<p class="note muted">Valores pessoais do período, incluindo sua participação nos rateios. Pagamentos e recebimentos de acerto não geram novo consumo.</p>${items.map(r=>`<div class="line"><span>${esc(r.description)}<small style="display:block">${new Date(r.date+'T12:00:00Z').toLocaleDateString('pt-BR')}${r.special==='participation'?' · Sua participação':''}</small></span><strong>${money(r.amountCents)}</strong></div>`).join('')}<div class="line"><span>Total</span><strong>${money(items.reduce((v,r)=>C.add(v,r.amountCents),'0'))}</strong></div>${items.some(r=>r.special==='participation')?'<button class="btn" data-rateios="true">Ver rateios e categorias pessoais</button>':''}`);}
function goal(category){const operationId=crypto.randomUUID(),dirty=new Set();let family=[];
 sheet('Metas mensais',`<form id="goal-form"><p class="note muted">Receitas usam mínimos; despesas usam tetos. O valor configurado se aplica a cada mês completo consultado.</p><label>Categoria<select id="goal-category" required><option value="">Selecione</option>${pack.categories.filter(c=>c.active).map(c=>`<option value="${c.id}" ${c.id===category?'selected':''}>${esc(c.name)} · ${esc(c.type)}</option>`).join('')}</select></label><div id="goal-family"></div><p class="note muted">Zero desativa a meta. Subtetos são limites adicionais, sem reservar dinheiro. Sem teto na principal, ela acompanha a soma das filhas; um teto manual maior é preservado.</p><p class="error" id="goal-error" role="alert"></p><footer><button type="button" class="btn" data-close="true">Fechar</button><button class="btn primary" type="submit">Salvar metas</button></footer></form>`);
 function familyFields(){dirty.clear();const selected=pack.categories.find(c=>c.id===$('goal-category').value);if(!selected){$('goal-family').innerHTML='';family=[];return;}const parent=pack.categories.find(c=>c.id===(selected.parent||selected.id));family=[parent,...pack.categories.filter(c=>c.parent===parent.id&&c.active)];$('goal-family').innerHTML=family.map((c,i)=>{const g=pack.goals.find(g=>g.category===c.id);return `<label>${i?'↳ ':''}${esc(c.name)} · ${c.type==='Receita'?'mínimo':'teto'}${g?.automatic?' automático':''}<input id="goal-amount${c.id===selected.id?'':'-'+c.id}" data-goal-value="${c.id}" inputmode="decimal" value="${g?(Number(g.amountCents)/100).toFixed(2).replace('.',','):'0,00'}" required></label>`;}).join('');$('goal-family').oninput=e=>{if(e.target.dataset.goalValue)dirty.add(e.target.dataset.goalValue);};}
 $('goal-category').onchange=familyFields;familyFields();$('goal-form').onsubmit=async e=>{e.preventDefault();const buttons=[...$('goal-form').querySelectorAll('button')];buttons.forEach(b=>b.disabled=true);try{const goals=[...$('goal-family').querySelectorAll('[data-goal-value]')].filter(i=>dirty.has(i.dataset.goalValue)).map(input=>{const raw=input.value.trim();if(!/^\d+(?:,\d{1,2})?$/.test(raw))throw Error('Use um valor como 1500,00.');const [whole,fraction='']=raw.split(',');return {category:input.dataset.goalValue,amountCents:String(Number(whole)*100+Number(fraction.padEnd(2,'0')))};});if(!goals.length){if(!family.length)throw Error('Escolha uma categoria.');close();return;}await call('goal',{action:'goals',goals,operationId});close();await load();}catch(err){$('goal-error').textContent=err.message;}finally{buttons.forEach(b=>b.disabled=false);}};}
document.addEventListener('change',e=>{if(e.target.id==='wealth-account'){chartAccount=e.target.value;drawChart();return;}if(e.target.id==='include-investment'){investment=e.target.checked;call('investment',investment).then(draw).catch(err=>sheet('Não foi possível alterar',esc(err.message)));}});
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;try{const d=b.dataset;if(d.chartMode){chartMode=d.chartMode;drawChart();return;}if(d.wealthMonth){selectedWealthMonth=d.wealthMonth;drawChart();document.querySelector('[data-wealth-month="'+selectedWealthMonth+'"]')?.focus({preventScroll:true});return;}if(b.hasAttribute('data-wealth-table')){wealthTable();return;}if(b.hasAttribute('data-signals')){signalRules();return;}if(d.close)close();if(d.retry)load();if(d.month)await call('month',d.month);if(d.rateios)await call('navigate',{route:'Lancamentos',rateios:true});if(d.category)categoryDetail(d.category);if(d.goal)goal(d.goal);if(d.position){const p=PainelCore.compute(pack,investment,C).positions[Number(d.position)];sheet(['Disponível em Consumo','Saldo dos cartões','Patrimônio em Investimento'][Number(d.position)],`<p class="note muted">Posição atual: somente movimentos efetivados até hoje. Projeção: registros e previsões até o final do período global.</p>${p.items.map(a=>`<div class="line"><span>${esc(a.name)}</span><strong>${money(a.currentCents)}</strong></div>`).join('')||'<p class="note">Sem contas deste tipo.</p>'}<div class="line"><span>Movimento no período</span><strong>${money(p.periodCents)}</strong></div><div class="line"><span>Saldo projetado</span><strong>${money(p.forecastCents)}</strong></div><p class="note muted">Crédito negativo representa dívida; positivo representa saldo a favor. O movimento de Investimento não é rentabilidade.</p><button class="btn primary" data-accounts-type="${esc(p.type)}">Ver contas</button>`);}if(b.hasAttribute('data-accounts-total'))await call('navigate',{route:'Contas'});if(d.accountsType)await call('navigate',{route:'Contas',type:d.accountsType});}catch(err){sheet('Não foi possível concluir','<p class="error">'+esc(err.message)+'</p>');}});
document.addEventListener('keydown',e=>{if($('overlay').hidden)return;if(e.key==='Escape'){e.preventDefault();close();}if(e.key==='Tab'){const focus=[...$('sheet').querySelectorAll('button,input,select')].filter(x=>!x.disabled),first=focus[0],last=focus.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});load();})();
</script>
