<title>Mukirana</title><script>/** Preferência visual local; nunca armazena e-mail, sessão ou credenciais. */
(() => {
  "use strict";
  const STORAGE_KEY = "mukirana.theme";
  const THEMES = ["light", "dark", "sepia"];
  let initialTheme = "light";
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (THEMES.includes(saved)) initialTheme = saved;
  } catch {
    // A interface permanece utilizável quando o navegador bloqueia armazenamento.
  }

  /** Aplica tokens sem recarregar a View ou interromper o formulário. */
  function applyTheme(theme) {
    if (!THEMES.includes(theme)) return;
    document.documentElement.dataset.theme = theme;
    document.dispatchEvent(new window.CustomEvent("mukirana:theme", { detail: { theme } }));
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.content = { light: "#faf8f4", dark: "#1c1b29", sepia: "#f1e5cf" }[theme];
  }
  applyTheme(initialTheme);
  document.addEventListener("DOMContentLoaded", () => {
    const select = document.getElementById("theme-select");
    if (!select) return;
    select.value = document.documentElement.dataset.theme;
    select.addEventListener("change", () => {
      applyTheme(select.value);
      try {
        localStorage.setItem(STORAGE_KEY, select.value);
      } catch {
        // Sem persistência, a escolha ainda vale durante a página atual.
      }
    });
  });
})();

<body><div id="app"></div><template id="mobile-template"><a class="skip-link" href="#access-title">Ir para o acesso</a>
<!-- Símbolos locais compartilhados pelos componentes visuais. -->
<svg
  xmlns="http://www.w3.org/2000/svg"
  aria-hidden="true"
  width="0"
  height="0"
  style="position: absolute"
>
  <defs>
    <symbol id="icon-arrow" viewBox="0 0 24 24"><path d="M4 12h15M13 6l6 6-6 6" /></symbol>

      <rect x="3" y="5" width="18" height="14" rx="3" />
      <path d="m4 7 8 6 8-6" />
    </symbol>
    <symbol id="icon-lock" viewBox="0 0 24 24">
      <rect x="5" y="10" width="14" height="11" rx="2" />
      <path d="M8 10V7a4 4 0 0 1 8 0v3M12 15v2" />

    <symbol id="icon-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6" /></symbol>
    <symbol id="icon-chevron" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6" /></symbol>

      <path d="M5 20C3 10 8 4 20 4c0 10-6 16-15 16ZM5 20 15 10" />
    </symbol>
  </defs>
</svg>

<div id="access-layout" class="mobile-shell">
  <header class="mobile-header">
    <div class="brand" aria-label="Mukirana">
      <svg class="brand-symbol" viewBox="0 0 40 40" aria-hidden="true">
        <rect x="1" y="1" width="38" height="38" rx="12" fill="var(--primary)" />
        <path
          d="M10 27V16c6 0 10 4 10 11V13c6 0 10 5 10 14"
          fill="none"
          stroke="var(--on-primary)"
          stroke-width="2.4"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
      <span class="brand-name">mukirana.</span>
    </div>
    <label class="theme-control" for="theme-select"
      ><span class="visually-hidden">Tema</span
      ><select id="theme-select" class="theme-select" name="theme">
        <option value="light">Claro</option>
        <option value="dark">Escuro</option>
        <option value="sepia">Sépia</option>
      </select></label
    >
  </header>
  <main class="mobile-main">
    <section id="loading-view" aria-labelledby="loading-title">
  <h1 id="loading-title" class="form-title" tabindex="-1">Abrindo seu espaço.</h1>
  <p id="loading-message" class="form-description" role="status">Conferindo seu acesso…</p>
  <button id="retry-session" class="primary-button" type="button" hidden>Tentar novamente</button>
</section>

    <section id="email-view" hidden aria-labelledby="access-title">
      <p class="mobile-kicker">Seu dinheiro, no seu ritmo</p>
      <h1 id="access-title" class="form-title" tabindex="-1">
        Um bom começo<br />para seus planos.
      </h1>
      <p class="form-description">Entre ou comece pelo seu e-mail.<br />Sem senhas para lembrar.</p>

        <label for="email">Seu e-mail</label>

          <svg class="icon" aria-hidden="true"><use href="#icon-mail" /></svg>

            id="email"
            name="email"
            type="email"
            placeholder="voce@exemplo.com"
            autocomplete="email"
            inputmode="email"
            enterkeyhint="go"
            autocapitalize="none"
            spellcheck="false"
            maxlength="254"
            required
            aria-describedby="email-hint email-error"
          />
        </div>
        <p id="email-hint" class="field-hint">Use um e-mail ao qual você tenha acesso.</p>
        <p id="email-error" class="field-error" role="alert" hidden></p>
        <button id="email-submit" class="primary-button" type="submit">
          <span>Receber meu código</span
          ><svg class="icon" aria-hidden="true"><use href="#icon-arrow" /></svg>
        </button>
      </form>
      <p class="access-note">
        <svg class="icon" aria-hidden="true"><use href="#icon-lock" /></svg>Seu acesso começa com um
        código de 6 dígitos.
      </p>
      <details class="explanation">
        <summary>
          Como funciona?<svg class="icon" aria-hidden="true"><use href="#icon-chevron" /></svg>
        </summary>
        <div class="explanation-content">
          <p>
            Você receberá um código por e-mail para entrar ou criar sua conta. Seu acesso continuará
            neste navegador. Prefira um dispositivo de confiança.
          </p>
          <p>
            O código vale por 10 minutos. Seu acesso dura até 30 dias neste navegador. Você pode
            encerrá-lo a qualquer momento.
          </p>
        </div>
      </details>
    </section>
    <section id="code-view" aria-labelledby="code-title" hidden>
      <nav class="mobile-step-nav" aria-label="Etapas do acesso">
        <button id="change-email" class="text-button" type="button">
          <svg class="icon" aria-hidden="true"><use href="#icon-arrow" /></svg>Alterar e-mail
        </button>
        <span class="mobile-step-number" aria-label="Etapa 2 de 2">02 / 02</span>
      </nav>
      <h1 id="code-title" class="form-title" tabindex="-1">
        Seu próximo passo<br />está no e-mail.
      </h1>
      <p class="form-description">
        Enviamos um código para <strong id="destination-email"></strong>.
      </p>
      <form id="code-form" novalidate>
        <label for="code">Seu código de 6 dígitos</label>
        <input
          id="code"
          class="code-input"
          name="code"
          type="text"
          inputmode="numeric"
          enterkeyhint="go"
          autocomplete="one-time-code"
          placeholder="000000"
          pattern="[0-9]{6}"
          maxlength="6"
          required
          aria-describedby="code-hint code-error"
        />
        <p id="code-hint" class="field-hint">Você pode digitar ou colar o código completo.</p>
        <p id="code-error" class="field-error" role="alert" hidden></p>
        <button id="code-submit" class="primary-button" type="submit">
          <span>Confirmar acesso</span
          ><svg class="icon" aria-hidden="true"><use href="#icon-arrow" /></svg>
        </button>
      </form>
      <div class="mobile-resend">
        <button id="resend-code" class="text-button" type="button" disabled>Reenviar código</button>
      </div>
      <p id="resend-status" class="status-message" role="status"></p>
      <p class="demo-note">
        O código vale por 10 minutos e pode ser usado uma única vez. Nunca compartilhe seu código.
      </p>
    </section>
    <section id="home-view" aria-labelledby="home-title" hidden>
  <p class="mobile-kicker">Seu espaço</p>
  <h1 id="home-title" class="form-title" tabindex="-1">Que bom<br />ter você aqui.</h1>
  <p class="form-description">Você entrou como <strong id="session-email"></strong>.</p>
  <p class="demo-note">Registre suas entradas e saídas e organize suas contas e categorias.</p>
  <button id="open-transactions" class="primary-button" type="button">Meus lançamentos</button>
  <button id="open-transfers" class="primary-button" type="button">Minhas transferências</button>
  <button id="open-accounts" class="primary-button" type="button">Minhas contas</button>
  <button id="open-categories" class="primary-button" type="button">Minhas categorias</button>
  <button id="open-tests" class="primary-button" type="button">Testar meu acesso</button>
  <details class="explanation session-options">
    <summary>Gerenciar meu acesso</summary>
    <div class="explanation-content">
      <p>Em um dispositivo compartilhado, saia ao terminar.</p>
      <button id="logout-current" class="text-button" type="button">Sair deste navegador</button>
      <button id="logout-all" class="text-button" type="button">
        Sair de todos os dispositivos
      </button>
    </div>
  </details>
  <p id="home-status" class="status-message" role="status"></p>
</section>
<section id="tests-view" aria-labelledby="tests-title" hidden>
  <nav class="mobile-step-nav">
    <button id="close-tests" class="text-button" type="button">Voltar ao meu espaço</button>
  </nav>
  <h1 id="tests-title" class="form-title" tabindex="-1">Seu acesso,<br />conferido.</h1>
  <p class="form-description">
  Selecione o que deseja conferir. Estes testes consultam os serviços reais e não alteram seus dados
  nem enviam e-mails.
</p>
<div id="tests-catalog"></div>
<button id="run-tests" class="primary-button" type="button" disabled>Executar selecionados</button>
<p id="tests-summary" class="status-message" role="status"></p>
<p id="tests-run" class="field-hint"></p>

</section>

    <p id="flow-status" class="visually-hidden" role="status"></p>
  </main>
  <footer class="mobile-footer">
    <p>Mukirana · versão 0.2.0</p>
  </footer>
</div>

<noscript>Ative o JavaScript para acessar o Mukirana.</noscript><script>/** Monta somente uma View; redimensionar ou girar não substitui o formulário em andamento. */
(() => {
  const smallScreen = Math.min(window.screen.width, window.screen.height) < 600;
  const mobile =
    window.matchMedia("(max-width: 599px)").matches ||
    (window.matchMedia("(pointer: coarse)").matches && smallScreen);
  const view = mobile ? "mobile" : "desktop";
  document.body.dataset.view = view;
  document
    .getElementById("app")
    .append(document.getElementById(view + "-template").content.cloneNode(true));
  // Templates de componentes internos precisam continuar disponíveis após montar a View.
  for (const name of ["mobile", "desktop"]) document.getElementById(name + "-template").remove();
})();

/** Ponte única para o controller Apps Script; falhas de transporte não são aprovação. */
const MukiranaApi = Object.freeze({
  call(request) {
    return new Promise((resolve, reject) => {
      if (!window.google?.script?.run) {
        reject(new Error("Abra o aplicativo pelo endereço publicado no Google."));
        return;
      }
      window.google.script.run
        .withSuccessHandler((result) => {
          if (!result || typeof result.status !== "string")
            reject(new Error("Resposta incompleta. Tente novamente."));
          else resolve(result);
        })
        .withFailureHandler(() => reject(new Error("A conexão falhou. Tente novamente.")))
        .api(request);
    });
  },
});

/** Apenas o token persiste; indisponibilidade do armazenamento mantém a sessão em memória. */
const MukiranaSession = (() => {
  const key = "mukirana.session";
  let token = "";
  return Object.freeze({
    read() {
      try {
        token = localStorage.getItem(key) || "";
      } catch {
        /* Navegação privada restrita. */
      }
      if (!/^[0-9a-f]{64}$/.test(token)) token = "";
      return token;
    },
    current: () => token,
    save(value) {
      token = value;
      try {
        localStorage.setItem(key, value);
        return true;
      } catch {
        return false;
      }
    },
    clear() {
      token = "";
      try {
        localStorage.removeItem(key);
      } catch {
        /* A sessão já foi revogada no servidor. */
      }
    },
  });
})();

</script>

<script>
/** Runner reutilizável: catálogo e asserções pertencem ao backend de cada módulo. */
const MukiranaDiagnostics = (() => {
  const labels = {
    passed: "Aprovado",
    failed: "Reprovado",
    blocked: "Bloqueado",
    skipped: "Ignorado",
    not_run: "Não executado",
  };
  let running = false;
  let catalog = [];
  let version = "";
  const nodes = new Map();
  const element = (id) => document.getElementById(id);
  async function load(onExpired) {
    if (running) return;
    element("run-tests").disabled = true;
    element("tests-summary").textContent = "Carregando cenários…";
    element("tests-run").textContent = "";
    element("tests-catalog").replaceChildren();
    nodes.clear();
    try {
      const result = await MukiranaApi.call({
        action: "tests.catalog",
        token: MukiranaSession.current(),
      });
      if (result.status === "invalid_session") {
        onExpired();
        return;
      }
      if (result.status !== "ready" || !Array.isArray(result.scenarios) || !result.scenarios.length)
        throw new Error();
      catalog = result.scenarios;
      version = result.version;
      catalog.forEach((scenario) => {
        const card = document.createElement("article");
        card.className = "test-card";
        const label = document.createElement("label");
        label.className = "test-choice";
        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = true;
        const title = document.createElement("span");
        title.textContent = scenario.title;
        label.append(checkbox, title);
        card.append(label);
        for (const content of [
          scenario.objective,
          "Esperado: " + scenario.expected,
          "Critério: " + scenario.criterion,
        ]) {
          const paragraph = document.createElement("p");
          paragraph.className = "field-hint";
          paragraph.textContent = content;
          card.append(paragraph);
        }
        const output = document.createElement("p");
        output.className = "test-result";
        output.textContent = labels.not_run;
        card.append(output);
        element("tests-catalog").append(card);
        nodes.set(scenario.id, { checkbox, output });
      });
      element("tests-summary").textContent = "Escolha um ou mais cenários para executar.";
      element("run-tests").disabled = false;
    } catch {
      element("tests-summary").textContent =
        "Não foi possível carregar os testes. Volte ao seu espaço e tente novamente.";
    }
  }
  async function run(onExpired) {
    if (running) return;
    const selected = catalog.filter((scenario) => nodes.get(scenario.id).checkbox.checked);
    if (!selected.length) {
      element("tests-summary").textContent = "Selecione ao menos um teste.";
      return;
    }
    running = true;
    element("run-tests").disabled = true;
    element("close-tests").disabled = true;
    nodes.forEach(({ checkbox, output }) => {
      checkbox.disabled = true;
      output.textContent = labels.not_run;
    });
    const runId = window.crypto.randomUUID();
    element("tests-run").textContent = "Versão " + version + " · Execução " + runId;
    const counts = { passed: 0, failed: 0, blocked: 0, not_run: selected.length };
    try {
      for (const [index, scenario] of selected.entries()) {
        element("tests-summary").textContent =
          "Executando " + (index + 1) + " de " + selected.length + "…";
        let result;
        try {
          result = await MukiranaApi.call({
            action: "tests.run",
            id: scenario.id,
            token: MukiranaSession.current(),
          });
        } catch {
          result = { status: "blocked", evidence: "A conexão falhou. Tente novamente." };
        }
        if (result.status === "invalid_session") {
          onExpired();
          break;
        }
        const status = ["passed", "failed", "blocked"].includes(result.status)
          ? result.status
          : "blocked";
        counts[status] += 1;
        counts.not_run -= 1;
        nodes.get(scenario.id).output.textContent =
          labels[status] + ". " + (result.evidence || "O serviço não concluiu a verificação.");
      }
      element("tests-summary").textContent =
        `${counts.passed} aprovados · ${counts.failed} reprovados · ${counts.blocked} bloqueados · ${counts.not_run} não executados.`;
    } finally {
      running = false;
      element("run-tests").disabled = false;
      element("close-tests").disabled = false;
      nodes.forEach(({ checkbox }) => {
        checkbox.disabled = false;
      });
    }
  }
  return Object.freeze({ load, run });
})();

/**
 * Controller de Contas compartilhado pelas Views homologadas.
 * O servidor valida sessão/propriedade; este módulo não persiste dados financeiros no navegador.

const MukiranaAccounts = (() => {

  dialog.addEventListener("cancel", (event) => {
    event.preventDefault();
    closeDialog(false);
  });

  function empty(title, description, label, action) {
    const node = element("empty-template").content.cloneNode(true);
    node.querySelector('[data-field="title"]').textContent = title;
    node.querySelector('[data-field="description"]').textContent = description;
    const button = node.querySelector("button");
    button.textContent = label;

    element("list-state").append(node);
  }
  function render() {
    element("accounts-list").replaceChildren();
    element("list-state").replaceChildren();
    const query = element("search").value.trim().toLocaleLowerCase("pt-BR");
    const matches = state.accounts.filter(
      (account) =>
        (state.filter === "all" || account.type === state.filter) &&
        account.name.toLocaleLowerCase("pt-BR").includes(query),
    );
    all("[data-filter]").forEach((button) => {
      const type = button.dataset.filter;
      const count = state.accounts.filter((item) => type === "all" || item.type === type).length;
      button.querySelector(".filter-count").textContent = count;
      button.setAttribute("aria-pressed", String(state.filter === type));
      button.disabled = state.scenario === "loading";
    });
    const ready = !["loading", "error"].includes(state.scenario);
    all('[data-action="new"]').forEach((button) => {
      button.disabled = !ready;

    element("search").disabled = !ready;
    if (element("table-wrap")) element("table-wrap").hidden = !ready || !matches.length;
    element("list-reference").hidden = !ready || !state.accounts.length;
    element("result-count").textContent = ready
      ? `${matches.length} ${matches.length === 1 ? "conta" : "contas"}`
      : state.scenario === "loading"
        ? "Carregando contas…"
        : "Contas indisponíveis";
    if (!ready) {
      if (state.scenario === "error")
        empty(
          "Não foi possível carregar.",
          "Tente buscar a lista novamente.",
          "Tentar novamente",
          load,

      else {
        for (let index = 0; index < 3; index += 1) {
          const skeleton = document.createElement("div");

      return;
    }
    if (!state.accounts.length) {
      empty(
        "Seus planos começam aqui.",
        "Adicione sua primeira conta para organizar o dinheiro do dia a dia, suas reservas ou seus cartões.",
        "Criar minha primeira conta",
        () => openForm(),
      );
      return;
    }
    if (!matches.length) {
      empty(
        "Nenhuma conta por aqui.",
        "Experimente outro nome ou escolha um tipo diferente.",
        "Limpar filtros",
        () => {
          state.filter = "all";
          element("search").value = "";
          render();
        },
      );
      return;
    }
    for (const account of matches) {
      const row = element("account-row-template").content.cloneNode(true);
      row.querySelector('[data-field="name"]').textContent = account.name;
      row.querySelector('[data-field="type"]').textContent = types[account.type].label;
      row.querySelector('[data-field="type-icon"]').dataset.type = account.type;
      row.querySelector('[data-field="icon"]').setAttribute("href", "#" + types[account.type].icon);
      const amount = row.querySelector('[data-field="amount"]');
      amount.textContent = money(account.balanceCents);
      amount.classList.remove("unreported");
      const details = row.querySelector('[data-action="details"]') || row.querySelector("button");
      details.setAttribute("aria-label", "Ver conta " + account.name);
      details.addEventListener("click", () => showDetails(account.id));

  }
  function showDetails(id) {

    element("detail-initial").textContent = account.initialCents === null ? "Saldo inicial não informado." : `Saldo inicial: ${money(account.initialCents)} em ${MukiranaFinance.dateLabel(account.openingDate)}.`;
    element("detail-amount").classList.remove("unreported");

  }
  function formSnapshot() {

      element("account-name").value,
      root.querySelector('[name="account-type"]:checked').value,
      element("initial-amount").value,

  }
  function fieldError(id, message) {

        "Descartar alterações?",

  }
  /** Conversão decimal em centavos por texto; não multiplica um decimal de ponto flutuante. */
  function parseAmount() {
    const raw = element("initial-amount").value.trim();
    if (!raw) return null;
    if (!/^(?:\d+|\d{1,3}(?:\.\d{3})+)(?:,\d{1,2})?$/.test(raw)) return undefined;
    const [whole, decimal = ""] = raw.replace(/\./g, "").split(",");
    const cents = Number(whole + decimal.padEnd(2, "0"));
    if (!Number.isSafeInteger(cents) || cents > 99999999999999) return undefined;
    return element("negative-amount").checked && cents ? -cents : cents;
  }

    ).forEach((control) => {

      if (generation === state.operation)

  element("account-name").addEventListener("input", () => fieldError("name", ""));
  element("initial-amount").addEventListener("input", () => {

  element("back-form").addEventListener("click", leaveForm);
  element("edit-account").addEventListener("click", () => openForm(state.selectedId));
  element("delete-account").addEventListener("click", async () => {
    if (state.busy) return;
    const account = state.accounts.find((item) => item.id === state.selectedId);
    if (
      !account ||
      !(await confirm(
        `Excluir “${account.name}”?`,
        "A conta será removida da sua lista. Se preferir mantê-la, você pode apenas editar o nome.",
        "Excluir conta",
      ))
    )
      return;
    const generation = state.operation;
    operationError("");
    busy(true);
    try {
      const result = await MukiranaApi.call({
        action: "accounts.delete",
        token: MukiranaSession.current(),
        id: account.id,
        version: account.version,
      });
      if (generation !== state.operation || sessionExpired(result)) return;
      if (result.status === "linked") {
        busy(false);
        if (await confirm("Esta conta possui movimentações.", "Você pode renomear a conta para manter o histórico organizado.", "Renomear conta")) openForm(account.id);
        return;
      }
      if (result.status !== "deleted") {
        handleFailure(result.status);
        return;
      }
      state.accounts = state.accounts.filter((item) => item.id !== account.id);
      state.selectedId = null;
      render();
      show("list", "page-title");
      toast("Conta excluída.");
    } catch {
      if (generation === state.operation)
        operationError(
          "Não foi possível confirmar a exclusão. Tente novamente ou recarregue suas contas.",
        );
    } finally {
      if (generation === state.operation) busy(false);
    }
  });
  all('[data-action="new"]').forEach((button) =>
    button.addEventListener("click", () => openForm()),
  );
  all('[data-action="back-list"]').forEach((button) =>
    button.addEventListener("click", () => show("list", "page-title")),
  );
  all("[data-filter]").forEach((button) =>
    button.addEventListener("click", () => {
      state.filter = button.dataset.filter;
      render();
    }),
  );
  element("search").addEventListener("input", render);
  const nav = root.querySelector(".nav-current");
  if (nav)
    nav.addEventListener("click", async (event) => {
      event.preventDefault();
      if (state.busy) return;
      if (state.screen === "form") {
        await leaveForm();
        return;
      }
      show("list", "page-title");
    });
  window.addEventListener("beforeunload", (event) => {
    if (!host.hidden && state.screen === "form" && formSnapshot() !== state.formSnapshot) {
      event.preventDefault();
      event.returnValue = "";
    }
  });
  function validAccount(account) {
    return (
      account &&
      typeof account.id === "string" &&
      typeof account.name === "string" &&
      Object.hasOwn(types, account.type) &&
      Number.isInteger(account.version) &&
      account.version > 0 &&
      (account.initialCents === null || Number.isSafeInteger(account.initialCents))
    );
  }
  function operationError(message, canReload = false) {
    element("account-operation-error").textContent = message;
    element("account-operation-error").hidden = !message;
    element("reload-accounts").hidden = !canReload;
    if (message) element("account-operation-error").focus();
  }
  function handleFailure(status) {
    const messages = {
      conflict:
        "Esta conta foi alterada em outro acesso. Recarregue a lista para revisar a versão atual antes de continuar.",
      not_found: "A conta não está mais disponível. Recarregue sua lista.",
      type_confirmation_required: "Confirme o efeito da alteração de tipo para continuar.",
      invalid_request: "Confira os dados informados antes de salvar.",
    };
    operationError(
      messages[status] || "Não foi possível concluir a operação. Tente novamente.",
      ["conflict", "not_found"].includes(status),
    );
  }
  function sessionExpired(result) {
    if (result.status !== "invalid_session") return false;
    reset();
    callbacks.onExpired?.();
    return true;
  }
  async function load() {
    if (state.busy) return;
    const generation = ++state.operation;
    state.scenario = "loading";
    operationError("");
    show("list", "page-title");
    busy(true);
    render();
    try {
      const result = await MukiranaApi.call({
        action: "accounts.list",
        token: MukiranaSession.current(),
      });
      if (generation !== state.operation || sessionExpired(result)) return;
      if (
        result.status !== "ok" ||
        !Array.isArray(result.accounts) ||
        !result.accounts.every(validAccount)
      )
        throw new Error();
      state.accounts = result.accounts;
      state.scenario = "ready";
    } catch {
      if (generation === state.operation) {
        state.accounts = [];
        state.scenario = "error";
      }
    } finally {
      if (generation === state.operation) {
        busy(false);
        render();
      }
    }
  }
  async function leave(callback) {
    if (state.busy) return;
    if (
      state.screen === "form" &&
      formSnapshot() !== state.formSnapshot &&
      !(await confirm("Descartar alterações?", "O formulário ainda não foi salvo.", "Descartar"))
    )
      return;
    if (callback) callback();
  }
  function reset() {
    state.operation += 1;
    state.accounts = [];
    state.selectedId = null;
    state.editId = null;
    state.createId = null;
    state.originalType = null;
    state.formSnapshot = "";
    state.filter = "all";
    state.scenario = "loading";
    state.screen = "list";
    element("account-form").reset();
    if (dialog.open) closeDialog(false);
    for (const id of [
      "detail-title",
      "detail-type",
      "detail-amount",
      "detail-initial",
      "confirmation-title",
      "confirmation-description",
      "toast",
    ])
      element(id).textContent = "";
    operationError("");
    element("search").value = "";
    busy(false);
    window.clearTimeout(toastTimer);
    element("toast").hidden = true;
    render();
  }
  function syncTheme() {
    const theme = document.documentElement.dataset.theme;
    element("accounts-content").dataset.theme = theme;
    element("theme-select").value = theme;
  }
  element("theme-select").addEventListener("change", () => {
    const sharedSelect = document.getElementById("theme-select");
    sharedSelect.value = element("theme-select").value;
    sharedSelect.dispatchEvent(new window.Event("change"));
  });
  document.addEventListener("mukirana:theme", syncTheme);
  syncTheme();
  root.querySelector(".skip-link").addEventListener("click", (event) => {
    event.preventDefault();
    element(
      state.screen === "list"
        ? "page-title"
        : state.screen === "form"
          ? "form-title"
          : "detail-title",
    ).focus();
  });
  element("accounts-transfers").addEventListener("click", () => leave(callbacks.onTransfers));
  element("accounts-transactions").addEventListener("click", () => leave(callbacks.onTransactions));
  element("accounts-home").addEventListener("click", () => leave(callbacks.onHome));
  element("accounts-tests").addEventListener("click", () => leave(callbacks.onTests));
  element("reload-accounts").addEventListener("click", () => leave(load));
  return Object.freeze({
    open: async (options) => {
      callbacks = options;
      state.filter = "all";
      element("search").value = "";
      await load();
      if (options.editId && state.scenario === "ready") openForm(options.editId);
    },
    reset,
  });
})();

</script>

<script>

/** Controller compartilhado pelas duas Views. Nenhuma regra de autorização depende dele. */
document.addEventListener("DOMContentLoaded", () => {
  const element = (id) => document.getElementById(id);
  const emailInput = element("email");
  const codeInput = element("code");
  let challenge = null;
  let destination = "";
  let busy = false;
  let retryAt = 0;
  let stage = "loading";
  const messages = {
    invalid_request: "Confira o e-mail informado.",
    rate_limited: "Aguarde antes de solicitar outro código.",
    busy: "O envio está ocupado. Tente novamente em instantes.",
    delivery_unavailable: "Não foi possível enviar o código agora. Tente novamente mais tarde.",
    delivery_unconfirmed:
      "O envio não pôde ser confirmado. Aguarde um minuto e solicite outro código.",
    unavailable: "O serviço está indisponível. Tente novamente.",
    invalid_code:
      "Código inválido, expirado ou sem tentativas disponíveis. Confira ou solicite outro.",
  };
  function show(view, focusId) {
    stage = view;
    for (const name of ["loading", "email", "code", "home", "tests", "accounts", "categories", "transactions", "transfers"])
      element(name + "-view").hidden = name !== view;
    element("access-layout").hidden = ["accounts", "categories", "transactions", "transfers"].includes(view);
    if (["accounts", "categories", "transactions", "transfers"].includes(view)) return;
    document.querySelector(".skip-link").href = "#" + focusId;
    element(focusId).focus({ preventScroll: true });
    window.scrollTo(0, 0);
  }
  function error(input, message) {
    const output = element(input.id + "-error");
    output.textContent = message;
    output.hidden = !message;
    input.setAttribute("aria-invalid", String(Boolean(message)));
  }
  function refreshResend() {
    const remaining = Math.max(0, Math.ceil((retryAt - Date.now()) / 1000));
    element("resend-code").disabled = busy || remaining > 0;
    element("resend-code").textContent = remaining
      ? "Reenviar em " + remaining + " s"
      : "Reenviar código";
  }
  function setBusy(value) {
    busy = value;
    for (const id of [
      "email-submit",
      "code-submit",
      "change-email",
      "logout-current",
      "logout-all",
      "open-tests",
      "open-accounts",
      "open-categories",
      "open-transactions",
      "open-transfers",
      "retry-session",
    ])
      element(id).disabled = value;
    emailInput.disabled = value;
    codeInput.disabled = value;
    element("email-form").setAttribute("aria-busy", String(value));
    element("code-form").setAttribute("aria-busy", String(value));
    refreshResend();
  }
  function expired() {
    MukiranaAccounts.reset();
    MukiranaCategories.reset();
    MukiranaTransactions.reset();
    MukiranaTransfers.reset();
    MukiranaFinance.period.reset();
    MukiranaSession.clear();
    challenge = null;
    codeInput.value = "";
    show("email", "access-title");
    error(emailInput, "Seu acesso foi encerrado ou expirou. Solicite um novo código.");
  }
  function enter(session, persistent = true) {
    challenge = null;
    codeInput.value = "";
    element("session-email").textContent = session.user.email;
    element("home-status").textContent = persistent
      ? ""
      : "O navegador bloqueou o armazenamento. Seu acesso vale enquanto esta página estiver aberta.";
    show("home", "home-title");
  }
  async function restore() {
    if (busy) return;
    const token = MukiranaSession.read();
    if (!token) {
      show("email", "access-title");
      return;
    }
    setBusy(true);
    element("loading-message").textContent = "Conferindo seu acesso…";
    element("retry-session").hidden = true;
    try {
      const result = await MukiranaApi.call({ action: "auth.resolve", token });
      if (result.status === "authenticated") enter(result);
      else if (result.status === "invalid_session") expired();
      else throw new Error();
    } catch {
      element("loading-message").textContent =
        "Não foi possível conferir seu acesso. Sua sessão foi preservada para tentar novamente.";
      element("retry-session").hidden = false;
    } finally {
      setBusy(false);
    }
  }
  async function requestCode(resending = false) {
    if (busy) return;
    const email = resending ? destination : emailInput.value.trim();
    if (!email || !emailInput.checkValidity()) {
      error(emailInput, "Informe um e-mail válido.");
      emailInput.focus();
      return;
    }
    error(emailInput, "");
    element("resend-status").textContent = "";
    setBusy(true);
    element("flow-status").textContent = "Solicitando seu código…";
    try {
      const result = await MukiranaApi.call({ action: "auth.request", email });
      if (result.retryAfterSeconds) retryAt = Date.now() + result.retryAfterSeconds * 1000;
      if (result.status !== "code_sent")
        throw new Error(messages[result.status] || messages.unavailable);
      challenge = result.challengeId;
      destination = email.toLowerCase();
      codeInput.value = "";
      error(codeInput, "");
      element("destination-email").textContent = destination;
      element("resend-status").textContent = resending
        ? "Novo código enviado. Use o mais recente."
        : "Confira também a pasta de spam. O código vale por 10 minutos.";
      show("code", "code-title");
    } catch (failure) {
      if (resending) {
        // Uma falha pode ter substituído o desafio; não reapresente o antigo como vigente.
        challenge = null;
        element("resend-status").textContent = failure.message;
      } else error(emailInput, failure.message);
    } finally {
      element("flow-status").textContent = "";
      setBusy(false);
    }
  }
  element("email-form").addEventListener("submit", (event) => {
    event.preventDefault();
    requestCode();
  });
  element("code-form").addEventListener("submit", async (event) => {
    event.preventDefault();
    if (busy) return;
    if (!challenge) {
      error(codeInput, "Solicite um novo código para continuar.");
      return;
    }
    if (!/^[0-9]{6}$/.test(codeInput.value)) {
      error(codeInput, "Digite os 6 dígitos do código.");
      codeInput.focus();
      return;
    }
    setBusy(true);
    error(codeInput, "");
    try {
      const result = await MukiranaApi.call({
        action: "auth.verify",
        challengeId: challenge,
        code: codeInput.value,
      });
      if (result.status !== "authenticated")
        throw new Error(messages[result.status] || messages.unavailable);
      enter(result, MukiranaSession.save(result.sessionToken));
    } catch (failure) {
      error(codeInput, failure.message);
    } finally {
      setBusy(false);
    }
  });
  emailInput.addEventListener("input", () => error(emailInput, ""));
  codeInput.addEventListener("input", () => {
    codeInput.value = codeInput.value.replace(/\D/g, "").slice(0, 6);
    error(codeInput, "");
  });
  element("change-email").addEventListener("click", () => {
    if (busy) return;
    challenge = null;
    codeInput.value = "";
    show("email", "access-title");
  });
  element("resend-code").addEventListener("click", () => requestCode(true));
  element("retry-session").addEventListener("click", restore);
  for (const [id, allDevices] of [
    ["logout-current", false],
    ["logout-all", true],
  ]) {
    element(id).addEventListener("click", async () => {
      if (busy) return;
      setBusy(true);
      try {
        const result = await MukiranaApi.call({
          action: "auth.logout",
          token: MukiranaSession.current(),
          allDevices,
        });
        if (!["logged_out", "invalid_session"].includes(result.status)) throw new Error();
        MukiranaSession.clear();
        MukiranaAccounts.reset();
        MukiranaCategories.reset();
        MukiranaTransactions.reset();
        MukiranaTransfers.reset();
        MukiranaFinance.period.reset();
        emailInput.value = "";
        error(emailInput, "");
        show("email", "access-title");
        element("flow-status").textContent = allDevices
          ? "Acesso encerrado em todos os dispositivos."
          : "Você saiu deste navegador.";
      } catch {
        element("home-status").textContent = "Não foi possível encerrar o acesso. Tente novamente.";
      } finally {
        setBusy(false);
      }
    });
  }
  element("open-tests").addEventListener("click", () => {
    show("tests", "tests-title");
    MukiranaDiagnostics.load(expired);
  });
  function openAccounts(accountId = null) {
    show("accounts");
    MukiranaAccounts.open({
      editId: typeof accountId === "string" ? accountId : null,
      onExpired: expired, onHome: () => show("home", "home-title"), onTransactions: openTransactions, onTransfers: openTransfers,
      onTests: () => { show("tests", "tests-title"); MukiranaDiagnostics.load(expired); },
    });
  }
  function openCategories() {
    show("categories");
    MukiranaCategories.open({ onExpired: expired, onHome: () => show("home", "home-title"),
      onAccounts: () => openAccounts(), onTransactions: openTransactions, onTransfers: openTransfers });
  }
  function openTransactions() {
    show("transactions");
    MukiranaTransactions.open({ onExpired: expired, onHome: () => show("home", "home-title"),
      onAccounts: () => openAccounts(), onAccount: id => openAccounts(id), onCategories: openCategories, onTransfers: openTransfers });
  }
  function openTransfers() {
    show("transfers");
    MukiranaTransfers.open({ onExpired: expired, onHome: () => show("home", "home-title"),
      onAccounts: () => openAccounts(), onCategories: openCategories, onTransactions: openTransactions });
  }
  element("open-transfers").addEventListener("click", openTransfers);
  element("open-accounts").addEventListener("click", () => openAccounts());
  element("open-categories").addEventListener("click", openCategories);
  element("open-transactions").addEventListener("click", openTransactions);
  element("close-tests").addEventListener("click", () => show("home", "home-title"));
  element("run-tests").addEventListener("click", () => MukiranaDiagnostics.run(expired));
  // Tokens revogados em outra aba deixam de apresentar uma área autenticada nesta aba.
  window.addEventListener("storage", (event) => {
    if (event.key === "mukirana.session" && stage !== "loading") window.location.reload();
  });
  window.setInterval(refreshResend, 1000);
  restore();
});
</script></body></html>
