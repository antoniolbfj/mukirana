<div id="transactions-view" hidden></div>
<template id="transactions-template"><?!= includeFinanceStyles_(); ?><div id="transactions-content" class="finance-content" data-theme="light"><a class="skip-link" href="#page-title">Ir para o conteúdo</a>
<div class="shell">
 <aside class="sidebar">
  <a class="brand" href="#" id="tx-brand"><span>mukirana.</span></a>
  <p class="nav-label">MEU ESPAÇO</p>
  <nav aria-label="Navegação principal">
   <a href="#" class="nav-item current" aria-current="page">Lançamentos</a>
   <a href="#" class="nav-item" id="tx-accounts">Contas</a>
   <a href="#" class="nav-item" id="tx-categories">Categorias</a>
  </nav>
  <div class="sidebar-bottom"><p>Pequenos passos.<br>Mais espaço para seus planos.</p><span>Seu dinheiro. Seu espaço.</span></div>
 </aside>
 <div class="workspace">
  <header class="topbar"><div class="breadcrumb"><button id="tx-home" class="text-button">Meu espaço</button><span class="slash">/</span><strong>Lançamentos</strong></div><div class="top-actions"><button id="reload" class="text-button">Atualizar</button><label class="theme-control"><span>Tema</span><select id="theme"><option value="light">Claro</option><option value="dark">Escuro</option><option value="sepia">Sépia</option></select></label></div></header>
  <main>
   <div class="page-heading"><div><p class="eyebrow">SEU DINHEIRO EM MOVIMENTO</p><h1 id="page-title" tabindex="-1">Meus lançamentos.</h1><p class="description">Cada entrada e saída, no seu lugar.</p></div><div class="new-actions"><button id="new-income" class="button">+ Receita</button><button id="new-expense" class="button primary">+ Despesa</button><button id="new-transfer" class="button">+ Transferência</button></div></div>
   <section class="period-panel" aria-label="Período global"><div><label for="period-preset">Período</label><select id="period-preset"><option value="current">Mês atual</option><option value="previous">Mês anterior</option><option value="next">Próximo mês</option><option value="all">Todos os lançamentos</option><option value="custom">Personalizado</option></select></div><div><label for="start-date">De</label><input type="date" id="start-date"></div><div><label for="end-date">Até</label><input type="date" id="end-date"></div><button id="apply-period" class="button">Aplicar</button><p id="period-error" class="field-error" role="alert" hidden></p></section>
   <div class="stats tx-stats" aria-label="Totais do período"><div class="stat-card"><span><span>Receitas</span><strong id="income-total" class="income">—</strong></span></div><div class="stat-card"><span><span>Despesas</span><strong id="expense-total" class="expense">—</strong></span></div><div class="stat-card"><span><span>Resultado do período</span><strong id="result-total">—</strong></span></div></div>
   <p class="totals-note">Receitas e despesas do período, incluindo previsões e saldo inicial. Transferências movimentam as contas e têm efeito zero no resultado.</p>
   <div class="tx-filters"><div class="search"><label class="sr-only" for="search">Buscar pela descrição</label><input id="search" type="search" maxlength="160" placeholder="Buscar pela descrição" autocomplete="off"></div><label><span class="sr-only">Tipo de lançamento</span><select id="nature-filter"><option value="">Todos os tipos</option><option value="income">Receitas</option><option value="expense">Despesas</option><option value="transfer">Transferências</option></select></label><label><span class="sr-only">Conta</span><select id="account-filter"><option value="">Todas as contas</option></select></label><label><span class="sr-only">Categoria</span><select id="category-filter"><option value="">Todas as categorias</option></select></label><label><span class="sr-only">Classificação</span><select id="class-filter"><option value="">Fixas e variáveis</option><option value="fixed">Fixas</option><option value="variable">Variáveis</option></select></label></div>
   <p id="account-balance" class="totals-note" hidden></p>
   <div id="page-error" class="info-note" role="alert" hidden></div>
   <section class="category-panel" aria-labelledby="list-title"><div class="panel-heading"><div><h2 id="list-title">Seus registros</h2><span id="result-count" class="muted" role="status"></span></div><span class="privacy-note">Somente você</span></div><div id="entry-list" aria-live="polite"></div><div class="load-more"><button id="more" class="button" hidden>Carregar mais</button></div></section>
   <div class="bottom-note"><span>Receitas, despesas e transferências entre suas contas.</span><span>Valores em reais.</span></div>
  </main>
 </div>
</div>
<dialog id="editor" class="drawer" aria-labelledby="editor-title"><form id="entry-form" novalidate>
 <div class="drawer-heading"><div><p class="eyebrow">LANÇAMENTO ÚNICO</p><h2 id="editor-title">Nova despesa.</h2></div><button type="button" id="close-editor" class="icon-button" aria-label="Fechar formulário">×</button></div>
 <div class="drawer-body">
  <p id="editor-note" class="field-hint" role="status"></p>
  <fieldset class="nature-choice"><legend>Tipo de lançamento</legend><label><input type="radio" name="nature" value="income"> Receita</label><label><input type="radio" name="nature" value="expense" checked> Despesa</label><label><input type="radio" name="nature" value="transfer"> Transferência</label></fieldset>
  <div class="field"><label for="description">Descrição</label><input id="description" maxlength="160" required autocomplete="off" placeholder="Ex.: Supermercado" aria-describedby="description-error"><p id="description-error" class="field-error" role="alert" hidden></p></div>
  <div class="field-pair"><div class="field"><label for="amount">Valor</label><input id="amount" inputmode="decimal" placeholder="0,00" required autocomplete="off" aria-describedby="amount-error"><p id="amount-error" class="field-error" role="alert" hidden></p></div><div class="field"><label for="date">Data</label><input id="date" type="date" required aria-describedby="date-error"><p id="date-error" class="field-error" role="alert" hidden></p></div></div>
  <div class="field"><div class="field-label"><label for="account" id="account-label">Conta</label><button type="button" id="quick-account" class="text-button">+ Nova conta</button></div><select id="account" required aria-describedby="account-error"></select><p id="account-error" class="field-error" role="alert" hidden></p></div>
  <div class="field" id="destination-field" hidden><div class="field-label"><label for="destination">Conta de destino</label><button type="button" id="quick-destination" class="text-button">+ Nova conta</button></div><select id="destination" aria-describedby="destination-error"></select><p id="destination-error" class="field-error" role="alert" hidden></p></div>
  <div class="field" id="category-field"><div class="field-label"><label for="category">Categoria ou subcategoria</label><button type="button" id="quick-category" class="text-button">+ Nova categoria</button></div><select id="category" required aria-describedby="category-error"></select><p id="category-error" class="field-error" role="alert" hidden></p></div>
  <fieldset class="nature-choice" id="classification-field"><legend>Classificação</legend><label><input type="radio" name="classification" value="fixed"> Fixa</label><label><input type="radio" name="classification" value="variable" checked> Variável</label><p class="field-hint">Fixa é uma ocorrência regular e duradoura, mesmo quando o valor muda. Esta escolha não agenda outros lançamentos.</p></fieldset>
  <p id="transfer-note" class="info-note" hidden>O valor sai da origem e entra no destino na mesma data. Editar ou excluir este lançamento altera os dois movimentos juntos.</p>
  <p id="future-note" class="info-note" hidden>Esta data é futura. O lançamento participa das previsões e passa a compor o saldo atual na data informada.</p>
  <p id="form-error" class="field-error" role="alert" tabindex="-1" hidden></p><button type="button" id="review" class="text-button" hidden>Fechar e recarregar lista</button>
 </div><div class="drawer-footer"><button type="button" id="cancel-editor" class="button">Cancelar</button><button id="save-entry" class="button primary" type="submit">Salvar lançamento</button></div>
</form></dialog>
<dialog id="confirm" class="modal" aria-labelledby="confirm-title"><h2 id="confirm-title"></h2><p id="confirm-description" class="description"></p><div class="modal-actions"><button id="confirm-cancel" class="button">Voltar</button><button id="confirm-accept" class="button primary">Confirmar</button></div></dialog>
<dialog id="quick" class="modal" aria-labelledby="quick-title"><form id="quick-form" novalidate><h2 id="quick-title"></h2><p class="description">Continue seu lançamento com os dados já preenchidos.</p><div class="field"><label for="quick-name">Nome</label><input id="quick-name" maxlength="80" required autocomplete="off"></div><div id="quick-type-field" class="field"><label for="quick-type">Tipo de conta</label><select id="quick-type"><option value="consumption">Consumo</option><option value="investment">Investimento</option><option value="credit">Cartão de Crédito</option></select></div><div id="quick-parent-field" class="field" hidden><label for="quick-parent">Organização</label><select id="quick-parent"></select><p class="field-hint">Escolha uma principal para criar uma subcategoria.</p></div><p id="quick-error" class="field-error" role="alert" hidden></p><div class="modal-actions"><button id="quick-cancel" type="button" class="button">Cancelar</button><button id="quick-save" type="submit" class="button primary">Criar e selecionar</button></div></form></dialog>
<div id="toast" class="toast" role="status" hidden><span id="toast-text"></span><button id="toast-action" class="text-button" hidden>Ver mês</button><button id="toast-close" class="icon-button" aria-label="Fechar aviso">×</button></div>
</div></template>
