<template id="large-template">
<div class="app-shell"><aside class="sidebar" aria-label="Contexto do protótipo"><div class="brand">mukirana<span class="brand-dot">.</span></div><div class="nav-title">SUAS FINANÇAS</div><div class="nav-item"><span>Visão geral</span></div><div class="nav-item active"><b>≡</b><span>Lançamentos</span></div><div class="nav-item"><span>Contas</span></div><div class="nav-item"><span>Cartões</span></div><div class="nav-item"><span>Categorias</span></div><p class="sidebar-foot">Navegação ilustrativa<br>Dados fictícios</p></aside><main class="main" id="main">
<div class="demo-bar"><span>PROTÓTIPO INTERATIVO · Dados fictícios · Nada é enviado ao banco</span><div class="flex"><button data-action="switch-ui">Ver celular</button><button data-action="reset">Reiniciar</button></div></div>
<header class="page-head"><div><h1>Lançamentos</h1><p>O que entrou, o que saiu e o que vem pela frente.</p></div><button class="btn primary" data-action="new">＋ Novo lançamento</button></header>

<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const money = cents => (cents / 100).toLocaleString('pt-BR', {style:'currency',currency:'BRL'});
  const decimal = cents => (cents / 100).toLocaleString('pt-BR', {minimumFractionDigits:2,maximumFractionDigits:2});
  function cents(text) {
    const value=String(text).trim().replace(/^R\$\s*/, '');
    if (!/^(?:\d{1,3}(?:\.\d{3})*|\d+)(?:,\d{1,2})?$/.test(value)) return null;
    const [whole, fraction='']=value.replace(/\./g,'').split(',');
    const n=Number(whole)*100+Number(fraction.padEnd(2,'0'));
    return Number.isSafeInteger(n) && n <= 9999999999 ? n : null;
  }
  const iso = date => date.toISOString().slice(0,10);
  const parseDate = s => new Date(s+'T12:00:00Z');
  const monthStart = d => d.slice(0,7)+'-01';
  function validDate(s) { return /^\d{4}-\d{2}-\d{2}$/.test(s) && !isNaN(parseDate(s)) && iso(parseDate(s))===s; }
  function addMonths(date, n) {
    const d=parseDate(date), anchor=d.getUTCDate(); d.setUTCDate(1); d.setUTCMonth(d.getUTCMonth()+n);
    const last=new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth()+1,0,12)).getUTCDate();
    d.setUTCDate(Math.min(anchor,last)); return iso(d);
  }
  function addDays(date, n) { const d=parseDate(date);d.setUTCDate(d.getUTCDate()+n);return iso(d); }
  const shortDate = s => parseDate(s).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',timeZone:'UTC'});
  const fullDate = s => parseDate(s).toLocaleDateString('pt-BR',{day:'2-digit',month:'long',year:'numeric',timeZone:'UTC'});
  const monthName = s => parseDate(monthStart(s)).toLocaleDateString('pt-BR',{month:'long',year:'numeric',timeZone:'UTC'});
  const today=iso(new Date()), currentMonth=monthStart(today), dateOf=day=>currentMonth.slice(0,8)+String(day).padStart(2,'0');
  const clone = value => JSON.parse(JSON.stringify(value));
  const frequencies=[['weekly','Semanal · 7 dias'],['fortnightly','Quinzenal · 15 dias'],['monthly','Mensal'],['bimonthly','Bimestral'],['quarterly','Trimestral'],['semiannual','Semestral'],['annual','Anual']];
  const monthSteps={monthly:1,bimonthly:2,quarterly:3,semiannual:6,annual:12};
  function occurrenceDate(start,frequency,index) { return monthSteps[frequency] ? addMonths(start,monthSteps[frequency]*index) : addDays(start,(frequency==='weekly'?7:15)*index); }
  const ua=navigator.userAgent, tablet=/iPad|Tablet|Android(?!.*Mobile)/i.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  const params=new URLSearchParams(location.search), forced=params.get('ui');
  const phone=forced==='phone'||(forced!=='large'&&!tablet&&(/iPhone|iPod|Android.+Mobile/i.test(ua)||(matchMedia('(pointer:coarse)').matches&&Math.min(screen.width,screen.height)<768)));
  const embedded=window.parent!==window;
  document.body.classList.toggle('phone',phone);document.body.classList.toggle('embedded',embedded);document.body.dataset.interface=phone?'phone':'large';
  $('mount').append($(phone?'phone-template':'large-template').content.cloneNode(true));
  const store={get(key){try{return JSON.parse(sessionStorage.getItem('mk-demo-lanc-'+key));}catch{return null;}},set(key,value){try{sessionStorage.setItem('mk-demo-lanc-'+key,JSON.stringify(value));}catch{}}};
  let memoryPreference=null;
  const preferences={get(){try{return JSON.parse(localStorage.getItem('mk-demo-lanc-period-pref'));}catch{return memoryPreference;}},set(v){memoryPreference=v;try{localStorage.setItem('mk-demo-lanc-period-pref',JSON.stringify(v));}catch{}}};
  function resolvePeriod(p){if(!p)return {start:currentMonth,end:addDays(addMonths(currentMonth,1),-1)};if(p.relative){const start=p.relative==='last15'?addDays(today,-14):addMonths(currentMonth,p.relative==='previous'?-1:p.relative==='next'?1:0);return {start,end:p.relative==='last15'?today:addDays(addMonths(start,1),-1)}}return {start:p.start||'',end:p.end||''};}
  let period=store.get('period')||resolvePeriod(preferences.get());
  let accounts=[{id:'daily',name:'Dia a dia',type:'Consumo'},{id:'wallet',name:'Carteira',type:'Consumo'},{id:'invest',name:'Reserva',type:'Investimento'},{id:'card',name:'Principal · meu cartão',type:'Cartão',closing:10}];
  let categories=[{id:'food',name:'Alimentação',parent:''},{id:'market',name:'Supermercado',parent:'food'},{id:'restaurant',name:'Restaurantes',parent:'food'},{id:'home',name:'Moradia',parent:''},{id:'bills',name:'Contas da casa',parent:'home'},{id:'health',name:'Saúde',parent:''},{id:'salary',name:'Trabalho',parent:''},{id:'leisure',name:'Lazer',parent:''},{id:'shopping',name:'Compras',parent:''},{id:'waiting',name:'Aguardando Categorização',parent:'',reserved:true}];
  const people=[{id:'me',name:'Você',group:'Autor do lançamento'},{id:'marina',name:'Marina',group:'Casa · vínculo aceito'},{id:'joao',name:'João',group:'Casa · vínculo aceito'},{id:'bia',name:'Bia',group:'Viagem · vínculo aceito'}];
  const projects=['','Casa','Viagem'];
  const baseEntry={type:'expense',status:'done',account:'daily',category:'food',classification:'variable',mode:'single',author:'me',project:'',approval:'',shares:null};
  const make=(id,patch)=>{const e={...baseEntry,id,...patch};if(e.shares)e.shares=e.shares.map(p=>({...p,decision:e.approval==='approved'||p.id===e.author?'approved':'pending'}));return e;};
  let entries=[
    make('salary',{description:'Salário',type:'income',amount:650000,date:dateOf(5),category:'salary',classification:'fixed'}),
    make('rent',{description:'Aluguel',amount:180000,date:dateOf(10),category:'home',classification:'fixed',mode:'recurring',group:'rent-group',index:1,count:3}),
    make('market',{description:'Supermercado',amount:28990,date:dateOf(20),category:'market',shares:[{id:'me',cents:14495},{id:'marina',cents:14495}],approval:'approved',project:'Casa'}),
    make('dinner',{description:'Jantar de sábado',amount:15600,date:dateOf(9),account:'card',category:'restaurant',shares:[{id:'me',cents:7800},{id:'marina',cents:7800}],approval:'pending'}),
    make('lunch',{description:'Almoço da equipe',amount:12000,date:dateOf(22),category:'waiting',author:'marina',account:null,shares:[{id:'marina',cents:4000},{id:'me',cents:4000},{id:'joao',cents:4000}],approval:'pending'}),
    make('internet',{description:'Internet',amount:11990,date:dateOf(27),category:'bills',classification:'fixed',status:'pending',mode:'recurring',group:'internet-group',index:1,count:3}),
    make('shoes',{description:'Tênis de corrida',amount:13334,date:dateOf(8),account:'card',category:'shopping',mode:'installment',group:'shoes-group',index:1,count:3}),
    make('transfer',{description:'Guardar na reserva',type:'transfer',amount:80000,date:dateOf(21),destination:'invest',category:'',classification:''}),
    make('payment',{description:'Pagamento da fatura Principal',type:'transfer',amount:44000,date:dateOf(17),destination:'card',category:'',classification:'',special:'invoice'}),
    make('opening',{description:'Saldo Inicial da Conta Carteira',type:'opening',amount:15000,date:dateOf(1),account:'wallet',category:'',special:'opening'}),
    make('pharmacy',{description:'Farmácia',amount:7840,date:dateOf(23),category:'health'}),
    make('cinema',{description:'Cinema',amount:6400,date:dateOf(28),category:'leisure',status:'pending'}),
    make('settlement',{description:'Acerto com Marina',type:'transfer',amount:10000,date:dateOf(23),destination:'marina',category:'',special:'settlement',approval:'pending'})
  ];
  for(let i=2;i<=3;i++){
    entries.push(make('shoes-'+i,{description:'Tênis de corrida',amount:13333,date:addMonths(dateOf(8),i-1),account:'card',category:'shopping',mode:'installment',group:'shoes-group',index:i,count:3,status:'pending'}));
    for(const [id,description,amount,day,category] of [['rent','Aluguel',180000,10,'home'],['internet','Internet',11990,27,'bills']])entries.push(make(id+'-'+i,{description,amount,date:addMonths(dateOf(day),i-1),category,classification:'fixed',mode:'recurring',group:id+'-group',index:i,count:3,status:'pending'}));
  }
  // Cenário de renovação: conjunto antigo cuja última ocorrência é hoje.
  for(let i=1;i<=3;i++)entries.push(make('music-'+i,{description:'Assinatura de música',amount:2190,date:addMonths(today,i-3),category:'leisure',classification:'fixed',mode:'recurring',frequency:'monthly',group:'music-group',index:i,count:3,createdOn:addMonths(today,-2)}));
  let favorites=[{description:'Supermercado',account:'daily',category:'market',classification:'variable',type:'expense'},{description:'Combustível',account:'card',category:'shopping',classification:'variable',type:'expense'}];
  const initialDemo=clone({entries,accounts,categories,favorites});
  let view='economic',tab='all',search='',filters={type:'',account:'',category:'',mode:'',status:'',project:''},selected=new Set(),selecting=false;
  let domWriting=0;
  let draft=null,panelKind='',detailId='',lastFocus=null,dialogReturnFocus=null,toastTimer=0,undoAction=null,dialogAction=null;
  const accountName=id=>accounts.find(a=>a.id===id)?.name||'Conta não informada';
  const categoryName=id=>categories.find(c=>c.id===id)?.name||'Sem categoria';
  const personName=id=>people.find(p=>p.id===id)?.name||'Participante';
  const kindName=e=>e.type==='transfer'?'Transferência':e.type==='opening'?'Saldo inicial':e.type==='income'?'Receita':'Despesa';
  const modeName=e=>e.mode==='installment'?`Parcela ${e.index}/${e.count}`:e.mode==='recurring'?`Recorrente · ${e.index}/${e.count}`:'';
  function editable(e){return e.author==='me'&&!e.special;}
  function myShare(e){return e.shares?.find(p=>p.id==='me')?.cents??(e.author==='me'?e.amount:0);}
  function pending(e){return e.status==='pending'||e.approval==='pending'||e.approval==='rejected';}
  function reference(e){if(e.account==='card'&&!e.special){return e.competence||addMonths(monthStart(e.date),Number(e.date.slice(-2))>10?1:0);}return e.date;}
  function inPeriod(e){const date=reference(e);return (!period.start||date>=period.start)&&(!period.end||date<=period.end);}
  function filtered(){return entries.filter(e=>inPeriod(e)&&(!search||[e.description,categoryName(e.category),e.author==='me'?accountName(e.account):personName(e.author)].join(' ').toLocaleLowerCase('pt-BR').includes(search.toLocaleLowerCase('pt-BR')))&&(tab!=='pending'||pending(e))&&(tab!=='shared'||!!e.shares||e.special==='settlement')&&(!filters.type||e.type===filters.type)&&(!filters.account||e.account===filters.account||e.destination===filters.account)&&(!filters.category||e.category===filters.category||categories.find(c=>c.id===e.category)?.parent===filters.category)&&(!filters.mode||e.mode===filters.mode)&&(!filters.status||(filters.status==='approval'?e.approval==='pending':e.status===filters.status))&&(!filters.project||e.project===filters.project)).sort((a,b)=>b.date.localeCompare(a.date)||a.description.localeCompare(b.description));}
  function statusHtml(e){const parts=[];if(e.deletionPending)parts.push('<span class="tag wait">Exclusão em aprovação</span>');parts.push(`<span class="tag ${e.status==='done'?'good':'wait'}">${e.status==='done'?'Efetivado':'Pendente'}</span>`);if(e.approval)parts.push(`<span class="tag ${e.approval==='approved'?'purple':e.approval==='rejected'?'bad':'wait'}">${e.approval==='approved'?'Rateio aprovado':e.approval==='rejected'?'Correção solicitada':'Aguardando aprovação'}</span>`);return parts.join(' ');}
  function sourceLabel(e){return e.author!=='me'?'Pago por '+personName(e.author):e.type==='transfer'?accountName(e.account)+' → '+(e.destination==='marina'?'Marina':accountName(e.destination)):accountName(e.account);}
  function summary(list){let income=0,expense=0,plannedIncome=0,plannedExpense=0;for(const e of list){if(!['income','expense'].includes(e.type))continue;let value=view==='economic'?myShare(e):e.author==='me'&&accounts.find(a=>a.id===e.account)?.type!=='Cartão'?e.amount:0;if(e.status==='done'&&e.date<=today){if(e.type==='income')income+=value;else expense+=value;}else if(e.type==='income')plannedIncome+=value;else plannedExpense+=value;}return {income,expense,plannedIncome,plannedExpense};}
  function setPeriod(next){period=next;store.set('period',period);selected.clear();render();}
  function renderFilters(){const options={type:[['income','Receitas'],['expense','Despesas'],['transfer','Transferências'],['opening','Saldo inicial']],account:accounts.map(a=>[a.id,a.name]),category:categories.filter(c=>!c.reserved||entries.some(e=>e.category===c.id)).map(c=>[c.id,(c.parent?'↳ ':'')+c.name]),mode:[['single','Únicos'],['installment','Parcelados'],['recurring','Recorrentes']],status:[['done','Efetivados'],['pending','Pendentes'],['approval','Aguardando aprovação']],project:projects.filter(Boolean).map(p=>[p,p])};const labels={type:'Natureza',account:'Conta / cartão',category:'Categoria e subcategorias',mode:'Modalidade',status:'Situação',project:'Projeto'};$('advanced').innerHTML=Object.keys(options).map(key=>`<label>${labels[key]}<select class="input" data-filter="${key}" aria-label="${labels[key]}"><option value="">Todos</option>${options[key].map(([id,name])=>`<option value="${esc(id)}" ${filters[key]===id?'selected':''}>${esc(name)}</option>`).join('')}</select></label>`).join('');const active=Object.entries(filters).filter(([,v])=>v);$('filter-count').textContent=active.length?`(${active.length})`:'';$('active-filters').hidden=!active.length;$('active-filters').innerHTML=active.map(([k,v])=>`<button class="chip" data-clear-filter="${k}" aria-label="Limpar ${labels[k]}">${esc(options[k].find(([id])=>id===v)?.[1]||v)} ×</button>`).join('')+(active.length?'<button class="quiet" data-action="clear-filters">Limpar filtros</button>':'');}
  function titleHtml(e){return `<span class="entry-icon ${e.type==='income'?'income':e.type==='transfer'?'transfer':''}">${e.type==='income'?'＋':e.type==='transfer'?'⇄':e.type==='opening'?'◉':'−'}</span><span class="grow"><strong>${esc(e.description)}</strong><small>${esc([modeName(e),e.shares?'Compartilhado':'',e.special==='invoice'?'Pagamento de fatura':e.special==='settlement'?'Acerto entre pessoas':e.special==='opening'?'Lançamento especial':''].filter(Boolean).join(' · ')||kindName(e))}</small></span>`;}
  function valueHtml(e){const n=view==='economic'&&e.shares?myShare(e):e.author!=='me'?myShare(e):e.amount;return `<div class="row-value num ${e.type==='income'?'positive':e.type==='expense'?'negative':''}">${e.type==='income'?'+ ':e.type==='expense'?'− ':''}${money(n)}${e.shares?`<small>${view==='economic'?'Sua parte · total '+money(e.amount):e.author==='me'?'Sua parte '+money(myShare(e)):'Sua participação'}</small>`:''}</div>`;}
  function render(){
    const list=filtered(),s=summary(list);$('period-label').textContent=period.start&&period.end&&period.start===monthStart(period.start)&&period.end===addDays(addMonths(period.start,1),-1)?monthName(period.start):(!period.start?'Início do histórico':shortDate(period.start))+' – '+(!period.end?'sem fim':shortDate(period.end));
    $('sum-income').textContent=money(s.income);$('sum-expense').textContent=money(s.expense);$('sum-result').textContent=money(s.income-s.expense);$('income-note').textContent='+ '+money(s.plannedIncome)+' a receber';$('expense-note').textContent='+ '+money(s.plannedExpense)+' a realizar';
    $('summary-note').textContent=view==='economic'?'Sua participação nas operações efetivadas até hoje.':'Movimentos efetivados em contas até hoje; compras no cartão ficam na fatura.';
    $('pending-count').textContent=entries.filter(e=>inPeriod(e)&&pending(e)).length;
    if(phone)$('phone-view-name').textContent=view==='economic'?'Minha participação':'Fluxo de caixa';
    document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.view===view)));document.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.tab===tab)));

      return `<article class="box phone-entry ${selected.has(e.id)?'selected':''}" data-entry="${esc(e.id)}">${selecting?check:''}<button class="entry-title" data-detail="${esc(e.id)}">${titleHtml(e)}</button><div>${valueHtml(e)}<div style="text-align:right">${statusHtml(e)}</div></div><button class="more" data-more="${esc(e.id)}" aria-label="Ações de ${esc(e.description)}">⋮</button></article>`;});

  function openPeriod(){const saved=preferences.get();openDialog('Período global','Este período orienta a lista e o resumo da demonstração.',`<div class="field"><label for="period-preset">Atalho</label><select id="period-preset" class="input"><option value="custom">Datas escolhidas</option><option value="current">Mês atual</option><option value="previous">Mês anterior</option><option value="next">Próximo mês</option><option value="last15">Últimos 15 dias</option></select></div><div class="pair"><div class="field"><label for="period-start">De</label><input class="input" type="date" id="period-start" value="${esc(period.start)}"></div><div class="field"><label for="period-end">Até</label><input class="input" type="date" id="period-end" value="${esc(period.end)}"></div></div><p class="help">Só início: até hoje. Só fim: desde o começo do histórico.</p><label class="switch-label"><input type="checkbox" id="save-period">Usar como preferência ao entrar novamente</label><p class="help">${embedded?'Nesta avaliação isolada, a preferência é apenas demonstrativa.':saved?'Já existe uma preferência salva.':'Sem preferência salva, o padrão é o mês atual.'} Trocar o período não salva a preferência automaticamente.</p>`,()=>{const start=$('period-start').value,end=$('period-end').value,preset=$('period-preset').value;if((start&&!validDate(start))||(end&&!validDate(end))||(start&&end&&start>end)){return $('dialog-error').textContent='Informe um intervalo válido.';}if($('save-period').checked)preferences.set(preset==='custom'?{start,end}: {relative:preset});setPeriod({start,end:end|| (start?today:'')});closeDialog();},'Aplicar período');}
  function accountOptions(type,selectedId){return accounts.filter(a=>type!=='transfer'||a.type!=='Cartão').map(a=>`<option value="${a.id}" ${a.id===selectedId?'selected':''}>${esc(a.name)}</option>`).join('');}

  function syncDraft(){if(panelKind!=='editor'||!draft)return;const map={description:'entry-description',amount:'entry-amount',date:'entry-date',status:'entry-status',account:'entry-account',destination:'entry-destination',category:'entry-category',project:'entry-project',frequency:'entry-frequency',quantity:'entry-quantity',duration:'entry-duration'};for(const [key,id] of Object.entries(map))if($(id))draft[key]=$(id).value;if($('entry-sharing'))draft.sharing=$('entry-sharing').checked;if($('entry-favorite'))draft.favorite=$('entry-favorite').checked;}
  function schedule(){const d=draft,total=cents(d.amount),dates=[];if(!validDate(d.date)||total===null||!total)return dates;if(d.id||d.mode==='single')return [{date:d.date,amount:total}];if(d.mode==='installment'){const count=Number(d.quantity);if(!Number.isInteger(count)||count<2||count>240||total<count)return dates;for(let i=0;i<count;i++)dates.push({date:occurrenceDate(d.date,d.frequency,i),amount:Math.floor(total/count)+(i===0?total%count:0)});}else{const duration=Number(d.duration);if(!Number.isInteger(duration)||duration<1||duration>120)return dates;const end=addMonths(d.date,duration);for(let i=0;i<6000;i++){const date=occurrenceDate(d.date,d.frequency,i);if(date>=end)break;dates.push({date,amount:total});}}return dates;}
  function renderGeneration(){if(!$('generation'))return;const d=draft;if(d.mode==='single'){$('generation').innerHTML='';return;}const editing=!!d.id;const config=editing?'<p class="help" style="margin:12px 0">O valor é desta ocorrência. As demais só mudam se você escolher um alcance coletivo ao salvar.</p>':`<div class="option-box"><div class="pair"><div class="field"><label for="${d.mode==='installment'?'entry-quantity':'entry-duration'}">${d.mode==='installment'?'Quantidade de parcelas':'Duração em meses'}</label><input type="number" class="input" id="${d.mode==='installment'?'entry-quantity':'entry-duration'}" value="${esc(d.mode==='installment'?d.quantity:d.duration)}" min="${d.mode==='installment'?2:1}" max="${d.mode==='installment'?240:120}" step="1"></div><div class="field"><label for="entry-frequency">Frequência</label><select class="input" id="entry-frequency">${frequencies.map(([id,n])=>`<option value="${id}" ${d.frequency===id?'selected':''}>${n}</option>`).join('')}</select></div></div><div id="schedule-preview"></div></div>`;$('generation').innerHTML=config;updatePreview();$('amount-label').textContent=d.mode==='installment'&&!editing?'Valor total':'Valor por ocorrência';}
  function updatePreview(){if(!$('schedule-preview'))return;const list=schedule(),total=list.reduce((s,x)=>s+x.amount,0);$('entry-submit').textContent=draft.id?'Salvar alterações':list.length>1?`Adicionar ${list.length} lançamentos`:'Adicionar lançamento';if(!list.length){$('schedule-preview').innerHTML='<p class="help">Informe valor, data e quantidade/duração para conferir as ocorrências.</p>';return;}$('schedule-preview').innerHTML=`<p class="occurrences-summary">${list.length} ${draft.mode==='installment'?'parcelas':'ocorrências'} · ${money(total)} no conjunto</p><p class="help">${draft.mode==='installment'?`Primeira: ${money(list[0].amount)}. Restantes: ${money(list.at(-1).amount)}. Centavos residuais ficam na primeira.`:`Última em ${fullDate(list.at(-1).date)}. Término exclusivo em ${shortDate(addMonths(draft.date,Number(draft.duration)))}.`}</p><details><summary class="help" style="min-height:36px;padding-top:9px;cursor:pointer">Conferir datas e valores</summary><table class="preview-table"><thead><tr><th>Nº</th><th>Data</th><th>Valor</th></tr></thead><tbody>${list.slice(0,200).map((x,i)=>`<tr><td>${i+1}</td><td>${shortDate(x.date)}</td><td>${money(x.amount)}</td></tr>`).join('')}</tbody></table>${list.length>200?'<p class="help">Prévia limitada às primeiras 200 ocorrências.</p>':''}</details><p class="help" style="margin-top:8px">Todas as ocorrências são criadas antecipadamente; cada uma poderá ser ajustada. ${draft.mode==='recurring'?'Na data da última, o sistema oferecerá renovação.':''}</p>`;}
  function accountHint(){if(!$('account-hint'))return;if(draft.account==='card'){$('account-hint').textContent='Compra no cartão. Competência da fatura: '+monthName(addMonths(monthStart(draft.date||today),Number((draft.date||today).slice(-2))>10?1:0))+'. Não sai dinheiro da conta agora.';}else $('account-hint').textContent=draft.date>today?'Data futura: entra na projeção, sem antecipar o saldo atual.':'A movimentação pertence à conta selecionada.';}
  function equalShares(total,ids){const each=Math.floor(total/ids.length);return ids.map(id=>({id,cents:each+(id==='me'?total%ids.length:0)}));}
  function renderSharing(rebalance=false){if(!$('sharing'))return;$('sharing').hidden=!draft.sharing;if(!draft.sharing)return;const total=cents(draft.amount)||0;if(rebalance||!draft.shares.length||draft.shares.reduce((s,x)=>s+x.cents,0)!==total)draft.shares=equalShares(total,draft.participants);domWriting++;try{$('sharing').innerHTML=`<div class="option-box"><p class="help">Pessoas de grupos com vínculo aceito. Ninguém acessa a conta das demais pessoas.</p><div class="segmented" style="margin:14px 0" aria-label="Forma do rateio">${[['equal','Igual'],['amount','Valores'],['percent','Percentuais']].map(([id,n])=>`<button type="button" data-share-mode="${id}" aria-pressed="${draft.shareMode===id}">${n}</button>`).join('')}</div>${people.map(p=>{const included=draft.participants.includes(p.id),part=draft.shares.find(x=>x.id===p.id)?.cents||0;return `<div class="share-person"><input type="checkbox" class="check" data-person="${p.id}" aria-label="Incluir ${esc(p.name)}" ${included?'checked':''} ${p.id==='me'?'disabled':''}><span class="avatar">${esc(p.name[0])}</span><div class="grow"><strong>${esc(p.name)}</strong><small>${esc(p.group)}</small></div>${included?draft.shareMode==='equal'?`<strong class="num">${money(part)}</strong>`:`<input class="input" data-share-value="${p.id}" inputmode="decimal" value="${draft.shareMode==='percent'?(total?((part/total)*100).toFixed(2).replace('.',','):'0,00'):decimal(part)}" aria-label="${draft.shareMode==='percent'?'Percentual':'Valor'} de ${esc(p.name)}">${draft.shareMode==='percent'?'<span>%</span>':''}`:''}</div>`;}).join('')}<div class="share-total"><span>Soma das partes</span><strong class="num">${money(draft.shares.reduce((s,x)=>s+x.cents,0))} / ${money(total)}</strong></div><p class="help" style="margin-top:9px">${draft.mode==='installment'&&!draft.id?'A divisão acima refere-se ao total e será repartida em cada parcela.':'A divisão será aplicada a cada ocorrência.'} Alterar um rateio solicita nova aprovação de todos.</p></div>`;}finally{domWriting--;}}
  function redistributeShare(id,text){const total=cents(draft.amount)||0,parsed=cents(text);let value=parsed;if(draft.shareMode==='percent')value=parsed===null?null:Math.round(total*parsed/10000);if(value===null||value<1||value>total-(draft.participants.length-1)){toast('Cada parte deve ser positiva e caber no total.');renderSharing();return;}const others=draft.participants.filter(x=>x!==id),remaining=total-value;draft.shares=others.map((x,i)=>({id:x,cents:Math.floor(remaining/others.length)+(x==='me'||(!others.includes('me')&&i===0)?remaining%others.length:0)}));draft.shares.push({id,cents:value});renderSharing();}
  function showSuggestions(){const text=$('entry-description').value.toLowerCase().trim();if(!text){$('suggestions').hidden=true;return;}const seen=new Set();const list=entries.filter(e=>e.author==='me'&&e.type===draft.type&&!e.special&&e.description.toLowerCase().includes(text)).filter(e=>{if(seen.has(e.description))return false;seen.add(e.description);return true;}).slice(0,4);$('suggestions').hidden=!list.length;$('suggestions').innerHTML=list.map(e=>`<button type="button" data-history="${e.id}">${esc(e.description)}<small>${esc(categoryName(e.category))} · ${esc(accountName(e.account))} · ${e.classification==='fixed'?'Fixa':'Variável'}</small></button>`).join('');}

  function apportionRow(total,remaining,futureRows) {

    if(difference)throw Error('Não foi possível fechar o rateio em centavos.');
    return row;
  }
