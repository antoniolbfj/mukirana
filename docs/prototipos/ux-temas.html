<script>
'use strict';
const phone = /iPhone|iPod|Android.+Mobile/i.test(navigator.userAgent) || new URLSearchParams(location.search).get('device') === 'phone';
document.body.classList.toggle('proto-phone', phone);

document.getElementById('mount').append(document.getElementById(phone ? 'phone' : 'large').content.cloneNode(true));
const money = cents => (cents / 100).toLocaleString('pt-BR', {style:'currency', currency:'BRL'});
const shortMoney = cents => (cents / 100).toLocaleString('pt-BR', {notation:'compact', maximumFractionDigits:1});
const monthDate = value => new Date(value + '-01T12:00:00Z');
const monthKey = date => date.toISOString().slice(0, 7);
const shiftMonth = (value, amount) => {const d = monthDate(value); d.setUTCMonth(d.getUTCMonth() + amount); return monthKey(d);};
const monthName = (value, long = false) => monthDate(value).toLocaleDateString('pt-BR', {month:long ? 'long' : 'short', timeZone:'UTC'}).replace('.', '');
const demoToday = '2026-10';
let activeView = 'painel', anchor = demoToday, chartMode = 'three', chartAccount = 'all', selectedMonth = demoToday, last;
const entries = [['23 out','Restaurante · sua parte','Alimentação','− R$ 100,00'],['22 out','Mercado da semana','Alimentação','− R$ 248,90'],['20 out','Recebimento do mês','Trabalho','+ R$ 7.500,00'],['18 out','Internet','Casa','− R$ 119,90']];
const goals = [{name:'Alimentação', spent:84000, cap:120000}, {name:'Casa', spent:59000, cap:64000}, {name:'Mobilidade', spent:19000, cap:17500}];
const goalSignal = (spent, cap) => spent > cap ? 'danger' : spent >= cap * .8 ? 'warning' : 'good';
const balanceSignal = value => value < 0 ? 'danger' : value === 0 ? 'warning' : 'good';
const signalName = value => ({good:'Em dia', warning:'Acompanhar', danger:'Atenção'})[value];
function monthResult(key) {return [214000,242000,198000,260000,284000,310000,273000,320000,296000,384000,418000,392000][monthDate(key).getUTCMonth()];}
function wealthValue(key, account = chartAccount) {
  const d = monthDate(key), i = d.getUTCMonth(), years = d.getUTCFullYear() - 2026;
  const reserve = [1280000,1320000,1285000,1360000,1420000,1475000,1515000,1580000,1720000,1840000,1915000,1990000][i] + years * 720000;
  const objectives = [120000,135000,135000,150000,150000,155000,160000,165000,120000,124000,135000,155000][i] + years * 40000;
  return account === 'reserve' ? reserve : account === 'objectives' ? objectives : reserve + objectives;
}
function chartMonths() {
  const [year, month] = anchor.split('-').map(Number);
  const start = chartMode === 'three' ? shiftMonth(anchor, -1) : `${year}-${chartMode === 'half' && month > 6 ? '07' : '01'}`;

function badge(signal, text) {return `<span class="signal signal-badge" data-signal="${signal}">${text}</span>`;}
function goalsHtml() {
  return `<section class="proto-card"><h2>Metas do mês</h2><p class="section-description">Seu progresso em relação ao teto de despesas.</p>${goals.map(g => {

  }).join('')}<button data-view="metas">Ver todas as metas →</button></section>`;

function chartShell() {
  return `<section class="proto-card chart-card" aria-labelledby="wealth-title"><div class="chart-head"><div><h2 id="wealth-title">Evolução patrimonial</h2><p>Somente contas de investimento. Valores realizados e projeções separados.</p></div><div class="chart-controls"><div class="chart-tabs" role="group" aria-label="Visão da evolução patrimonial">${[['three','3 meses'],['half','Semestral'],['year','Anual']].map(([key,label])=>`<button data-chart-mode="${key}" aria-pressed="${chartMode===key}">${label}</button>`).join('')}</div><label class="chart-account">Contas de investimento<select id="wealth-account"><option value="all">Todas as contas</option><option value="reserve">Reserva</option><option value="objectives">Objetivos</option></select></label></div></div><div id="wealth-body"></div></section>`;
}
function drawChart() {
  const target = document.getElementById('wealth-body'); if (!target) return;
  const keys = chartMonths(), values = keys.map(k=>wealthValue(k));
  if (!keys.includes(selectedMonth)) selectedMonth = keys.includes(anchor) ? anchor : keys[0];
  const width = phone ? 340 : 960, height = phone ? 240 : 250;
  const left = phone ? 48 : 62, right = phone ? 25 : 30, top = 24, bottom = 40;
  const ceiling = Math.max(...values.map(Math.abs), 10000) * 1.2;
  const min = Math.min(...values, 0), max = ceiling, span = max - min;
  const x = i => left + i * (width - left - right) / Math.max(keys.length - 1,1);
  const y = value => top + (max-value) / span * (height - top - bottom);
  const path = points => points.map((p,i)=>(i?'L':'M')+x(p.i).toFixed(1)+','+y(p.v).toFixed(1)).join(' ');
  const points = values.map((v,i)=>({v,i,key:keys[i]})), actual = points.filter(p=>p.key<=demoToday), future = points.filter(p=>p.key>demoToday);

  const diff = values.at(-1) - values[0], signal = balanceSignal(diff), prefix = diff > 0 ? '+' : diff < 0 ? '−' : '';
  const area = path(points) + ` L${x(keys.length-1)},${y(0)} L${x(0)},${y(0)} Z`;
  const tickEvery = Math.ceil(keys.length / (phone ? 4 : 12));
  target.innerHTML = `<div class="chart-summary"><div><small>${valueStatus(selectedMonth)} · ${monthName(selectedMonth,true)} de ${selectedMonth.slice(0,4)}</small><strong>${money(wealthValue(selectedMonth))}</strong>${badge(signal, `${prefix}${money(Math.abs(diff))} no intervalo`)}</div><div class="chart-range">${monthName(keys[0],true)} ${keys[0].slice(0,4)} — ${monthName(keys.at(-1),true)} ${keys.at(-1).slice(0,4)}</div></div><div class="chart-plot"><span style="font-size:10px;color:var(--ux-muted)">Saldo (R$)</span><svg viewBox="0 0 ${width} ${height}" role="img" aria-labelledby="chart-svg-title chart-svg-desc"><title id="chart-svg-title">Evolução patrimonial em ${keys.length} meses</title><desc id="chart-svg-desc">${keys.map((k,i)=>`${monthName(k,true)} de ${k.slice(0,4)}: ${money(values[i])}, ${valueStatus(k)}`).join('; ')}. Selecione um mês abaixo para ver o valor.</desc><defs><linearGradient id="wealth-fill" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="var(--ux-primary)" stop-opacity=".15"/><stop offset="100%" stop-color="var(--ux-primary)" stop-opacity="0"/></linearGradient></defs>${Array.from({length:4},(_,i)=>{const v=min+span*i/3;return `<line class="chart-grid" x1="${left}" y1="${y(v)}" x2="${width-right}" y2="${y(v)}"/><text class="chart-axis" x="${left-9}" y="${y(v)+4}" text-anchor="end">${shortMoney(v*1)}</text>`;}).join('')}<path class="chart-area" d="${area}"/>${actual.length ? `<path class="chart-line" d="${path(actual)}"/>` : ''}${projected.length ? `<path class="chart-line projected" d="${path(projected)}"/>` : ''}${points.map((p,i)=>`<circle class="chart-dot ${p.key===selectedMonth?'is-current':''}" cx="${x(i)}" cy="${y(p.v)}" r="${p.key===selectedMonth?5:3.5}"><title>${monthName(p.key,true)}: ${money(p.v)} · ${valueStatus(p.key)}</title></circle>${i%tickEvery===0||i===points.length-1?`<text class="chart-axis" x="${x(i)}" y="${height-12}" text-anchor="middle">${monthName(p.key)}</text>`:''}`).join('')}</svg></div><div class="chart-months" role="group" aria-label="Valores mensais do patrimônio">${keys.map((k,i)=>`<button data-wealth-month="${k}" aria-pressed="${k===selectedMonth}" aria-label="${monthName(k,true)} de ${k.slice(0,4)}, ${money(values[i])}, ${valueStatus(k)}"><span>${monthName(k)}</span><b>${money(values[i])}</b><small>${valueStatus(k)}</small></button>`).join('')}</div><div class="wealth-selection" role="status" aria-live="polite">${monthName(selectedMonth,true)}: ${money(wealthValue(selectedMonth))} · ${valueStatus(selectedMonth)}${selectedMonth>demoToday?' — projeção demonstrativa; não representa rendimento garantido.':''}</div><div class="chart-footer"><div class="chart-key"><span><i></i>Realizado</span><span><i class="dashed"></i>Projetado</span></div><button data-wealth-table>Ver dados do gráfico →</button></div>`;
  document.querySelectorAll('[data-chart-mode]').forEach(b=>b.setAttribute('aria-pressed', b.dataset.chartMode===chartMode));
  document.getElementById('wealth-account').value = chartAccount;
}
function dashboard() {
  return title('Seu painel', `${monthName(anchor,true)} de ${anchor.slice(0,4)} · o essencial para decidir com tranquilidade.`,false) + `<div class="signal-guide" aria-label="Legenda dos indicadores"><span class="signal"><i></i>Verde · em dia</span><span class="signal" data-signal="warning"><i></i>Amarelo · acompanhar</span><span class="signal" data-signal="danger"><i></i>Vermelho · atenção</span><button data-signal-rules style="min-height:32px;border:0;padding:2px 0;background:transparent;font-size:11px;color:var(--ux-muted)">Como interpretar</button></div><div class="proto-grid3 monthly-grid">${[-1,0,1].map((offset,i)=>{
    const key=shiftMonth(anchor,offset), v=monthResult(key), s=balanceSignal(v);
    return `<article class="proto-card signal" data-signal="${s}"><h2 class="card-title">${['Mês anterior','Mês atual','Próximo mês'][i]}</h2><span class="period-name">${monthName(key,true)} ${key.slice(0,4)}</span><strong class="metric">${money(v)}</strong>${badge(s,v<0?'Resultado negativo':v===0?'Sem margem':'Resultado positivo')}<p class="metric-meta" style="margin-top:10px">${key>demoToday?'Resultado previsto':'Resultado do período'}</p></article>`;
  }).join('')}</div><div class="proto-grid3 positions-grid"><article class="proto-card signal"><h2>Patrimônio atual</h2><p class="metric-meta">Contas de investimento · até 25 out</p><strong class="metric">${money(wealthValue(demoToday,'all'))}</strong>${badge('good','↑ '+money(wealthValue(demoToday,'all')-wealthValue('2026-09','all'))+' desde setembro')}</article><article class="proto-card signal" data-signal="warning"><h2>Metas em atenção</h2><p class="metric-meta">Acompanhe antes de gastar</p><strong class="metric">2 de 3</strong>${badge('warning','1 perto do teto · 1 excedida')}<p class="metric-meta" style="margin-top:12px">Os detalhes estão nas metas do mês.</p></article><button class="proto-card rateio-card signal" data-view="rateios" aria-label="Saldo do rateio: R$ 100,00 a receber líquido. R$ 200,00 a receber e R$ 100,00 a pagar. Abrir Rateios e acertos."><span class="card-top"><span class="card-title">Saldo do rateio</span><span class="card-arrow" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 18 18 6M6 6h12v12"/></svg></span></span><span class="metric-meta">Acumulado entre pessoas · abrir rateios</span><span class="metric">+ ${money(10000)}</span>${badge('good','A receber líquido')}<span class="rateio-split"><span>A receber<b style="color:var(--ux-positive)">${money(20000)}</b></span><span>A pagar<b style="color:var(--ux-negative)">${money(10000)}</b></span></span></button></div>${chartShell()}<div class="proto-grid2"><section class="proto-card"><h2>Para onde foi</h2><p class="section-description">Seu consumo por categoria, incluindo sua parte nos rateios.</p>${[['Alimentação',84000,72],['Casa',59000,51],['Mobilidade',19000,16]].map(([n,v,p])=>`<div class="proto-line"><span>${n}</span><b>${money(v)}</b></div><div class="proto-bar"><i style="width:${p}%"></i></div>`).join('')}<p style="margin-top:18px">Acertos quitam o saldo entre pessoas sem repetir o consumo.</p></section>${goalsHtml()}</div>`;
}
function render(view = 'painel', focus = false) {
  activeView = view;
  document.querySelectorAll('[data-view]').forEach(b=>{b.classList.toggle('active',b.dataset.view===view);if(b.dataset.view===view)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});
  let html;
  if (view==='lancamentos') html=title('Lançamentos','Seu dinheiro, organizado em um só lugar.')+'<input class="proto-search" id="search" aria-label="Buscar lançamento" placeholder="Buscar descrição, categoria ou conta"><div id="rows"></div>';
  else if(view==='painel') html=dashboard();
  else if(view==='metas') html=title('Metas','Verde: dentro do teto · amarelo: perto do teto · vermelho: teto excedido.',false)+goalsHtml();
  else {
    const names={contas:'Contas',cartoes:'Cartões',rateios:'Rateios e acertos'};
    const items=view==='rateios'?[['Marina','R$ 100,00 a pagar','danger'],['Rafael','R$ 200,00 a receber','good']]:view==='cartoes'?[['Principal','R$ 1.280,00','danger'],['Dia a dia','R$ 420,00','danger']]:[['Conta do dia a dia','R$ 4.260,00','good'],['Reserva','R$ 18.400,00','good'],['Objetivos','R$ 1.240,00','good']];
    html=title(names[view]||'Seu espaço',view==='rateios'?'Acumulado entre pessoas. O saldo de uma pessoa não quita a dívida com outra.':'Informação essencial, ações próximas e detalhes quando você precisar.')+`<div class="${phone?'':'proto-grid3'}">${items.map(([n,v,s])=>`<article class="proto-card signal" data-signal="${s}" style="margin-bottom:12px"><h2>${n}</h2><strong class="metric">${v}</strong><span class="proto-chip">${view==='contas'?'Saldo atual':'Resumo'}</span><p style="margin:14px 0">Dados demonstrativos</p><button data-detail="${n}">Ver detalhes →</button></article>`).join('')}</div>`;
  }
  document.getElementById('content').innerHTML=html;
  if(view==='painel')drawChart();
  if(view==='lancamentos')drawRows('');
  if(focus)document.getElementById('view-title')?.focus({preventScroll:true});
}
function drawRows(q) {
  const list=entries.filter(e=>e.join(' ').toLowerCase().includes(q.toLowerCase()));
  document.getElementById('rows').innerHTML=phone?list.map(e=>`<article class="proto-phone-entry"><div><button data-detail="${e[1]}">${e[1]}</button><small>${e[0]} · ${e[2]}</small></div><b style="color:var(--ux-${e[3].startsWith('+')?'positive':'negative'})">${e[3]}</b></article>`).join(''):`<div class="proto-table">${list.map(e=>`<div class="proto-row"><small>${e[0]}</small><button data-detail="${e[1]}">${e[1]}</button><small>${e[2]}</small><b style="color:var(--ux-${e[3].startsWith('+')?'positive':'negative'})">${e[3]}</b><span class="proto-tag">Efetivado</span></div>`).join('')}</div>`;
}
function openDetail(button, heading, html) {
  last=button;document.getElementById('detail-title').textContent=heading;document.getElementById('detail-content').innerHTML=html;document.getElementById('detail').hidden=false;document.getElementById('mount').inert=true;document.getElementById('close').focus();
}
function closeDetail() {document.getElementById('detail').hidden=true;document.getElementById('mount').inert=false;last?.focus();}
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.view){render(b.dataset.view,true);return;}
  if(b.dataset.chartMode){chartMode=b.dataset.chartMode;drawChart();return;}
  if(b.dataset.wealthMonth){selectedMonth=b.dataset.wealthMonth;drawChart();document.querySelector(`[data-wealth-month="${selectedMonth}"]`)?.focus({preventScroll:true});return;}
  if(b.hasAttribute('data-wealth-table'))openDetail(b,'Dados da evolução patrimonial',`<p>Somente ${chartAccount==='all'?'contas de investimento':chartAccount==='reserve'?'a conta Reserva':'a conta Objetivos'}. Dados fictícios. Não inclui saldo do rateio, contas de consumo ou limites de crédito.</p><table><thead><tr><th>Mês</th><th>Patrimônio</th><th>Posição</th></tr></thead><tbody>${chartMonths().map(k=>`<tr><td>${monthName(k)} ${k.slice(0,4)}</td><td>${money(wealthValue(k))}</td><td>${valueStatus(k)}</td></tr>`).join('')}</tbody></table>`);
  else if(b.hasAttribute('data-signal-rules'))openDetail(b,'Como interpretar as cores',`<p>As cores acompanham o significado de cada indicador, sempre com texto e valores.</p><div class="goal-item">${badge('good','Verde · em dia')}<p style="margin-top:10px">Resultado positivo, saldo a receber ou meta de despesa abaixo de 80% do teto.</p></div><div class="goal-item">${badge('warning','Amarelo · acompanhar')}<p style="margin-top:10px">Resultado zerado, evolução estável ou meta de despesa entre 80% e 100% do teto.</p></div><div class="goal-item">${badge('danger','Vermelho · atenção')}<p style="margin-top:10px">Resultado negativo, saldo a pagar, redução patrimonial ou meta de despesa acima do teto.</p></div><p>Na evolução, a cor da diferença compara o último com o primeiro mês visível. A variação inclui aportes e resgates; não equivale à rentabilidade. Estes limites visuais são uma proposta para avaliação.</p>`);
  else if(b.dataset.detail)openDetail(b,b.dataset.detail,'<p>Detalhe demonstrativo do componente. A implementação conectada conserva os formulários, regras e dados existentes.</p><div class="proto-line"><span>Restaurante rateado</span><b>R$ 100,00</b></div><p>Participação classificada em Alimentação. O pagamento do acerto quita o saldo entre pessoas.</p>');
  if(b.id==='close')closeDetail();
});
document.addEventListener('input',e=>{if(e.target.id==='search')drawRows(e.target.value);});
document.addEventListener('change',e=>{
  if(e.target.id==='wealth-account'){chartAccount=e.target.value;drawChart();return;}
  if(e.target.type==='month' && /^\d{4}-\d{2}$/.test(e.target.value)){
    const inputs=[...document.querySelectorAll('.proto-period input')];
    if(inputs[0].value>inputs[1].value)inputs[e.target===inputs[0]?1:0].value=e.target.value;
    anchor=inputs[1].value;selectedMonth=anchor;if(activeView==='painel')render();
  }
});
document.addEventListener('keydown',e=>{
  const detail=document.getElementById('detail');if(detail.hidden)return;
  if(e.key==='Escape')closeDetail();
  if(e.key==='Tab'){const elements=[...detail.querySelectorAll('button,a[href],input,select,[tabindex="0"]')],first=elements[0],end=elements.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();end.focus();}else if(!e.shiftKey&&document.activeElement===end){e.preventDefault();first.focus();}}
});
document.querySelectorAll('.proto-balance strong').forEach(e=>e.style.color='var(--ux-positive)');
render();

</script></body></html>
