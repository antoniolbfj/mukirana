<script>
const phone=/iPhone|iPod|Android.+Mobile/i.test(navigator.userAgent)||new URLSearchParams(location.search).get('device')==='phone';document.body.classList.toggle('proto-phone',phone);document.body.dataset.interface=phone?'phone':'large';document.getElementById('mount').append(document.getElementById(phone?'phone':'large').content.cloneNode(true));
const entries=[['23 out','Restaurante · sua parte','Alimentação','− R$ 100,00'],['22 out','Mercado da semana','Alimentação','− R$ 248,90'],['20 out','Recebimento do mês','Trabalho','+ R$ 7.500,00'],['18 out','Internet','Casa','− R$ 119,90']];
function title(t,p){return '<div class="proto-head"><div><h1>'+t+'</h1><p>'+p+'</p></div><button class="proto-primary" data-detail="Ação contextual">＋ Novo</button></div>';}
function render(view='painel'){document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));let html='';if(view==='lancamentos'){html=title('Lançamentos','Seu dinheiro, organizado em um só lugar.')+'<input class="proto-search" id="search" aria-label="Buscar lançamento" placeholder="Buscar descrição, categoria ou conta"><div id="rows"></div>';document.getElementById('content').innerHTML=html;drawRows('');return;}
if(view==='painel'||view==='metas'){html=title('Seu painel','Outubro de 2026 · uma visão clara do seu mês.')+'<div class="proto-grid3">'+[['Setembro','R$ 2.960,00'],['Outubro','R$ 3.840,00'],['Novembro','R$ 4.180,00']].map(([m,v])=>'<article class="proto-card"><small>'+m+'</small><strong>'+v+'</strong><small>Resultado do período</small></article>').join('')+'</div><div class="'+(phone?'':'proto-grid2')+'"><section class="proto-card"><h2>Para onde foi</h2>'+[['Alimentação','R$ 840,00',72],['Casa','R$ 590,00',51],['Mobilidade','R$ 190,00',16]].map(([n,v,p])=>'<div class="proto-line"><span>'+n+'</span><b>'+v+'</b></div><div class="proto-bar"><i style="width:'+p+'%"></i></div>').join('')+'<p style="margin-top:18px">Inclui suas participações nos rateios.</p></section><section class="proto-card" style="'+(phone?'margin-top:14px':'')+'"><h2>Metas do mês</h2><div class="proto-line"><span>Alimentação</span><b>R$ 840 / 1.200</b></div><div class="proto-bar"><i style="width:70%"></i></div><p style="margin:14px 0">R$ 360,00 disponíveis no teto</p><button data-detail="Meta de Alimentação">Ajustar meta</button><h2 style="margin-top:30px">A acertar</h2><p>R$ 200,00 a receber · R$ 100,00 a pagar</p><button style="margin-top:14px" data-view="rateios">Ver rateios e acertos →</button></section></div>';}
else{const names={contas:'Contas',cartoes:'Cartões',rateios:'Rateios e acertos'};html=title(names[view]||'Seu espaço','Informação essencial, ações próximas e detalhes quando você precisar.')+'<div class="'+(phone?'':'proto-grid3')+'">'+(view==='rateios'?[['Marina','R$ 100,00 a pagar'],['Rafael','R$ 200,00 a receber']]:view==='cartoes'?[['Principal','R$ 1.280,00'],['Dia a dia','R$ 420,00']]:[['Conta do dia a dia','R$ 4.260,00'],['Reserva','R$ 18.400,00']]).map(([n,v])=>'<article class="proto-card" style="margin-bottom:12px"><small>'+n+'</small><strong>'+v+'</strong><span class="proto-chip">'+(view==='contas'?'Saldo atual':'Resumo')+'</span><p style="margin:14px 0">Dados demonstrativos</p><button data-detail="'+n+'">Ver detalhes →</button></article>').join('')+'</div>';}
document.getElementById('content').innerHTML=html;}
function drawRows(q){const list=entries.filter(e=>e.join(' ').toLowerCase().includes(q.toLowerCase()));document.getElementById('rows').innerHTML=phone?list.map(e=>'<article class="proto-phone-entry"><div><button data-detail="'+e[1]+'">'+e[1]+'</button><small>'+e[0]+' · '+e[2]+'</small></div><b>'+e[3]+'</b></article>').join(''):'<div class="proto-table">'+list.map(e=>'<div class="proto-row"><small>'+e[0]+'</small><button data-detail="'+e[1]+'">'+e[1]+'</button><small>'+e[2]+'</small><b>'+e[3]+'</b><span class="proto-tag">Efetivado</span></div>').join('')+'</div>';}
let last;function closeDetail(){document.getElementById('detail').hidden=true;document.getElementById('mount').inert=false;last?.focus();}document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.view)render(b.dataset.view);if(b.dataset.detail){last=b;document.getElementById('detail-title').textContent=b.dataset.detail;document.getElementById('detail-content').innerHTML='<p>Detalhe demonstrativo do componente. A implementação conectada conserva os formulários, regras e dados existentes.</p><div class="proto-line"><span>Restaurante rateado</span><b>R$ 100,00</b></div><p>Participação classificada em Alimentação. O pagamento do acerto quita o saldo entre pessoas.</p>';document.getElementById('detail').hidden=false;document.getElementById('mount').inert=true;document.getElementById('close').focus();}if(b.id==='close')closeDetail();});document.addEventListener('input',e=>{if(e.target.id==='search')drawRows(e.target.value);});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDetail();});render();
</script></body></html>
