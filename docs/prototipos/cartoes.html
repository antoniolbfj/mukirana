function render(){let q=$('search').value.trim().toLocaleLowerCase('pt-BR'),s=$('status').value,r=$('role').value;let list=groups.filter(g=>(s==='all'||g.active===(s==='active'))&&(r==='all'||g.owner===(r==='owner'))&&g.name.toLocaleLowerCase('pt-BR').includes(q));let owned=list.filter(g=>g.owner);$('total-open').textContent=money(owned.reduce((n,g)=>n+balance(g),0));$('total-planned').textContent=money(owned.reduce((n,g)=>n+g.planned,0));if($('total-additional'))$('total-additional').textContent=money(list.filter(g=>!g.owner).reduce((n,g)=>n+g.registered,0));$('count').textContent=list.length+' faturas';document.querySelectorAll('[data-status]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.status===s)));
$('list').innerHTML=list.map(g=>{let role=g.owner?'Sou titular':'Sou adicional',label=g.owner?'Em aberto':'Seus lançamentos',main=g.owner?balance(g):g.registered,pl=g.planned?'＋ '+money(g.planned)+' previstos':g.owner?'Sem previsão adicional':'Somente seu cartão',title='<div class="row-head"><span class="icon">'+cardIcon+'</span><div><h3>'+esc(g.name)+(g.active?'':' <span class="pill">Inativo</span>')+'</h3><p>'+role+'</p></div></div>';
if(phone)return '<article class="phone-card"><header>'+title+'<button class="more" data-action="actions" data-id="'+g.id+'" aria-label="Ações de '+esc(g.name)+'">···</button></header><p class="value-label">'+label+'</p><strong class="amount">'+money(main)+'</strong><p class="sub-amount">'+pl+'</p><p class="dates">Fecha dia '+g.closing+' · Vence dia '+g.due+'</p><footer><button class="link" data-action="cards" data-id="'+g.id+'">'+(g.owner?g.cards+' cartões vinculados':'Seu cartão')+'</button><button class="btn" data-action="invoice" data-id="'+g.id+'">Ver fatura →</button></footer></article>';
return '<article class="wide-row">'+title+'<div><p>Fecha dia '+g.closing+'</p><p class="muted">Vence dia '+g.due+'</p><button class="link" data-action="cards" data-id="'+g.id+'">'+(g.owner?g.cards+' cartões vinculados':'Seu cartão')+' ⌄</button></div><div><small class="sub-amount">'+label+'</small><strong class="amount">'+money(main)+'</strong><span class="sub-amount">'+pl+'</span></div><div class="wide-limit">'+(g.owner?'<strong style="font-size:13px">'+money(g.limit)+'</strong><div class="meter" role="meter" aria-label="Em aberto em relação ao limite" aria-valuenow="'+Math.round(100*main/g.limit)+'" aria-valuemin="0" aria-valuemax="100"><i style="width:'+Math.min(100,100*main/g.limit)+'%"></i></div><span class="sub-amount">'+Math.round(100*main/g.limit)+'% em aberto</span>':'<span class="sub-amount">Visão individual</span>')+'</div><div class="wide-actions"><button class="btn quiet" data-action="invoice" data-id="'+g.id+'">Ver fatura</button><button class="more" data-action="actions" data-id="'+g.id+'" aria-label="Ações de '+esc(g.name)+'">···</button></div></article>'}).join('')||'<div class="empty">Nenhum cartão encontrado. Altere a busca ou os filtros.</div>'}
function open(id){focus=document.activeElement;$(id).hidden=false;document.body.style.overflow='hidden';$(id).querySelector('input,button')?.focus()}
function close(id){$(id).hidden=true;document.body.style.overflow='';if(focus?.isConnected)focus.focus()}
function people(){let q=$('person-search').value.toLocaleLowerCase('pt-BR');$('people').innerHTML=persons.filter(n=>selected.has(n)||n.toLocaleLowerCase('pt-BR').includes(q)).map(n=>'<label class="person"><input type="checkbox" name="person" value="'+esc(n)+'" '+(selected.has(n)?'checked':'')+'>'+esc(n)+'</label>').join('')}
function editor(id){editing=groups.find(g=>g.id===id)||null;if(editing&&!editing.owner)return;$('form').reset();selected=new Set(editing?.people||[]);$('editor-title').textContent=editing?'Editar cartão':'Novo cartão';$('name').value=editing?.name||'';$('limit').value=editing?(editing.limit/100).toLocaleString('pt-BR',{minimumFractionDigits:2}):'';$('closing').value=editing?.closing||10;$('due').value=editing?.due||17;$('form-error').textContent='';people();open('editor');$('name').focus()}
function details(g,mode){current=g.id;$('detail-title').textContent=g.name;$('detail-subtitle').textContent=(g.owner?'Sua fatura':'Seus lançamentos')+' · outubro de 2026';$('detail-edit').hidden=!g.owner;let html='<section class="detail-total"><small class="help">'+(g.owner?'Em aberto':'Seus lançamentos')+'</small><strong>'+money(g.owner?balance(g):g.registered)+'</strong>'+(g.owner?'<p>Registrado <b>'+money(g.registered)+'</b></p><p>Pago <b>'+money(g.paid)+'</b></p><p>Previsto, separado <b>'+money(g.planned)+'</b></p>':'<p>Visão individual: sem movimentos de outros cartões.</p>')+'</section>';
html+='<h3 class="section-title">'+(mode==='invoice'?'Composição da fatura':'Cartões vinculados')+'</h3>';let names=g.owner?['Você · titular'].concat(g.people.map(n=>n+' · adicional')):['Você · adicional'];html+=names.map((n,i)=>'<div class="physical"><div><strong>'+esc(n)+'</strong><small>'+ (g.active?'Ativo':'Histórico preservado')+'</small></div><button class="btn quiet" data-action="movements">Lançamentos</button></div>').join('');html+='<p class="help" style="margin-top:20px">Fecha dia '+g.closing+' · Vence dia '+g.due+'</p>';if(g.owner)html+='<p class="help">O limite é compartilhado. Os adicionais não multiplicam o limite da fatura.</p>';$('detail-content').innerHTML=html;open('detail')}
function status(g){const next=!g.active;g.active=next;render();toast(next?'Cartão restaurado.':'Cartão inativado. Histórico preservado.',()=>{g.active=!next;render();toast('Alteração desfeita.')})}
function actions(g){$('actions-title').textContent=g.name;$('actions-content').innerHTML='<button data-action="invoice" data-id="'+g.id+'">Ver fatura</button><button data-action="cards" data-id="'+g.id+'">'+(g.owner?'Cartões vinculados':'Seu cartão')+'</button>'+(g.owner?'<button data-action="edit" data-id="'+g.id+'">Editar cadastro</button><button class="'+(g.active?'danger':'')+'" data-action="status" data-id="'+g.id+'">'+(g.active?'Inativar':'Restaurar')+'</button>':'');open('actions')}
for(let id of ['closing','due'])$(id).innerHTML=Array.from({length:31},(_,i)=>'<option value="'+(i+1)+'">Dia '+(i+1)+'</option>').join('');
$('search').oninput=render;$('status').onchange=render;$('role').onchange=render;$('person-search').oninput=people;$('people').onchange=e=>{if(e.target.checked)selected.add(e.target.value);else selected.delete(e.target.value)};$('detail-edit').onclick=()=>{close('detail');editor(current)};
document.addEventListener('click',e=>{let c=e.target.closest('[data-close]');if(c){close(c.dataset.close);return}let b=e.target.closest('[data-status]');if(b){$('status').value=b.dataset.status;render();return}b=e.target.closest('[data-action]');if(!b)return;let g=groups.find(g=>g.id===b.dataset.id),a=b.dataset.action;if(a==='actions'){actions(g);return}if(!$('actions').hidden)close('actions');if(a==='new')editor();if(a==='edit')editor(g.id);if(a==='status')status(g);if(a==='cards'||a==='invoice')details(g,a);if(a==='movements')toast('Prévia de navegação: abrir lançamentos deste cartão, mantendo o período.');});
$('form').onsubmit=e=>{e.preventDefault();let raw=$('limit').value.trim().replace(/\s/g,'');if(raw.includes(','))raw=raw.replace(/\./g,'').replace(',','.');const limit=Math.round(Number(raw)*100),name=$('name').value.trim();if(!name||!Number.isSafeInteger(limit)||limit<0){$('form-error').textContent='Revise o nome e informe um limite válido.';return}if(groups.some(g=>g.id!==editing?.id&&g.owner&&g.name.toLocaleLowerCase('pt-BR')===name.toLocaleLowerCase('pt-BR'))){$('form-error').textContent='Você já tem um cartão com esse nome.';return}let g=editing||{id:'demo-'+Date.now(),owner:true,active:true,registered:0,paid:0,planned:0};Object.assign(g,{name,limit,closing:Number($('closing').value),due:Number($('due').value),people:[...selected],cards:1+selected.size});if(!editing)groups.push(g);close('editor');render();toast('Prévia atualizada. Os exemplos voltam ao recarregar.');};document.addEventListener('keydown',e=>{if(e.key==='Escape'){for(let id of ['actions','editor','detail'])if(!$(id).hidden){close(id);break}}});render();})();
</script></body></html>
