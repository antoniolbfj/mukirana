/* Estrutura própria para smartphones. Compartilha somente tokens e controles básicos. */
body[data-interface="phone"]{background:#f6f7fb}

.phone-title-row h1{font-size:32px;letter-spacing:-1px}
.phone-count{font-size:11px;color:var(--muted);padding-bottom:4px}

.phone-forecast span{font-size:11px;color:var(--muted)}

.phone-forecast svg{width:17px;height:17px;color:var(--brand);display:none}
.phone-summary-note{font-size:10px;color:var(--muted);margin-top:10px;line-height:1.5}

.phone-filters{display:flex;gap:9px;margin:14px 0 19px}.phone-filters button{flex:1;min-height:44px;border-radius:12px;border:1px solid var(--line);font-size:12px;font-weight:600;background:#fff;color:var(--muted)}
.phone-filters button[aria-pressed="true"]{background:var(--soft);color:#4236ba;border-color:#d4cdf9}
.phone-accounts{display:grid;gap:12px}.phone-account{border:1px solid var(--line);background:white;border-radius:16px;padding:17px}
.phone-account-header{display:flex;align-items:center;gap:10px}.phone-account-header .account-icon{width:36px;height:36px;border-radius:11px}.phone-account-header .account-icon svg{width:19px;height:19px}.phone-account-title{flex:1;min-width:0}
.phone-account-title h3{font-size:14px;font-weight:650;line-height:1.4;overflow-wrap:anywhere}.phone-account-title p{font-size:11px;color:var(--muted);margin-top:4px;line-height:1.4}

.phone-open-account>span{min-width:0}.phone-open-account strong{font-size:23px;letter-spacing:-.5px;font-weight:700;display:block;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}.phone-open-account small{font-size:11px;color:var(--muted);display:block;margin-top:7px;line-height:1.5}.phone-open-account svg{width:19px;height:19px;color:var(--brand);margin-bottom:5px}
.phone-open-account .phone-open-label{display:flex;align-items:center;gap:3px;font-size:10px;color:var(--brand);white-space:nowrap;padding-bottom:5px}.phone-open-label svg{margin:0;width:16px;height:16px}

.phone-option-icon{width:34px;height:34px;flex-shrink:0;background:var(--soft);color:var(--brand);border-radius:10px;display:grid;place-items:center}.phone-option-icon svg{width:18px;height:18px}.phone-option-toggle>span:nth-child(2){flex:1;min-width:0}.phone-option-toggle strong{font-size:13px;font-weight:650;line-height:1.4}.phone-option-toggle small{display:block;font-size:11px;line-height:1.5;margin-top:4px;color:var(--muted)}

.phone-option-content{padding:0 15px 17px}.phone-form .money-input{border-radius:11px}.phone-form .money-input input{min-height:55px;font-size:23px}.phone-form .money-input span{font-size:14px}.phone-form .signs{margin:12px 0 22px;gap:10px}.phone-form .signs button{flex:1;min-height:44px;border-radius:10px;font-size:12px}
.phone-form .preview{padding:14px;border-radius:10px;margin-top:4px}.phone-form .preview .eyebrow{font-size:9px;letter-spacing:.5px}.phone-form .preview strong{font-size:12px}.phone-form .preview p{font-size:11px;line-height:1.6}

</style></head><body data-preview-interface="phone"><div id="prototype-root"></div>
<template id="phone-interface"><div id="app" class="phone-shell">
  <header class="phone-appbar"><span class="phone-brand"><span class="brand-mark">m</span>mukirana</span><span class="phone-demo">Proposta · dados de exemplo</span></header>
  <main class="phone-main">
    <div class="phone-title-row"><div><p class="phone-eyebrow">SEU DINHEIRO</p><h1>Contas</h1></div><span class="phone-count" id="list-count"></span></div>
    <section class="phone-summary" aria-label="Resumo das contas da lista">
      <p class="phone-summary-label">Saldo atual <span>24 out 2026</span></p><p id="total-current" class="phone-total"></p>
      <div class="phone-forecast"><div><span>Previsto até 31 out</span><strong id="total-forecast"></strong></div><svg viewBox="0 0 24 24"><path d="m5 15 5-5 4 4 5-8M15 6h4v4"/></svg></div>
      <p class="phone-summary-note" id="total-change"></p>
    </section>
    <label class="phone-search"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg><input id="search" type="search" placeholder="Buscar uma conta" aria-label="Buscar conta pelo nome ou proprietário"></label>
    <input id="status" type="hidden" value="active">
    <div class="phone-filters" role="group" aria-label="Filtrar contas por status"><button data-status="active" aria-pressed="true">Ativas</button><button data-status="all" aria-pressed="false">Todas</button><button data-status="inactive" aria-pressed="false">Inativas</button></div>
    <section id="account-list" class="phone-accounts" aria-label="Contas" aria-live="polite"></section>
    <p class="phone-list-note">Totais das contas da lista, incluindo compartilhadas. Só o dono altera o cadastro.</p>
  </main>
  <footer class="phone-create"><button id="new-account" class="btn primary"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Nova conta</button></footer>
</div>

<div class="overlay phone-page" id="editor-overlay" hidden>
  <section class="phone-editor" role="dialog" aria-modal="true" aria-labelledby="editor-title">
    <header class="phone-page-head"><button class="phone-back" type="button" data-close="editor" aria-label="Voltar para contas"><svg viewBox="0 0 24 24"><path d="m14 6-6 6 6 6"/></svg></button><div><h2 id="editor-title">Nova conta</h2><p id="editor-subtitle">O essencial primeiro.</p></div></header>
    <form id="account-form" class="phone-form">
      <div class="phone-form-scroll">
        <div class="field"><label for="account-name">Como você chama essa conta?</label><input id="account-name" class="input" required autocomplete="off" placeholder="Ex.: Carteira"></div>
        <section class="phone-option">
          <label class="phone-option-toggle"><span class="phone-option-icon"><svg viewBox="0 0 24 24"><path d="M5 20V4m0 1h13l-3 4 3 4H5"/></svg></span><span><strong>Saldo inicial</strong><small>O dinheiro que a conta já tinha.</small></span><input id="has-opening" type="checkbox"></label>
          <div id="opening-fields" class="phone-option-content" hidden>
            <div class="field"><label for="opening-amount">Quanto havia na conta?</label><div class="money-input"><span>R$</span><input id="opening-amount" inputmode="decimal" autocomplete="off" placeholder="0,00"></div></div>
            <div class="signs" role="group" aria-label="Sinal do saldo inicial"><button type="button" data-sign="1" aria-pressed="true">+ Positivo</button><button type="button" data-sign="-1" aria-pressed="false">− Negativo</button></div>
            <div class="field"><label for="opening-date">Em qual data?</label><div class="date-control"><input id="opening-date" class="input" type="date" value="2026-10-24"><span id="opening-date-display" class="date-display" aria-hidden="true"></span></div></div>
            <div class="preview" id="opening-preview" aria-live="polite"><div class="eyebrow">Lançamento que será criado</div><strong id="opening-description"></strong><p id="opening-preview-value"></p><p>Compõe o saldo. Fica fora das receitas e despesas.</p></div>
          </div>
        </section>
        <section class="phone-option">
          <label class="phone-option-toggle"><span class="phone-option-icon"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 20v-3a6 6 0 0 1 12 0v3M16 5a3 3 0 0 1 0 6m3 9v-3a6 6 0 0 0-2-4"/></svg></span><span><strong>Compartilhar conta</strong><small>Escolha quem também pode usar.</small></span><input id="shared" type="checkbox"></label>
          <div id="sharing-fields" class="phone-option-content" hidden><p class="help">Você continua responsável pelo cadastro.</p><label class="phone-person"><input type="checkbox" name="participant" value="Marina"><span class="phone-avatar">M</span>Marina</label><label class="phone-person"><input type="checkbox" name="participant" value="Alex"><span class="phone-avatar">A</span>Alex</label></div>
        </section>
        <p class="help" id="edit-note" hidden></p><p class="form-error" id="form-error" role="alert"></p>
      </div>
      <footer class="phone-save"><button id="save-account" class="btn primary" type="submit">Criar conta</button></footer>
    </form>
  </section>
</div>

<div class="overlay phone-page" id="ledger-overlay" hidden>
  <section class="phone-history" role="dialog" aria-modal="true" aria-labelledby="ledger-title">
    <header class="phone-page-head"><button class="phone-back" type="button" data-close="ledger" aria-label="Voltar para contas"><svg viewBox="0 0 24 24"><path d="m14 6-6 6 6 6"/></svg></button><div><h2 id="ledger-title"></h2><p id="ledger-subtitle"></p></div></header>
    <div class="phone-history-scroll"><section class="phone-history-total"><p>Saldo em 24 out 2026</p><strong id="ledger-balance"></strong></section><h3 class="phone-section-title">Lançamentos</h3><div id="ledger-events"></div><p class="help" id="ledger-notice"></p></div>
    <footer class="phone-save"><button class="btn" type="button" id="edit-from-ledger">Editar conta</button><button class="btn quiet" type="button" data-close="ledger">Voltar para contas</button></footer>
  </section>
</div>

<div class="overlay phone-sheet-overlay" id="actions-overlay" hidden>
  <section class="phone-actions-sheet" role="dialog" aria-modal="true" aria-labelledby="actions-title"><div class="phone-sheet-handle" aria-hidden="true"></div><h2 id="actions-title"></h2><p>Ações da conta</p><div id="phone-account-actions"></div><button class="phone-sheet-cancel" type="button" data-close="actions">Fechar</button></section>
</div>
<div class="toast" id="toast" role="status" hidden></div>
</template>
<script>
  (() => {
    'use strict';

    function chooseInterface() {
      const query = new URLSearchParams(location.search).get('interface');
      const forced = document.body.dataset.previewInterface || ({grande:'large',smartphone:'phone'}[query]);
      if (forced === 'large' || forced === 'phone') return forced;
      const ua = navigator.userAgent || '';
      if (navigator.userAgentData?.mobile || /iPhone|iPod|Android.+Mobile/i.test(ua)) return 'phone';
      if (/iPad|Tablet|Android/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)) return 'large';
      const touch = matchMedia('(pointer: coarse)').matches;
      const smallScreen = Math.min(screen.width || innerWidth, screen.height || innerHeight) < 768;
      return touch && smallScreen ? 'phone' : 'large';
    }
    const uiMode = chooseInterface();
    document.body.dataset.interface = uiMode;
    document.getElementById('prototype-root').append(
      document.getElementById(uiMode + '-interface').content.cloneNode(true)
    );

    const $ = id => document.getElementById(id);
    const money = cents => (cents / 100).toLocaleString('pt-BR', {style:'currency',currency:'BRL'});
    const escape = value => String(value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const dateText = date => date.split('-').reverse().join('/');
    const icon = kind => kind === 'cash' ? '<svg viewBox="0 0 24 24"><path d="M3 6h18v13H3zM3 10h18M15 14h3"/></svg>' : kind === 'shared' ? '<svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 20v-3a6 6 0 0 1 12 0v3M16 5a3 3 0 0 1 0 6m3 9v-3a6 6 0 0 0-2-4"/></svg>' : '<svg viewBox="0 0 24 24"><path d="m3 9 9-5 9 5M4 10h16M6 10v8m6-8v8m6-8v8M3 20h18"/></svg>';
    let accounts = [
      {id:'a1',name:'Principal',owner:'Você',active:true,shared:false,participants:[],icon:'bank',opening:{id:'opening-a1',amount:420000,date:'2026-10-01'},movements:[{name:'Recebimento',amount:160000,date:'2026-10-08'},{name:'Compras e pagamentos',amount:-114920,date:'2026-10-20'}],planned:-30000},
      {id:'a2',name:'Carteira',owner:'Você',active:true,shared:false,participants:[],icon:'cash',opening:{id:'opening-a2',amount:18000,date:'2026-10-01'},movements:[],planned:0},
      {id:'a3',name:'Casa',owner:'Marina',active:true,shared:true,participants:['Você'],icon:'shared',opening:{id:'opening-a3',amount:150000,date:'2026-10-01'},movements:[{name:'Compra para a casa',amount:-5000,date:'2026-10-20'}],planned:10000},
      {id:'a4',name:'Reserva',owner:'Você',active:false,shared:false,participants:[],icon:'bank',opening:{id:'opening-a4',amount:92000,date:'2026-10-01'},movements:[],planned:0}
    ];
    let editingId = null, ledgerId = null, sign = 1, nextId = 5, lastFocus = null, timer;
    const current = a => (a.opening && a.opening.date <= '2026-10-24' ? a.opening.amount : 0) + a.movements.filter(m => m.date <= '2026-10-24').reduce((s,m) => s + m.amount,0);
    const forecast = a => (a.opening && a.opening.date <= '2026-10-31' ? a.opening.amount : 0) + a.movements.filter(m => m.date <= '2026-10-31').reduce((s,m) => s + m.amount,0) + a.planned;
    function notice(message,undo) {
      clearTimeout(timer); $('toast').textContent=message;
      if(undo){const b=document.createElement('button');b.textContent='Desfazer';b.type='button';b.style.cssText='background:transparent;color:white;text-decoration:underline;margin-left:12px;min-height:36px;font-size:12px';b.addEventListener('click',undo);$('toast').append(b);}
      $('toast').hidden=false;timer=setTimeout(()=>$('toast').hidden=true,undo?6500:3600);
    }
    function render() {
      const query = $('search').value.trim().toLocaleLowerCase('pt-BR');
      const status = $('status').value;
      const list = accounts.filter(a => (status === 'all' || a.active === (status === 'active')) && (a.name+' '+a.owner).toLocaleLowerCase('pt-BR').includes(query)).sort((a,b)=>a.name.localeCompare(b.name,'pt-BR'));
      $('total-current').textContent = money(list.reduce((s,a)=>s+current(a),0));
      $('total-forecast').textContent = money(list.reduce((s,a)=>s+forecast(a),0));
      const delta = list.reduce((s,a)=>s+forecast(a)-current(a),0);
      $('total-change').textContent = delta === 0 ? 'Sem movimentação líquida prevista' : money(Math.abs(delta)) + (delta < 0 ? ' em saídas líquidas previstas' : ' em entradas líquidas previstas');
      $('list-count').textContent = list.length + (list.length === 1 ? ' conta' : ' contas') + (status === 'active' ? (list.length===1?' ativa':' ativas') : status === 'inactive' ? (list.length===1?' inativa':' inativas') : ' na lista');
      $('account-list').innerHTML = uiMode === 'phone' ? renderPhoneAccounts(list) : renderLargeAccounts(list);
      document.querySelectorAll('[data-status]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.status===status)));
    }

    function renderLargeAccounts(list) {
      return list.length ? list.map(a=>`<article class="account-row" aria-label="Conta ${escape(a.name)}"><div class="account-name"><div class="account-icon ${a.active ? a.icon : 'inactive'}">${icon(a.icon)}</div><div><div class="account-title"><span>${escape(a.name)}</span>${!a.active ? '<span class="tag" style="background:var(--canvas)">Inativa</span>' : ''}</div><p class="account-meta">${a.owner === 'Você' ? (a.shared ? 'Sua conta · compartilhada' : 'Sua conta · individual') : 'Compartilhada · '+escape(a.owner)}</p></div></div><div class="account-amount"><strong class="${current(a)<0?'negative':''}">${escape(money(current(a)))}</strong><small>Previsto ${escape(money(forecast(a)))}</small></div><div class="row-actions"><button class="btn quiet" data-action="ledger" data-id="${a.id}" aria-label="Ver lançamentos de ${escape(a.name)}">Ver lançamentos</button>${a.owner === 'Você' ? `<details class="more"><summary aria-label="Mais ações de ${escape(a.name)}">···</summary><div class="menu"><button data-action="edit" data-id="${a.id}">Editar conta</button><button data-action="status" data-id="${a.id}" class="${a.active?'danger':''}">${a.active?'Inativar conta':'Restaurar conta'}</button></div></details>` : '<span class="tag" style="color:var(--muted);background:var(--canvas)">Consulta</span>'}</div></article>`).join('') : '<div class="empty"><h3>Nenhuma conta encontrada</h3><p>Experimente outro nome ou altere o filtro.</p><button class="btn" data-action="clear">Limpar busca e filtros</button></div>';
    }
    function renderPhoneAccounts(list) {
      if (!list.length) return '<div class="empty"><h3>Nenhuma conta por aqui</h3><p>Mude a busca ou o filtro para encontrar suas contas.</p><button class="btn" data-action="clear">Limpar filtros</button></div>';
      return list.map(a=>`<article class="phone-account" aria-label="Conta ${escape(a.name)}">
        <header class="phone-account-header"><span class="account-icon ${a.active?a.icon:'inactive'}">${icon(a.icon)}</span><div class="phone-account-title"><h3>${escape(a.name)}${!a.active?' <span class="tag">Inativa</span>':''}</h3><p>${a.owner==='Você'?(a.shared?'Sua conta · compartilhada':'Sua conta · individual'):'Compartilhada · '+escape(a.owner)}</p></div>${a.owner==='Você'?`<button class="phone-more" data-action="phone-actions" data-id="${a.id}" aria-label="Ações de ${escape(a.name)}">···</button>`:'<span class="tag" style="background:var(--canvas);color:var(--muted)">Consulta</span>'}</header>
        <button class="phone-open-account" data-action="ledger" data-id="${a.id}" aria-label="Ver lançamentos de ${escape(a.name)}"><span><strong class="${current(a)<0?'negative':''}">${escape(money(current(a)))}</strong><small>Previsto ${escape(money(forecast(a)))}</small></span><span class="phone-open-label">Lançamentos <svg viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></svg></span></button>
      </article>`).join('');
    }
    function openPhoneActions(id) {
      const a=accounts.find(a=>a.id===id);if(!a)return;
      $('actions-title').textContent=a.name;
      $('phone-account-actions').innerHTML=`<button data-action="ledger" data-id="${a.id}">Ver lançamentos</button>${a.owner==='Você'?`<button data-action="edit" data-id="${a.id}">Editar conta</button><button data-action="status" data-id="${a.id}" class="${a.active?'danger':''}">${a.active?'Inativar conta':'Restaurar conta'}</button>`:''}`;
      openOverlay('actions');$('phone-account-actions').querySelector('button').focus();
    }

    function openOverlay(name) {
      document.querySelectorAll('details.more[open]').forEach(d=>d.open=false);
      lastFocus = document.activeElement;
      $('app').inert = true; document.body.style.overflow = 'hidden'; $(name+'-overlay').hidden = false;
    }
    function closeOverlay(name) {
      $(name+'-overlay').hidden = true; $('app').inert = false; document.body.style.overflow = '';
      if (lastFocus && lastFocus.isConnected) lastFocus.focus(); else $('new-account').focus();
    }
    function selectSign(value) { sign=value; document.querySelectorAll('[data-sign]').forEach(b=>b.setAttribute('aria-pressed',String(Number(b.dataset.sign)===sign))); updatePreview(); }
    function parseAmount() {
      const raw=$('opening-amount').value.trim().replace(/\s/g,'').replace(/\./g,'').replace(',','.');
      if (!raw) return 0;
      if (!/^\d+(\.\d{1,2})?$/.test(raw)) return NaN;
      return Math.round(Number(raw)*100)*sign;
    }
    function updatePreview() {
      $('opening-fields').hidden=!$('has-opening').checked; $('sharing-fields').hidden=!$('shared').checked;
      $('opening-description').textContent='Saldo Inicial da Conta '+($('account-name').value.trim()||'[nome da conta]');
      const amount=parseAmount(); const date=$('opening-date').value;
      $('opening-date-display').textContent=date ? dateText(date) : 'dd/mm/aaaa';
      $('opening-preview-value').textContent=Number.isNaN(amount) ? 'Informe um valor válido.' : amount === 0 ? 'Sem valor inicial: nenhum lançamento será criado.' : money(amount)+' · '+(date ? dateText(date) : 'Escolha a data do saldo');
      $('opening-preview').querySelector('.eyebrow').textContent = editingId ? 'Lançamento de saldo inicial' : 'Lançamento que será criado';
      if(editingId) $('edit-note').textContent = !$('has-opening').checked || amount===0 ? 'Ao salvar, o saldo inicial será removido. A conta e os demais lançamentos serão preservados.' : 'Ao salvar, o lançamento de saldo inicial será atualizado. Os demais lançamentos serão preservados.';
    }
    function openEditor(id) {
      const a=accounts.find(a=>a.id===id); if(a && a.owner!=='Você') return;
      editingId=a ? a.id : null; $('account-form').reset(); $('form-error').textContent='';
      $('editor-title').textContent=a ? 'Editar conta' : 'Nova conta'; $('editor-subtitle').textContent=a ? 'Cadastro e saldo inicial, em um só lugar.' : 'Comece pelo nome. O restante é opcional.';
      $('save-account').textContent=a ? 'Salvar alterações' : 'Criar conta'; $('edit-note').hidden=!a;
      $('account-name').value=a ? a.name : ''; $('has-opening').checked=Boolean(a?.opening); $('opening-amount').value=a?.opening ? (Math.abs(a.opening.amount)/100).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}) : ''; $('opening-date').value=a?.opening?.date||'2026-10-24'; $('shared').checked=Boolean(a?.shared);
      document.querySelectorAll('[name=participant]').forEach(c=>c.checked=Boolean(a?.participants.includes(c.value)));
      selectSign(a?.opening?.amount<0 ? -1 : 1); openOverlay('editor'); setTimeout(()=>$('account-name').focus(),30);
    }
    function openLedger(id) {
      const a=accounts.find(a=>a.id===id); if(!a) return; ledgerId=id;
      $('ledger-title').textContent=a.name; $('ledger-subtitle').textContent='Histórico da conta'; $('ledger-balance').textContent=money(current(a));
      const rows=[...(a.opening ? [{name:'Saldo Inicial da Conta '+a.name,amount:a.opening.amount,date:a.opening.date,special:true}] : []),...a.movements].sort((a,b)=>a.date.localeCompare(b.date));
      $('ledger-events').innerHTML=rows.length ? rows.map(e=>`<article class="ledger-row"><span class="ledger-marker ${e.special?'special':''}">${e.special ? '<svg viewBox="0 0 24 24"><path d="M5 20V4m0 1h13l-3 4 3 4H5"/></svg>' : '<svg viewBox="0 0 24 24"><path d="M5 12h14m-5-5 5 5-5 5"/></svg>'}</span><div class="ledger-desc"><strong>${escape(e.name)}</strong><small>${escape(dateText(e.date))}</small>${e.special?'<span class="pill">Saldo inicial</span><small>Fora das receitas e despesas</small>':''}</div><strong class="${e.amount<0?'negative':''}">${e.amount>0?'+ ':''}${escape(money(e.amount))}</strong></article>`).join('') : '<p class="help" style="margin-top:20px">Esta conta ainda não tem lançamentos.</p>';
      $('edit-from-ledger').hidden=a.owner!=='Você'; $('ledger-notice').textContent=a.owner==='Você' ? 'Para corrigir o valor ou a data do saldo inicial, use Editar conta.' : 'Conta compartilhada por '+a.owner+'. O cadastro e o saldo inicial são gerenciados por ela.';
      openOverlay('ledger'); setTimeout(()=>$('ledger-overlay').querySelector('[data-close]').focus(),30);
    }
    $('new-account').addEventListener('click',()=>openEditor()); $('search').addEventListener('input',render); $('status').addEventListener('change',render);
    ['account-name','opening-amount','opening-date','has-opening','shared'].forEach(id=>$(id).addEventListener('input',updatePreview));
    document.querySelectorAll('[data-sign]').forEach(b=>b.addEventListener('click',()=>selectSign(Number(b.dataset.sign))));
    document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',()=>closeOverlay(b.dataset.close)));
    document.querySelectorAll('.overlay').forEach(o=>o.addEventListener('click',e=>{if(e.target===o)closeOverlay(o.id.split('-')[0]);}));
    $('edit-from-ledger').addEventListener('click',()=>{closeOverlay('ledger');openEditor(ledgerId);});

    function handleAccountAction(e) {
      const target=e.target.closest('[data-action]');if(!target)return;
      const a=accounts.find(a=>a.id===target.dataset.id);
      if(target.dataset.action==='phone-actions'){openPhoneActions(a.id);return;}
      if(uiMode==='phone'&&!$('actions-overlay').hidden)closeOverlay('actions');
      if(target.dataset.action==='ledger')openLedger(a.id);
      if(target.dataset.action==='edit')openEditor(a.id);
      if(target.dataset.action==='status'&&a?.owner==='Você'){const before=a.active;a.active=!a.active;render();notice(a.active?'Conta restaurada.':'Conta inativada. O histórico foi preservado.',()=>{a.active=before;render();notice('Alteração desfeita.');});}
      if(target.dataset.action==='clear'){$('search').value='';$('status').value='active';render();}
    }
    $('account-list').addEventListener('click',handleAccountAction);
    if(uiMode==='phone'){
      $('phone-account-actions').addEventListener('click',handleAccountAction);
      document.querySelectorAll('[data-status]').forEach(b=>b.addEventListener('click',()=>{$('status').value=b.dataset.status;render();}));
    }
    $('account-form').addEventListener('submit',e=>{
      e.preventDefault(); const name=$('account-name').value.trim(); const amount=$('has-opening').checked ? parseAmount() : 0;
      if(!name){$('form-error').textContent='Informe o nome da conta.';return;}
      if(accounts.some(a=>a.id!==editingId&&a.name.toLocaleLowerCase('pt-BR')===name.toLocaleLowerCase('pt-BR'))){$('form-error').textContent='Já existe uma conta com esse nome na sua lista.';return;}
      if(!Number.isSafeInteger(amount)||Math.abs(amount)>99999999999999){$('form-error').textContent='Informe um valor válido, com até duas casas decimais.';return;}
      if(amount!==0&&!$('opening-date').value){$('form-error').textContent='Informe a data do saldo inicial.';return;}
      const participants=$('shared').checked ? Array.from(document.querySelectorAll('[name=participant]:checked')).map(c=>c.value) : [];
      if($('shared').checked&&!participants.length){$('form-error').textContent='Escolha ao menos uma pessoa para compartilhar.';return;}
      let a=accounts.find(a=>a.id===editingId);const isNew=!a;
      if(!a){a={id:'a'+nextId++,owner:'Você',active:true,icon:'bank',movements:[],planned:0};accounts.push(a);}
      a.name=name;a.shared=$('shared').checked;a.participants=participants;a.icon=a.shared?'shared':a.icon==='cash'?'cash':'bank';
      a.opening=amount!==0 ? {id:a.opening?.id||'opening-'+a.id,amount,date:$('opening-date').value} : null;
      closeOverlay('editor');if(isNew){$('search').value='';$('status').value='active';}render();notice(isNew?'Conta criada.':'Conta atualizada.');
    });
    document.addEventListener('click',e=>document.querySelectorAll('details.more[open]').forEach(d=>{if(!d.contains(e.target))d.open=false;}));
    document.addEventListener('keydown',e=>{
      const overlay=Array.from(document.querySelectorAll('.overlay')).find(o=>!o.hidden);
      if(e.key==='Escape'){if(overlay){e.preventDefault();closeOverlay(overlay.id.split('-')[0]);}else document.querySelectorAll('details.more[open]').forEach(d=>d.open=false);}
      if(e.key==='Tab'&&overlay){const f=Array.from(overlay.querySelectorAll('button:not([disabled]),input:not([disabled]),select,[tabindex="0"]')).filter(el=>el.getClientRects().length);const first=f[0],last=f[f.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}
    });
    render(); updatePreview();
  })();
  </script>
</body></html>
