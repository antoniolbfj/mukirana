{color:#687287;font-size:13px;line-height:1.7;margin:12px 0}.dialog button{background:#5146d9;color:white;border:0;border-radius:9px;padding:12px 20px;min-height:44px}.phone-main{max-width:560px;margin:auto;padding:20px 16px}.phone-head{margin-bottom:16px}.phone-head h1{font-size:25px}.phone-head p{font-size:12px;color:#687287;margin-top:5px}.phone-main .months{gap:7px}.phone-main .month{padding:12px 9px;border-radius:12px;min-height:83px}.phone-main .month[aria-pressed=true]{padding:11px 8px}.phone-main .month strong{font-size:16px;letter-spacing:-.5px;margin-top:9px}.phone-main .composition{gap:7px;font-size:11px}.phone-main .composition button{margin-left:0}.phone-main .switch{margin:12px 0 16px;min-height:32px}.phone-main .positions{grid-template-columns:1fr;gap:9px;margin:0 0 17px}.phone-main .position{display:grid;grid-template-columns:1fr auto;gap:4px;padding:13px 15px;align-items:center}.phone-main .position strong{font-size:20px;margin:0}.phone-main .position small{grid-column:1 / -1}.phone-main .analyses{display:block}.phone-main .box{margin-bottom:13px;padding:17px}.phone-main .pending{flex-wrap:wrap}.phone-main .pending button{margin-left:0}.phone-main .foot{font-size:10px}.phone-main .fixed{line-height:1.6}@media(max-width:900px){.topbar{flex-wrap:wrap;gap:10px;padding:12px 16px}.global-balance{margin-left:auto;padding-left:10px}.global-balance strong{font-size:23px}.period{order:3;flex-basis:100%;margin:0;justify-content:space-between}.period input{width:155px}.intro{align-items:start}.main{padding:22px}.positions strong{font-size:20px}}@media(max-width:600px){.brand{font-size:17px}.global-balance small{font-size:9px}.demo{font-size:10px;padding:7px 12px}.topbar{gap:8px}.global-balance strong{font-size:22px}.period{font-size:11px}.global-balance{border-left:0}}</style></head><body>
<div class="demo">PROPOSTA VISUAL · Dados fictícios de outubro/2026 · Cálculos do exemplo, sem conexão ao banco</div>
<header class="topbar"><span class="brand">Mukirana</span><div class="period"><label for="month">Período global</label><input id="month" type="month" value="2026-10"></div><button class="global-balance" data-info="balance" aria-label="Ver composição de Ainda posso gastar"><small>Ainda posso gastar</small><strong id="result"></strong><small id="scope"></small></button></header>
<main id="mount"></main>
<template id="desktop"><div class="main"><div class="intro"><div><h1>Painel geral</h1><p>O essencial para decidir o próximo passo.</p></div><label class="switch"><input class="include-invest" type="checkbox">Incluir investimentos no resultado</label></div><div class="months"></div><div class="composition"></div><div class="positions"></div><div class="analyses"><section class="box"><h2>Para onde foi?</h2><p>Despesas por categoria no período</p><div class="categories"></div></section><section class="box"><h2>Como estão minhas metas?</h2><p>Limites de despesas e objetivos de receitas</p><div class="goals"></div><p class="fixed"></p></section></div><div class="pending"><span>2 participações aguardam sua decisão</span><button data-info="pending">Revisar participações →</button></div><p class="foot">Posições atuais: movimentos efetivados até 24/10/2026. Resultado: movimentos do mês selecionado, incluindo previstos. Clique em um valor para ver sua composição.</p></div></template>
<template id="phone"><div class="phone-main"><div class="phone-head"><h1>Seu painel</h1><p>O que importa neste mês.</p></div><div class="months"></div><div class="composition"></div><label class="switch"><input class="include-invest" type="checkbox">Incluir investimentos no resultado</label><div class="positions"></div><div class="analyses"><section class="box"><h2>Para onde foi?</h2><p>Despesas do período, por categoria</p><div class="categories"></div></section><section class="box"><h2>E as minhas metas?</h2><div class="goals"></div><p class="fixed"></p></section></div><div class="pending"><span>2 participações para revisar</span><button data-info="pending">Ver pendências →</button></div><p class="foot">Posições efetivadas até 24/10. Resultado do mês inclui previstos. Esta prévia usa somente dados fictícios.</p></div></template>
<div class="dialog-wrap" id="dialog-wrap" hidden><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><h2 id="dialog-title"></h2><div id="dialog-content"></div><button id="dialog-close">Fechar</button></section></div>
<script>/** Regras puras compartilhadas entre Apps Script e navegador via Function.toString(). */
function lancamentosNovoRegras_() {
  'use strict';
  const dimensions = ['type','account','category','project','mode','status'];
  function add(a,b) {
    a=String(a);b=String(b);let negative=a[0]==='-',same=negative===(b[0]==='-');
    let x=negative?a.slice(1):a,y=b[0]==='-'?b.slice(1):b,out='',carry=0;
    if(!same&&(x.length<y.length||(x.length===y.length&&x<y))){let t=x;x=y;y=t;negative=!negative;}
    for(let i=x.length-1,j=y.length-1;i>=0||j>=0;i--,j--){let n=Number(x[i]||0)+(same?Number(y[j]||0):-Number(y[j]||0))+carry;if(same){carry=n>=10?1:0;n%=10;}else{carry=n<0?-1:0;if(n<0)n+=10;}out=n+out;}
    if(same&&carry)out=carry+out;out=out.replace(/^0+(?=\d)/,'');return(negative&&out!=='0'?'-':'')+out;
  }
  function negate(value){value=String(value);return value==='0'?'0':value[0]==='-'?value.slice(1):'-'+value;}
  function cents(value){return typeof value==='string'&&/^-?(0|[1-9]\d*)$/.test(value)&&value.length<=32;}
  function money(value){if(!cents(String(value)))return '—';const negative=String(value)[0]==='-';let s=negative?String(value).slice(1):String(value);s=s.padStart(3,'0');return(negative?'− ':'')+'R$ '+s.slice(0,-2).replace(/\B(?=(\d{3})+(?!\d))/g,'.')+','+s.slice(-2);}
  function clean(input){const f={};for(const key of dimensions)f[key]=String(input&&input[key]||'');f.search=String(input&&input.search||'').trim().toLocaleLowerCase('pt-BR');return f;}
  function matches(row,f,except){
    for(const key of dimensions)if(key!==except&&f[key]&&String(row[key]||'')!==f[key]&&!(key==='category'&&(row.categoryPath||[]).indexOf(f[key])>=0))return false;
    if(f.search&&String(row.searchText||row.description||'').toLocaleLowerCase('pt-BR').indexOf(f.search)<0)return false;
    return true;
  }
  function facets(rows,input){const f=clean(input),result={};for(const key of dimensions){const values={};for(const row of rows)if(matches(row,f,key)){const value=String(row[key]||'');if(value)values[value]=true;if(key==='category')for(const parent of row.categoryPath||[])if(parent)values[parent]=true;}result[key]=Object.keys(values);}return result;}
  function valid(rows,input){const f=clean(input);if(!dimensions.some(k=>f[k]))return true;return rows.some(row=>matches(row,f));}
  function normalize(rows,input,changed){const f=clean(input),cleared=[];if(valid(rows,f))return {filters:f,cleared:cleared};
    const order=dimensions.filter(k=>k!==changed).concat(changed&&dimensions.indexOf(changed)>=0?[changed]:[]);
    for(const key of order){if(f[key]){f[key]='';cleared.push(key);if(valid(rows,f))break;}}
    return {filters:f,cleared:cleared};
  }
  function summarize(rows){let income='0',expense='0',incoming='0',outgoing='0',opening='0';
    for(const row of rows){const value=String(row.signedCents);if(!cents(value))throw Error('Valor inválido.');if(row.special==='opening')opening=add(opening,value);
      if(row.type==='income')income=add(income,value);
      else if(row.type==='expense')expense=add(expense,negate(value));
      else if(row.type==='transfer'){if(value[0]==='-')outgoing=add(outgoing,negate(value));else incoming=add(incoming,value);}
      else if(row.type==='opening')opening=add(opening,value);
    }
    const transfers=add(incoming,negate(outgoing));
    return {incomeCents:income,expenseCents:expense,transferInCents:incoming,transferOutCents:outgoing,transferCents:transfers,openingCents:opening,resultCents:add(add(income,negate(expense)),transfers),count:rows.length};
  }
  function query(rows,input){const f=clean(input),filtered=rows.filter(r=>matches(r,f));return {rows:filtered,filters:f,options:facets(rows,f),summary:summarize(filtered)};}
  return {dimensions:dimensions,add:add,negate:negate,cents:cents,money:money,clean:clean,matches:matches,facets:facets,valid:valid,normalize:normalize,summarize:summarize,query:query};
}

const C=lancamentosNovoRegras_(),accounts={bank:{name:'Conta do dia a dia',type:'Consumo'},card:{name:'Cartão principal',type:'Cartão de Crédito'},invest:{name:'Reserva',type:'Investimento'}},today='2026-10-24';
const entries=[{id:'opening-invest',type:'income',amount:2000000,account:'invest',date:'2026-07-01',description:'Saldo inicial da reserva',classification:'variable'}, {id:'opening-bank',type:'income',amount:200000,account:'bank',date:'2026-08-01',description:'Saldo inicial da conta',classification:'variable'}];
for(const [month,income,rent,food,transport,card,contribution,returns,payment] of [['2026-09',950000,220000,80000,30000,100000,100000,7000,80000],['2026-10',1000000,200000,50000,0,150000,150000,10000,100000],['2026-11',1000000,230000,65000,35000,170000,160000,12000,160000]]){
 const add=(suffix,type,amount,account,day,category,classification='variable')=>entries.push({id:month+suffix,type,amount,account,date:month+'-'+day,category,classification,description:category||suffix});
 add('income','income',income,'bank','05','Salário','fixed');add('rent','expense',rent,'bank','08','Moradia','fixed');if(food)add('food','expense',food,'bank','10','Alimentação');if(transport)add('transport','expense',transport,'bank','12','Transporte');add('card','expense',card,'card','15','Compras');add('return','income',returns,'invest','21','Rendimentos');entries.push({id:month+'pay',type:'transfer',amount:payment,account:'bank',destination:'card',date:month+'-18',description:'Pagamento da fatura'},{id:month+'contribution',type:'transfer',amount:contribution,account:'bank',destination:'invest',date:month+'-20',description:'Aporte'});
}
const legs=entries.flatMap(e=>e.type==='transfer'?[{...e,key:e.id+'out',entryId:e.id,signedCents:String(-e.amount)},{...e,key:e.id+'in',entryId:e.id,account:e.destination,signedCents:String(e.amount)}]:[{...e,key:e.id,entryId:e.id,signedCents:String(e.type==='expense'?-e.amount:e.amount)}]);
let selected='2026-10',include=false,lastFocus=null;const $=id=>document.getElementById(id),all=s=>[...document.querySelectorAll(s)],esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const ua=navigator.userAgent,tablet=/iPad|Tablet|Android(?!.*Mobile)/i.test(ua),phone=!tablet&&(/iPhone|Android.+Mobile/i.test(ua)||Math.min(innerWidth,innerHeight)<600);document.body.dataset.interface=phone?'phone':'desktop';$('mount').append($(phone?'phone':'desktop').content.cloneNode(true));
function relevant(month){return legs.filter(e=>e.date.startsWith(month)&&(include||accounts[e.account].type!=='Investimento'));}function summary(month){return C.summarize(relevant(month));}function current(type){return legs.filter(e=>accounts[e.account].type===type&&e.date<=today).reduce((n,e)=>C.add(n,e.signedCents),'0');}function movement(){return legs.filter(e=>accounts[e.account].type==='Investimento'&&e.date.startsWith(selected)).reduce((n,e)=>C.add(n,e.signedCents),'0');}function m(value){return C.money(String(value));}
function draw(){const s=summary(selected);const sharedExpense=entries.find(e=>e.id==='2026-10card'),receivable=String(Math.floor(sharedExpense.amount/3)*2);all('.pending>span').forEach(n=>n.innerHTML='<strong>A acertar</strong> · A receber '+m(receivable)+' · 2 aprovações pendentes');all('.pending>button').forEach(n=>n.textContent='Ver rateios →');$('result').textContent=m(s.resultCents);$('result').className=s.resultCents.startsWith('-')?'negative':'';$('scope').textContent='Resultado do período · '+(include?'Todas as contas':'Consumo e Crédito');all('.months').forEach(host=>host.innerHTML=['2026-09','2026-10','2026-11'].map((month,i)=>{const s=summary(month),name=['Setembro','Outubro','Novembro'][i];return `<button class="month" data-month="${month}" aria-pressed="${month===selected}"><span class="month-label">${phone?name.slice(0,3):name+' 2026'}${i===1?' · atual':''}</span><strong class="${s.resultCents.startsWith('-')?'negative':''}">${m(s.resultCents)}</strong>${phone?'':`<span>Entrou ${m(s.incomeCents)} · Saiu ${m(s.expenseCents)}</span>`}</button>`;}).join(''));
 all('.composition').forEach(host=>host.innerHTML=`<span>Receitas <strong>${m(s.incomeCents)}</strong></span><span>Despesas <strong>${m(s.expenseCents)}</strong></span><span>Transferências <strong>${m(s.transferCents)}</strong></span><button data-info="balance">Ver composição</button>`);
 all('.positions').forEach(host=>host.innerHTML=[['Disponível em Consumo',current('Consumo'),'Saldo efetivado hoje · Ver contas','cash'],['Saldo dos cartões',current('Cartão de Crédito'),'Negativo: valor devido · Ver cartões','credit'],['Patrimônio em Investimento',current('Investimento'),m(movement())+' de movimento no período','invest']].map(([label,value,caption,id])=>`<button class="position" data-info="${id}" style="text-align:left"><span>${label}</span><strong class="${String(value).startsWith('-')?'negative':''}">${m(value)}</strong><small>${caption}</small></button>`).join(''));
 const expenses=relevant(selected).filter(e=>e.type==='expense'),cats={};expenses.forEach(e=>cats[e.category]=(cats[e.category]||0)+e.amount);const sorted=Object.entries(cats).sort((a,b)=>b[1]-a[1]),shown=sorted.slice(0,3);if(sorted.length>3)shown.push(['Outras',sorted.slice(3).reduce((n,x)=>n+x[1],0)]);const total=expenses.reduce((n,e)=>n+e.amount,0);
 all('.categories').forEach(host=>host.innerHTML=shown.length?shown.map(([name,amount])=>`<button class="category" data-category="${esc(name)}"><span class="row"><span>${esc(name)}</span><strong>${m(amount)}</strong></span><span class="bar"><i style="width:${total?amount/total*100:0}%"></i></span></button>`).join(''):'<p class="muted">Sem despesas no exemplo deste mês.</p>');
 const goals=[['Moradia','expense',250000],['Alimentação','expense',70000],['Salário','income',1000000]];all('.goals').forEach(host=>host.innerHTML=goals.map(([name,type,target])=>{const value=relevant(selected).filter(e=>e.type===type&&e.category===name).reduce((n,e)=>n+e.amount,0),difference=value-target,bad=type==='expense'?difference>0:difference<0;return `<div class="goal ${bad?'bad':''}"><div class="row"><span>${name}</span><strong>${m(value)} <small>/ ${m(target)}</small></strong></div><small>${type==='expense'?(difference>0?'Acima do teto em ':'Disponível da meta: '):(difference<0?'Faltam para o objetivo: ':'Objetivo atingido · excedente ')}${m(Math.abs(difference))}</small></div>`;}).join(''));
 const fi=relevant(selected).filter(e=>e.type==='income'&&e.classification==='fixed').reduce((n,e)=>n+e.amount,0),fe=relevant(selected).filter(e=>e.type==='expense'&&e.classification==='fixed').reduce((n,e)=>n+e.amount,0);all('.fixed').forEach(n=>n.textContent=fi?(fe/fi*100).toLocaleString('pt-BR',{maximumFractionDigits:1})+'% da renda fixa comprometida por despesas fixas.':'Sem renda fixa registrada.');
}
function dialog(title,content){lastFocus=document.activeElement;$('dialog-title').textContent=title;$('dialog-content').innerHTML=content;$('dialog-wrap').hidden=false;$('dialog-close').focus();}function close(){$('dialog-wrap').hidden=true;lastFocus?.focus();}
function info(kind){const s=summary(selected),content=kind==='balance'?`<p>Receitas − despesas + transferências recebidas − transferências enviadas.</p>${[['Receitas',s.incomeCents],['Despesas',C.negate(s.expenseCents)],['Entradas de transferência',s.transferInCents],['Saídas de transferência',C.negate(s.transferOutCents)],['Resultado',s.resultCents]].map(([n,v])=>`<p class="row"><span>${n}</span><strong>${m(v)}</strong></p>`).join('')}<p>O pagamento da fatura não vira nova despesa. O aporte reduz o operacional quando Investimento está fora do recorte.</p>`:kind==='cash'?'<p>Acumulado de movimentos efetivados nas contas de Consumo até hoje. É diferente do resultado restrito ao mês.</p>':kind==='credit'?'<p>Compras reduzem o saldo de Crédito. Pagamentos o aumentam e reduzem Consumo, sem criar nova despesa. O limite do cartão não é dinheiro disponível.</p>':kind==='invest'?'<p>Patrimônio: saldo acumulado efetivado das contas de Investimento. Movimento do período: aportes − resgates + rendimentos e demais registros. Uma transferência entre investimentos se anula.</p>':'<p>Exemplo: a compra de R$ 1.500 no cartão, em outubro, foi dividida em três partes de R$ 500. Você pagou o total e tem R$ 1.000 a receber das outras duas pessoas.</p><p>Esses R$ 1.000 não aumentam Ainda posso gastar antes dos acertos. Cada usuário registra sua própria despesa ou receita especial de Acerto de rateio. As pontas se vinculam à mesma operação para abater a dívida uma única vez. As aprovações deste exemplo são dos outros participantes.</p><p>A dívida é acumulada e não desaparece ao mudar o período. No sistema conectado, o detalhe mostrará as pessoas, as suas pendências e o extrato autorizado; esta prévia não registra decisões.</p>';dialog(kind==='balance'?'Composição do resultado':kind==='invest'?'Investimentos':kind==='credit'?'Crédito':kind==='cash'?'Disponível hoje':'Pendências',content);}
$('month').addEventListener('change',e=>{if(!/^\d{4}-(0[1-9]|1[0-2])$/.test(e.target.value))return;selected=e.target.value;draw();});all('.include-invest').forEach(el=>el.addEventListener('change',()=>{include=el.checked;draw();}));document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.month){selected=b.dataset.month;$('month').value=selected;draw();}if(b.dataset.info)info(b.dataset.info);if(b.dataset.category)dialog(b.dataset.category,'<p>Na implementação, abre Lançamentos com o mesmo período e a categoria selecionada. Nenhum filtro sem registros será oferecido.</p>');});$('dialog-close').onclick=close;$('dialog-wrap').onclick=e=>{if(e.target===$('dialog-wrap'))close();};document.addEventListener('keydown',e=>{if($('dialog-wrap').hidden)return;if(e.key==='Escape')close();if(e.key==='Tab'){e.preventDefault();$('dialog-close').focus();}});draw();window.demoSummary=()=>summary(selected);
</script></body></html>
