<script>
(()=>{
 'use strict';
 if(window.MukiranaCartoesNovo)window.MukiranaCartoesNovo.destroy();
 const root=document.getElementById('ct-root');if(!root)return;
 const ua=navigator.userAgent||'',handset=/iPhone|iPod|Android.+Mobile/i.test(ua),tablet=!handset&&(/iPad|Tablet|Android(?!.*Mobile)/i.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1));
 const phone=handset||!tablet&&(navigator.userAgentData?.mobile||/iPhone|iPod|Android.+Mobile/i.test(ua)||(matchMedia('(pointer:coarse)').matches&&Math.min(screen.width||innerWidth,screen.height||innerHeight)<768));
 root.classList.toggle('phone',phone);root.dataset.interface=phone?'phone':'large';
 root.querySelector('#ct-mount').append(root.querySelector(phone?'#ct-phone-template':'#ct-large-template').content.cloneNode(true));
 document.body.classList.toggle('cartoes-novo-smartphone',phone);
 const $=id=>root.querySelector('#ct-'+id),all=q=>Array.from(root.querySelectorAll(q)),events=new AbortController(),token=localStorage.getItem('mukirana_token')||'';
 const esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const uuid=()=>crypto.randomUUID?crypto.randomUUID():'10000000-1000-4000-8000-100000000000'.replace(/[018]/g,c=>(Number(c)^crypto.getRandomValues(new Uint8Array(1))[0]&15>>Number(c)/4).toString(16));
 const cents=v=>BigInt(v||'0');
 function money(v){let n=cents(v),abs=n<0n?-n:n;return(n<0n?'− ':'')+'R$ '+(abs/100n).toLocaleString('pt-BR')+','+(abs%100n).toString().padStart(2,'0');}
 const month=v=>v?new Date(v+'-01T12:00:00Z').toLocaleDateString('pt-BR',{month:'short',year:'numeric',timeZone:'UTC'}).replace('.',''):'Todo o histórico';
 const icon='<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M3 10h18M6 15h4"/></svg>';
 const filters=()=>typeof obterFiltroPeriodoGlobalMukirana==='function'?obterFiltroPeriodoGlobalMukirana():{};
 let alive=true,groups=[],info=null,epoch=0,forecast='loading',projections={},overlay=null,lastFocus=null,oldOverflow='',draft=null,busy=false;
 let people=[],usersEpoch=0,editorEpoch=0,detailEpoch=0,current=null,userTimer=null,toastTimer=null,detailsCache=null;
 const statusOps=new Map();
 function on(target,type,fn){target.addEventListener(type,fn,{signal:events.signal});}
 function rpc(name,...args){return new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[name](token,...args));}
 const errorText=e=>e&&e.message?String(e.message):'Não foi possível concluir. Tente novamente.';
 const effective=g=>g.active&&g.role!=='history';
 const roleText=g=>g.role==='owner'?'Sou titular':g.role==='additional'?'Sou adicional · '+g.ownerName:'Histórico · '+g.ownerName;
 function notice(message,undo){clearTimeout(toastTimer);$('toast').textContent=message;if(undo){let b=document.createElement('button');b.type='button';b.textContent='Desfazer';on(b,'click',undo);$('toast').append(b)}$('toast').hidden=false;toastTimer=setTimeout(()=>{if(alive)$('toast').hidden=true},undo?8000:5000);}
 function filtered(){let q=$('search').value.trim().toLocaleLowerCase('pt-BR'),s=$('status').value,r=$('role').value;return groups.filter(g=>(s==='all'||effective(g)===(s==='active'))&&(r==='all'||(r==='owner'?g.canEdit:!g.canEdit))&&(g.name+' '+g.ownerName).toLocaleLowerCase('pt-BR').includes(q)).sort((a,b)=>a.name.localeCompare(b.name,'pt-BR'));}
 function future(g){if(!effective(g))return'Sem novas previsões';if(!info.period.start)return'Selecione um período para prever';return forecast==='ready'?(cents(projections[g.id])===0n?'Sem previsão adicional':money(projections[g.id])+' previstos'):forecast==='loading'?'Calculando previsão…':'Previsão indisponível';}
 function badge(g){return g.role==='history'?'<span class="pill">Histórico</span>':g.active?'':'<span class="pill">Inativo</span>';}
 function metric(g){return g.canEdit?g.openCents:g.registeredCents;}
 function relatedLabel(g){return g.canEdit?g.cardsCount+(g.cardsCount===1?' cartão vinculado':' cartões vinculados'):'Seus cartões';}
 function actions(g){return`<button data-action="cards" data-id="${g.id}">Cartões vinculados</button>${g.canEdit?`<button data-action="edit" data-id="${g.id}">Editar cadastro</button><button class="${g.active?'danger':''}" data-action="status" data-id="${g.id}">${g.active?'Inativar':'Restaurar'}</button>`:''}`;}
 function wideRows(list){return list.map(g=>{
  const bar=g.canEdit&&!info.period.multi&&cents(g.limitCents)>0n?Math.min(100,Number(cents(g.openCents)*1000n/cents(g.limitCents))/10):null;
  return`<article class="wide-row" aria-label="${esc(g.name)}"><div class="row-head"><span class="icon">${icon}</span><div><h3>${esc(g.name)} ${badge(g)}</h3><p>${esc(roleText(g))}</p></div></div><div><p>Fecha dia ${g.closingDay}</p><p class="muted">Vence dia ${g.dueDay}</p><button class="link" data-action="cards" data-id="${g.id}">${esc(relatedLabel(g))} ⌄</button></div><div><small class="sub-amount">${g.canEdit?(info.period.multi?'Em aberto no período':'Em aberto'):'Seus lançamentos'}</small><strong class="amount">${esc(money(metric(g)))}</strong><span class="sub-amount">${esc(future(g))}</span>${g.canEdit&&cents(g.creditCents)>0n?`<p class="scope-note">Crédito no recorte: ${esc(money(g.creditCents))}</p>`:''}</div><div class="wide-limit">${g.canEdit?`<strong style="font-size:13px">${esc(money(g.limitCents))}</strong>${bar!==null?`<div class="meter" role="meter" aria-label="Em aberto em relação ao limite cadastrado" aria-valuenow="${bar}" aria-valuemin="0" aria-valuemax="100"><i style="width:${bar}%"></i></div><span class="sub-amount">${bar.toLocaleString('pt-BR')}% em aberto${cents(g.openCents)>cents(g.limitCents)?' · acima do limite':''}</span>`:`<p class="scope-note">${info.period.multi?'Sem comparação com o acumulado':'Limite não informado'}</p>`}`:'<span class="sub-amount">Visão individual</span>'}</div><div class="wide-actions"><button class="btn quiet" data-action="invoice" data-id="${g.id}">Ver fatura</button><details class="more"><summary aria-label="Ações de ${esc(g.name)}">···</summary><div class="menu">${actions(g)}</div></details></div></article>`;
 }).join('');}
 function phoneRows(list){return list.map(g=>`<article class="phone-card" aria-label="${esc(g.name)}"><header><div class="row-head"><span class="icon">${icon}</span><div><h3>${esc(g.name)} ${badge(g)}</h3><p>${esc(roleText(g))}</p></div></div><button class="more" data-action="phone-actions" data-id="${g.id}" aria-label="Ações de ${esc(g.name)}">···</button></header><p class="value-label">${g.canEdit?(info.period.multi?'Em aberto no período':'Em aberto'):'Seus lançamentos'}</p><strong class="amount">${esc(money(metric(g)))}</strong><p class="sub-amount">${esc(future(g))}</p><p class="dates">Fecha dia ${g.closingDay} · Vence dia ${g.dueDay}</p>${g.canEdit&&cents(g.creditCents)>0n?`<p class="scope-note">Crédito no recorte: ${esc(money(g.creditCents))}</p>`:''}<footer><button class="link" data-action="cards" data-id="${g.id}">${esc(relatedLabel(g))}</button><button class="btn" data-action="invoice" data-id="${g.id}">Ver fatura →</button></footer></article>`).join('');}
 function render(){if(!alive||!info)return;const list=filtered(),owned=list.filter(g=>g.canEdit),partial=list.filter(g=>!g.canEdit);
  $('total-open').textContent=money(owned.reduce((n,g)=>n+cents(g.openCents),0n));
  $('total-planned').textContent=!info.period.start?'Escolha um período':forecast==='ready'?money(owned.reduce((n,g)=>n+cents(projections[g.id]),0n)):forecast==='loading'?'Calculando…':'Indisponível';
  if($('total-additional'))$('total-additional').textContent=money(partial.reduce((n,g)=>n+cents(g.registeredCents),0n));
  $('count').textContent=list.length+(list.length===1?' fatura':' faturas');if($('period-label'))$('period-label').textContent=info.period.start?(info.period.multi?month(info.period.start)+' a '+month(info.period.end):month(info.period.start)):'Todo o histórico';
  $('list').innerHTML=list.length?(phone?phoneRows(list):wideRows(list)):`<div class="cn-state"><strong>${groups.length?'Nenhum cartão encontrado':'Seu primeiro cartão começa aqui'}</strong><p>${groups.length?'Altere os filtros ou tente outro nome.':'Cadastre a fatura e vincule seus cartões.'}</p><button class="btn error-retry" data-action="${groups.length?'clear':'new'}">${groups.length?'Limpar filtros':'Novo cartão'}</button></div>`;
  all('[data-status]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.status===$('status').value)));
 }
 async function reload(){const mine=++epoch,f=filters();forecast='loading';root.setAttribute('aria-busy','true');all('[data-action="new"]').forEach(b=>b.disabled=!info);
  if(!info)$('list').innerHTML='<div class="cn-state">Carregando seus cartões…</div>';
  try{const r=await rpc('cartoesNovoListar',f);if(!alive||mine!==epoch)return;groups=r.groups;info=r;projections={};render();root.setAttribute('aria-busy','false');all('[data-action="new"]').forEach(b=>b.disabled=false);if(typeof finalizarCarregamentoTelaMukirana==='function')finalizarCarregamentoTelaMukirana();
   if(overlay==='detail'&&current)showDetail(current,true);
   if(!info.period.start){forecast='ready';render();return;}
   rpc('cartoesNovoPrevisoes',f).then(p=>{if(!alive||mine!==epoch)return;projections=p.groups||{};if(Array.isArray(p.snapshot))groups=p.snapshot;forecast='ready';render();if(overlay==='detail'&&detailsCache)$('detail-content').innerHTML=detailMarkup(detailsCache);}).catch(()=>{if(alive&&mine===epoch){forecast='error';render();}});
  }catch(e){if(!alive||mine!==epoch)return;root.setAttribute('aria-busy','false');if(typeof finalizarCarregamentoTelaMukirana==='function')finalizarCarregamentoTelaMukirana();if(info){forecast='error';render();notice(errorText(e));}else $('list').innerHTML='<div class="cn-state help-error">'+esc(errorText(e))+'<br><button class="btn error-retry" data-action="reload">Tentar novamente</button></div>';}
 }
 function open(name){all('details.more[open]').forEach(d=>d.open=false);if(!overlay){lastFocus=document.activeElement;oldOverflow=document.body.style.overflow;}$('app').inert=true;overlay=name;$(name).hidden=false;document.body.style.overflow='hidden';requestAnimationFrame(()=>{if(alive&&overlay===name)$(name).querySelector('button,input')?.focus();});}
 function close(name){if(busy&&name==='editor')return;$(name).hidden=true;overlay=null;$('app').inert=false;document.body.style.overflow=oldOverflow;
  if(name==='editor'){usersEpoch++;editorEpoch++;clearTimeout(userTimer);}if(name==='detail')detailEpoch++;
  if(lastFocus?.isConnected)lastFocus.focus();else root.querySelector('[data-action="new"]')?.focus();
 }
 function setBusy(value){busy=value;all('#ct-form input,#ct-form button,#ct-form select,#ct-editor [data-close]').forEach(e=>e.disabled=value);$('form').querySelector('button[type="submit"]').textContent=value?'Salvando…':'Salvar cartão';}
 function renderPeople(){if(!draft)return;const sorted=people.slice().sort((a,b)=>Number(draft.selected.has(b.id))-Number(draft.selected.has(a.id))||a.name.localeCompare(b.name,'pt-BR'));
  $('people').innerHTML=sorted.map(p=>`<label class="person"><input type="checkbox" name="ct-person" value="${p.id}" ${draft.selected.has(p.id)?'checked':''}><span>${esc(p.name)}<small>${esc(p.active===false?'Usuário inativo · remova para salvar':p.email||'Adicional selecionado')}</small></span></label>`).join('');
 }
 async function searchPeople(search){const mine=++usersEpoch,editing=draft;if(!editing||overlay!=='editor')return;$('users-status').textContent='Buscando adicionais…';
  try{const r=await rpc('cartoesNovoUsuarios',search,editing.version?editing.id:null);if(!alive||mine!==usersEpoch||editing!==draft||overlay!=='editor')return;const known=new Map(people.filter(p=>editing.selected.has(p.id)).map(p=>[p.id,p]));r.users.forEach(p=>known.set(p.id,p));people=[...known.values()];renderPeople();$('users-status').textContent=editing.selected.size+' selecionado(s).'+(search.trim().length<2?' Digite pelo menos 2 caracteres para buscar.':r.users.length?'':' Nenhuma pessoa encontrada.');}
  catch(e){if(alive&&mine===usersEpoch)$('users-status').textContent=errorText(e);}
 }
 function fillEditor(data){const g=data?.group;draft={id:g?.id||uuid(),version:g?.version||0,operationId:uuid(),hash:null,selected:new Set(g?.participants||[]),originalClosing:g?.closingDay||null};
  usersEpoch++;people=(data?.cards||[]).filter(c=>draft.selected.has(c.userId)).map(c=>({id:c.userId,name:c.userName,email:'',active:c.userActive}));$('form').reset();$('form-error').textContent='';$('editor-title').textContent=g?'Editar cartão':'Novo cartão';$('name').value=g?.name||'';const amount=cents(g?.limitCents);$('limit').value=g?(amount/100n).toString()+','+(amount%100n).toString().padStart(2,'0'):'';$('closing').value=g?.closingDay||10;$('due').value=g?.dueDay||17;$('closing-note').hidden=true;$('person-search').value='';$('users-status').textContent='Digite pelo menos 2 caracteres para buscar.';all('details.option').forEach(d=>d.open=false);renderPeople();setBusy(false);open('editor');requestAnimationFrame(()=>{if(alive&&overlay==='editor')$('name').focus();});
 }
 async function edit(id){if(!info||busy)return;const mine=++editorEpoch;if(!id){fillEditor(null);return;}const g=groups.find(g=>g.id===id);if(!g?.canEdit){notice('Somente o titular pode editar este cadastro.');return;}
  notice('Carregando cadastro…');try{const data=await rpc('cartoesNovoDetalhar',id,filters());if(!alive||mine!==editorEpoch)return;if(!data.group.canEdit){notice('Você não tem permissão para editar.');return;}fillEditor(data);}catch(e){if(alive&&mine===editorEpoch)notice(errorText(e));}
 }
 function parseLimit(){let raw=$('limit').value.trim().replace(/\s/g,'');if(raw.length>24)return null;if(raw.includes(','))raw=raw.replace(/\./g,'').replace(',','.');if(!/^\d+(?:\.\d{1,2})?$/.test(raw))return null;const parts=raw.split('.');return(BigInt(parts[0])*100n+BigInt((parts[1]||'').padEnd(2,'0'))).toString();}
 async function save(e){e.preventDefault();if(busy||!draft)return;const name=$('name').value.trim(),limit=parseLimit();if(!name||name.length>160||limit===null||cents(limit)>99999999999999n){$('form-error').textContent='Informe um nome com até 160 caracteres e um limite válido, sem valor negativo.';return;}
  if(people.some(p=>draft.selected.has(p.id)&&p.active===false)){$('form-error').textContent='Remova os adicionais inativos antes de salvar.';return;}
  const request={id:draft.id,version:draft.version,name,limitCents:limit,closingDay:Number($('closing').value),dueDay:Number($('due').value),participants:[...draft.selected].sort()};
  const hash=JSON.stringify(request);if(draft.hash&&draft.hash!==hash)draft.operationId=uuid();draft.hash=hash;request.operationId=draft.operationId;$('form-error').textContent='';setBusy(true);
  try{await rpc('cartoesNovoSalvar',request);if(!alive)return;setBusy(false);close('editor');if(!request.version){$('search').value='';$('status').value='active';$('role').value='all';}notice(request.version?'Cartão atualizado.':'Cartão criado.');await reload();}
  catch(e){if(alive){setBusy(false);$('form-error').textContent=errorText(e);}}
 }
 async function changeStatus(g,target){if(!g?.canEdit)return;let op=statusOps.get(g.id);if(op?.busy)return;if(!op||op.target!==target)op={id:uuid(),version:g.version,target,busy:false};op.busy=true;statusOps.set(g.id,op);
  try{const r=await rpc('cartoesNovoStatus',{id:g.id,version:op.version,operationId:op.id,active:target});if(!alive)return;statusOps.delete(g.id);Object.assign(g,r.group);render();reload();notice(target?'Cartão restaurado.':'Cartão inativado. O histórico foi preservado.',()=>{const now=groups.find(x=>x.id===g.id)||g;changeStatus(now,!target);});}
  catch(e){if(alive){op.busy=false;if(/foi alterado/i.test(errorText(e))){statusOps.delete(g.id);reload();}notice(errorText(e));}}
 }
 function showActions(g){$('actions-title').textContent=g.name;$('actions-content').innerHTML=`<button data-action="invoice" data-id="${g.id}">Ver fatura</button>${actions(g)}`;open('actions');}
 function detailMarkup(data){const g=data.group;return`<section class="detail-total"><small class="help">${g.canEdit?'Em aberto no recorte':'Seus lançamentos'}</small><strong>${esc(money(metric(g)))}</strong><p>Registrado <b>${esc(money(g.registeredCents))}</b></p><p>Previsto, separado <b>${esc(future(g))}</b></p>${g.canEdit?`<p>Pago <b>${esc(money(g.paidCents))}</b></p><p>Pagamento programado <b>${esc(money(g.scheduledPaymentsCents))}</b></p>${cents(g.creditCents)>0n?`<p>Crédito no recorte <b>${esc(money(g.creditCents))}</b></p>`:''}`:'<p>Visão parcial. Os pagamentos globais da fatura não são abatidos deste subtotal.</p>'}</section><h3 class="section-title">Cartões vinculados</h3>${data.cards.map(c=>`<div class="physical"><div><strong>${esc(c.userName)} · ${esc(c.type.toLocaleLowerCase('pt-BR'))}</strong><small>${esc(c.name)} · ${c.active&&g.active?'Ativo':'Histórico preservado'}</small><small>${esc(money(c.registeredCents))} no recorte</small></div><button class="btn quiet" data-action="movements" data-card="${c.id}" data-id="${g.id}">Lançamentos</button></div>`).join('')||'<p class="help">Nenhum cartão vinculado disponível.</p>'}${g.months.length?`<h3 class="section-title">Por competência</h3>${g.months.map(m=>`<div class="month-line"><span>${esc(month(m.month))}<small>Registrado ${esc(money(m.registeredCents))}${g.canEdit?' · pago '+esc(money(m.paidCents)):''}</small></span><strong>${esc(money(g.canEdit?m.openCents:m.registeredCents))}</strong></div>`).join('')}`:''}<p class="help" style="margin-top:20px">Fecha dia ${g.closingDay} · Vence dia ${g.dueDay}.</p><p class="help">${g.canEdit?'O limite é compartilhado. Adicionais não multiplicam o limite da fatura.':'Somente o titular altera o cadastro e os adicionais.'}</p>`;}
 async function showDetail(id,refresh){const mine=++detailEpoch;current=id;detailsCache=null;$('detail-error').textContent='';$('detail-title').textContent=groups.find(g=>g.id===id)?.name||'Cartões vinculados';$('detail-subtitle').textContent='Carregando detalhes…';$('detail-content').innerHTML='<p class="help">Carregando cartões e competências…</p>';$('detail-edit').hidden=true;$('detail-invoice').hidden=true;if(!refresh)open('detail');
  try{const data=await rpc('cartoesNovoDetalhar',id,filters());if(!alive||mine!==detailEpoch||overlay!=='detail')return;detailsCache=data;$('detail-title').textContent=data.group.name;$('detail-subtitle').textContent=info.period.start?(month(info.period.start)+(info.period.multi?' a '+month(info.period.end):'')):'Todo o histórico';$('detail-content').innerHTML=detailMarkup(data);$('detail-edit').hidden=!data.group.canEdit;$('detail-invoice').hidden=false;}
  catch(e){if(alive&&mine===detailEpoch){$('detail-error').textContent=errorText(e);$('detail-content').innerHTML='<button class="btn" data-action="detail-retry">Tentar novamente</button>';$('detail-subtitle').textContent='Não foi possível carregar o detalhe.';}}
 }
 function invoice(id){const f=filters();localStorage.setItem('mukirana_fatura_cartao',JSON.stringify({ID_Grupo_Cartao:id,Mes_Inicial:f.Mes_Inicial||f.Mes_Referencia||'',Mes_Final:f.Mes_Final||'',Retorno_Tela:'CartoesNovo'}));if(typeof navegarPara==='function')navegarPara('FaturasCartao');}
 function movements(cardId,groupId){const f=filters(),g=groups.find(x=>x.id===groupId);if(typeof abrirLancamentosContextuaisMukirana!=='function'){notice('Não foi possível abrir os lançamentos. Atualize a página.');return;}if(overlay==='detail')close('detail');abrirLancamentosContextuaisMukirana({ID_Cartao:cardId,Mes_Inicial:f.Mes_Inicial||f.Mes_Referencia||'',Mes_Final:f.Mes_Final||'',Titulo:'Lançamentos do cartão',Subtitulo:g?.name||'Cartão',Nome_Contexto:g?.name||'Cartão',Resumo_Contexto:'Cartão e período preservados ao consultar os lançamentos.'});}
 function action(e){const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action,g=groups.find(g=>g.id===b.dataset.id);if(a==='phone-actions'){showActions(g);return;}if(overlay==='actions')close('actions');
  if(a==='new')edit();if(a==='edit')edit(g.id);if(a==='cards')showDetail(g.id);if(a==='invoice')invoice(g.id);if(a==='status')changeStatus(g,!g.active);if(a==='reload')reload();if(a==='clear'){$('search').value='';$('status').value='active';$('role').value='all';render();}if(a==='movements')movements(b.dataset.card,g.id);if(a==='detail-retry')showDetail(current,true);
 }
 for(const id of ['closing','due'])$(id).innerHTML=Array.from({length:31},(_,i)=>`<option value="${i+1}">Dia ${i+1}</option>`).join('');
 on(root,'click',action);on($('search'),'input',render);on($('status'),'change',render);on($('role'),'change',render);all('[data-status]').forEach(b=>on(b,'click',()=>{$('status').value=b.dataset.status;render();}));
 on($('form'),'submit',save);on($('closing'),'change',()=>{$('closing-note').hidden=!draft?.version||Number($('closing').value)===draft.originalClosing;});
 on($('person-search'),'input',()=>{clearTimeout(userTimer);const q=$('person-search').value;if(q.trim().length<2){usersEpoch++;$('users-status').textContent='Digite pelo menos 2 caracteres para buscar.';return;}userTimer=setTimeout(()=>searchPeople(q),300);});
 on($('person-search'),'keydown',e=>{if(e.key==='Enter'){e.preventDefault();if($('person-search').value.trim().length>=2)searchPeople($('person-search').value);}});
 on($('people'),'change',e=>{if(e.target.name!=='ct-person'||!draft)return;const p=people.find(p=>p.id===e.target.value);if(e.target.checked&&p?.active===false){e.target.checked=false;return;}if(e.target.checked)draft.selected.add(e.target.value);else draft.selected.delete(e.target.value);$('users-status').textContent=draft.selected.size+' selecionado(s).';});
 all('details.option').forEach(d=>on(d,'toggle',()=>{if(d.open&&draft&&overlay==='editor')searchPeople($('person-search').value);}));
 all('[data-close]').forEach(b=>on(b,'click',()=>close(b.dataset.close)));all('.overlay,.sheet-backdrop').forEach(o=>on(o,'click',e=>{if(e.target===o)close(o.id.slice(3));}));
 on($('detail-edit'),'click',()=>{const id=current;close('detail');edit(id);});on($('detail-invoice'),'click',()=>invoice(current));
 on(document,'click',e=>all('details.more[open]').forEach(d=>{if(!d.contains(e.target))d.open=false;}));
 on(document,'keydown',e=>{if(!root.isConnected)return;if(e.key==='Escape'){if(overlay){e.preventDefault();close(overlay);}else all('details.more[open]').forEach(d=>d.open=false);}
