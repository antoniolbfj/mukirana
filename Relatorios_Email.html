<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <meta charset="UTF-8">
    <style>
      body {
        margin: 0;
        padding: 0;
        background: #edf3f2;
        color: #21352d;
        font-family: Arial, Helvetica, sans-serif;
      }

      .container {
        max-width: 780px;
        margin: 0 auto;
        padding: 20px 14px;
      }

      .conteudo {
        background: #f7f4ed;
        border: 1px solid #d8e3dd;
        border-radius: 18px;
        overflow: hidden;
        box-shadow: 0 14px 34px rgba(25, 47, 37, 0.08);
      }

      .hero {
        padding: 26px 24px 20px;
        background: linear-gradient(180deg, #e3efe8 0%, #edf5f1 100%);
        border-bottom: 1px solid #d3e2d9;
      }

      .balanco-card {
        padding: 24px;
        border: 1px solid #d3e2d9;
        border-radius: 16px;
        background: #f3faf6;
      }

      .balanco-card.semaforo-verde {
        background: #edf9f2;
        border-color: #b9e1c8;
      }

      .balanco-card.semaforo-amarelo {
        background: #fff8df;
        border-color: #eadb96;
      }

      .balanco-card.semaforo-vermelho {
        background: #fff1ee;
        border-color: #efc6bd;
      }

      .balanco-topo {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 14px;
        align-items: start;
      }

      .balanco-topo strong {
        display: inline-block;
        padding: 6px 10px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.78);
        color: #244438;
        font-size: 12px;
        line-height: 1.2;
      }

      .balanco-valor {
        margin-top: 14px;
        color: #163a2d;
        font-size: 32px;
        font-weight: 800;
        line-height: 1.15;
      }

      .hero-kicker {
        display: inline-block;
        margin-bottom: 12px;
        padding: 5px 11px;
        border-radius: 999px;
        background: #fff2c6;
        color: #775200;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.2px;
      }

      h1 {
        margin: 0 0 10px;
        color: #183b2f;
        font-size: 28px;
        line-height: 1.2;
      }

      h2 {
        margin: 0;
        color: #213b31;
        font-size: 17px;
        line-height: 1.3;
      }

      .texto-base {
        margin: 0;
        color: #4a6258;
        font-size: 14px;
        line-height: 1.55;
      }

      .hero .texto-base {
        max-width: 620px;
      }

      .meta-periodo {
        margin-top: 14px;
        color: #385347;
        font-size: 13px;
        font-weight: 700;
      }

      .hero-grade {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 10px;
        margin-top: 16px;
      }

      .hero-card {
        padding: 12px 13px;
        border: 1px solid #d4e1da;
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.74);
      }

      .hero-card span {
        display: block;
        margin-bottom: 4px;
        color: #5c7268;
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.3px;
      }

      .hero-card strong {
        display: block;
        color: #183b2f;
        font-size: 20px;
        line-height: 1.2;
      }

      .hero-card small {
        display: block;
        margin-top: 5px;
        color: #60756a;
        font-size: 11px;
        line-height: 1.4;
      }

      .corpo {
        padding: 18px 20px 22px;
      }

      .secao {
        margin-top: 20px;
        padding: 0;
        background: transparent;
        border: 0;
        border-radius: 0;
      }

      .secao:first-child {
        margin-top: 0;
      }

      .secao-cabecalho {
        margin-bottom: 10px;
      }

      .secao-cabecalho span {
        display: block;
        margin-top: 4px;
        color: #68786f;
        font-size: 12px;
        line-height: 1.4;
      }

      .insight {
        margin: 0 0 12px;
        padding: 11px 12px;
        border-left: 4px solid #53b88a;
        border-radius: 10px;
        background: #eef9f2;
        color: #294b3c;
        font-size: 13px;
        line-height: 1.45;
      }

      .grade-metricas {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }

      .grade-compacta .hero-card strong {
        font-size: 17px;
      }

      .metrica {
        border: 1px solid #e3e8df;
        border-radius: 12px;
        padding: 12px;
        background: #f7fbf8;
      }

      .metrica.receita {
        background: #edf9f2;
        border-color: #caead4;
      }

      .metrica.despesa {
        background: #fff1ee;
        border-color: #f2d1ca;
      }

      .metrica.transferencia {
        background: #eef5ff;
        border-color: #cfe0fb;
      }

      .metrica.resultado {
        background: #fff8df;
        border-color: #eedf9d;
      }

      .metrica span {
        display: block;
        color: #5d7066;
        font-size: 12px;
        margin-bottom: 6px;
      }

      .metrica strong {
        display: block;
        color: #1c372b;
        font-size: 19px;
        line-height: 1.2;
      }

      .metrica small {
        display: block;
        margin-top: 5px;
        color: #688075;
        font-size: 11px;
        line-height: 1.4;
      }

      .chamada-rateio {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 8px 14px;
        align-items: center;
      }

      .chamada-rateio em {
        display: inline-block;
        padding: 4px 8px;
        border-radius: 999px;
        background: #eff4ff;
        color: #3b5787;
        font-size: 11px;
        font-style: normal;
        font-weight: 700;
      }

      .chamada-rateio strong {
        margin-top: 6px;
      }

      .chamada-rateio b {
        font-size: 15px;
      }

      .subsecao-relatorio {
        margin-top: 12px;
        padding-top: 10px;
        border-top: 1px solid #edf1ec;
      }

      .subsecao-relatorio:first-child {
        margin-top: 0;
        padding-top: 0;
        border-top: 0;
      }

      .subsecao-relatorio h3 {
        margin: 0 0 4px;
        color: #31473d;
        font-size: 13px;
        line-height: 1.3;
      }

      .tabela-cenarios {
        width: 100%;
        table-layout: fixed;
        border-collapse: separate;
        border-spacing: 0;
        overflow: hidden;
        border: 1px solid #d9e3dd;
        border-radius: 10px;
        background: #ffffff;
        box-shadow: 0 8px 20px rgba(25, 47, 37, 0.05);
      }

      .tabela-cenarios .col-rotulo {
        width: 34%;
      }

      .tabela-cenarios .col-valor {
        width: 22%;
      }

      .tabela-cenarios th {
        background: #eef5f1;
        color: #516a5f;
        font-size: 11px;
        font-weight: 700;
        line-height: 1.2;
        padding: 12px 10px;
        text-align: right;
        text-transform: uppercase;
        white-space: nowrap;
      }

      .tabela-cenarios th:first-child {
        text-align: left;
      }

      .tabela-cenarios td {
        padding: 13px 10px;
        border-top: 1px solid #edf1ec;
        color: #1f372d;
        font-size: 13px;
        font-weight: 700;
        line-height: 1.25;
        text-align: right;
        vertical-align: middle;
        white-space: nowrap;
      }

      .tabela-cenarios td + td,
      .tabela-cenarios th + th {
        border-left: 1px solid #edf1ec;
      }

      .tabela-cenarios tbody tr:nth-child(odd) {
        background: #fbfdfb;
      }

      .tabela-cenarios .celula-rotulo {
        color: #26372f;
        font-size: 13px;
        font-weight: 700;
        line-height: 1.25;
        text-align: left;
        white-space: normal;
      }

      .tabela-linha.receita .celula-valor {
        color: #21784c;
      }

      .tabela-linha.despesa .celula-valor {
        color: #b44a38;
      }

      .diagnostico-aviso {
        margin: 0 0 14px;
        padding: 10px 12px;
        border: 1px solid #f0dcc2;
        border-radius: 8px;
        background: #fff8eb;
      }

      .diagnostico-despesas {
        padding-top: 14px;
      }

      .diagnostico-topo {
        display: flex;
        justify-content: space-between;
        gap: 14px;
        align-items: baseline;
      }

      .diagnostico-topo strong {
        color: #b44a38;
        font-size: 16px;
        line-height: 1.2;
        white-space: nowrap;
      }

      .vazio-relatorio {
        margin: 10px 0 0;
        color: #718176;
        font-size: 12px;
      }

      .tabela-diagnostico {
        margin-top: 12px;
        width: 100%;
      }

      .tabela-diagnostico-cabecalho,
      .tabela-diagnostico-linha {
        display: grid;
        grid-template-columns: minmax(220px, 2fr) repeat(4, minmax(80px, 1fr));
        gap: 8px;
        align-items: start;
      }

      .tabela-diagnostico-cabecalho {
        padding-bottom: 8px;
        color: #718176;
        font-size: 10px;
        font-weight: 700;
        text-transform: uppercase;
      }

      .tabela-diagnostico-linha {
        padding: 11px 0;
        border-top: 1px solid #edf1ec;
      }

      .tabela-diagnostico-linha strong {
        display: block;
        color: #26372f;
        font-size: 13px;
        line-height: 1.3;
      }

      .tabela-diagnostico-linha span {
        display: block;
        margin-top: 4px;
        color: #718176;
        font-size: 11px;
        line-height: 1.35;
        word-break: break-word;
      }

      .tabela-diagnostico-linha b {
        color: #26372f;
        font-size: 12px;
        line-height: 1.25;
        text-align: right;
        white-space: nowrap;
      }

      .tabela-diagnostico-linha b:last-child {
        color: #b44a38;
        font-size: 13px;
      }

      .linha {
        padding: 11px 0;
        border-bottom: 1px solid #edf1ec;
      }

      .linha:last-child {
        border-bottom: 0;
        padding-bottom: 0;
      }

      .linha-topo {
        display: flex;
        justify-content: space-between;
        gap: 14px;
      }

      .linha strong {
        display: block;
        color: #26372f;
        font-size: 14px;
        line-height: 1.35;
      }

      .linha span {
        display: block;
        margin-top: 4px;
        color: #6b7b73;
        font-size: 12px;
        line-height: 1.45;
        word-break: break-word;
      }

      .linha b {
        flex: 0 0 auto;
        color: #173f2e;
        font-size: 14px;
        text-align: right;
        white-space: nowrap;
      }

      .linha.alerta {
        margin-top: 8px;
        padding: 11px 12px;
        border: 1px solid #f0dcc2;
        border-radius: 10px;
        background: #fff8eb;
      }

      .barra {
        margin-top: 8px;
        height: 7px;
        overflow: hidden;
        border-radius: 999px;
        background: #edf1ec;
      }

      .barra-preenchimento {
        height: 7px;
        border-radius: 999px;
        background: #53b88a;
      }

      .barra-preenchimento.despesa {
        background: #e57864;
      }

      .barra-preenchimento.alerta {
        background: #d9a822;
      }

      .vazio {
        margin: 0;
        padding: 12px;
        border-radius: 10px;
        background: #f6f4ee;
        color: #66776e;
        font-size: 13px;
        line-height: 1.45;
      }

      .rodape {
        margin-top: 18px;
        padding: 0;
        border-radius: 0;
        background: transparent;
        color: #5e7068;
        font-size: 12px;
        line-height: 1.5;
      }

      .rodape p {
        margin: 0 0 8px;
      }

      .rodape p:last-child {
        margin-bottom: 0;
      }

      @media (max-width: 560px) {
        .container {
          padding: 12px;
        }

        .hero,
        .corpo {
          padding-left: 15px;
          padding-right: 15px;
        }

        .hero-grade,
        .grade-metricas {
          grid-template-columns: 1fr;
        }

        .balanco-card {
          padding: 18px 15px;
        }

        .balanco-topo {
          grid-template-columns: 1fr;
        }

        .balanco-valor {
          font-size: 28px;
        }

        .tabela-cenarios th {
          padding: 10px 6px;
          font-size: 10px;
        }

        .tabela-cenarios td {
          padding: 11px 6px;
          font-size: 12px;
        }

        .tabela-cenarios .celula-rotulo {
          font-size: 12px;
        }

        .diagnostico-topo {
          display: block;
        }

        .diagnostico-topo strong {
          display: block;
          margin-top: 4px;
        }

        .tabela-diagnostico-cabecalho {
          display: none;
        }

        .tabela-diagnostico-linha {
          grid-template-columns: 1fr;
          gap: 7px;
          padding: 12px 0;
        }

        .tabela-diagnostico-linha b {
          display: flex;
          justify-content: space-between;
          gap: 12px;
          text-align: right;
        }

        .tabela-diagnostico-linha b::before {
          content: attr(data-label);
          color: #738178;
          font-weight: 700;
          text-align: left;
        }

        .linha-topo {
          display: block;
        }

        .chamada-rateio {
          grid-template-columns: 1fr;
        }

        .linha b {
          display: block;
          margin-top: 6px;
          text-align: left;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="conteudo">
        <div class="corpo">
          <?!= conteudoHtml ?>
        </div>
      </div>
    </div>
  </body>
</html>
