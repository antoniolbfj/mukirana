<style>
  #ln-global-saldo{border:0;border-left:1px solid var(--cor-borda,var(--ux-line));background:transparent;padding:0 12px;text-align:right;min-width:170px;cursor:pointer;color:var(--cor-texto-principal,var(--ux-ink))}
  #ln-global-saldo small{display:block;font-size:10px;color:var(--cor-texto-secundario,var(--ux-muted))}#ln-global-saldo strong{display:block;font-size:21px;font-weight:750;white-space:nowrap}#ln-global-saldo[data-error="true"] strong{font-size:12px;color:var(--ux-negative)}
  #ln-period-config{min-width:36px;min-height:36px;border:var(--borda-suave,1px solid var(--ux-line));border-radius:8px;background:var(--cor-superficie,var(--ux-surface));cursor:pointer}
  #topbar-filtro-periodo-global .topbar-checkbox-global{display:flex;align-items:center;gap:6px;white-space:nowrap}#mk_global_saldo_anterior{width:17px;height:17px}#topbar-filtro-periodo-global .topbar-checkbox-global span{display:inline!important;font-size:11px}#topbar-filtro-periodo-global{margin-left:auto}#topbar-filtro-periodo-global input[type="month"]{min-height:36px}
  body.mukirana-com-topbar #conteudo-principal{padding-top:calc(var(--ln-topbar-height,72px) + 16px)!important}
  .ln-dialog-overlay{position:fixed;inset:0;z-index:2500;background:var(--ux-overlay);display:flex;justify-content:center;align-items:center;padding:20px}.ln-dialog-overlay[hidden]{display:none}.ln-dialog{background:var(--cor-superficie,var(--ux-surface));color:var(--cor-texto-principal,var(--ux-ink));width:470px;max-width:100%;max-height:90dvh;overflow:auto;border-radius:16px;padding:24px}.ln-dialog h2{font-size:20px;margin:0 0 10px}.ln-dialog p{font-size:12px;color:var(--cor-texto-secundario,var(--ux-muted));line-height:1.6}.ln-dialog label{font-size:12px;display:block;margin:12px 0}.ln-dialog input,.ln-dialog select{width:100%;min-height:44px;font:inherit;margin-top:5px}.ln-dialog .ln-pair{display:grid;grid-template-columns:1fr 1fr;gap:15px}.ln-dialog .ln-save{display:flex;gap:10px;align-items:center}.ln-dialog .ln-save input{width:18px;min-height:18px}.ln-dialog footer{display:flex;justify-content:end;gap:10px;margin-top:20px}.ln-dialog button{min-height:44px;padding:10px 16px;border:var(--borda-suave,1px solid var(--ux-line));border-radius:9px;cursor:pointer}.ln-dialog button[type="submit"]{background:var(--cor-primaria,var(--ux-primary));color:var(--ux-on-primary)}.ln-balance-line{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:var(--borda-suave,1px solid var(--ux-line));font-size:12px}.ln-dialog-error{color:var(--ux-negative)!important}
  @media(max-width:900px){#topbar-app{flex-wrap:wrap}#ln-global-saldo{margin-left:auto;min-width:140px;padding-right:2px}#topbar-filtro-periodo-global{order:3;display:flex!important;flex-basis:100%;justify-content:center;gap:8px}#topbar-filtro-periodo-global .grupo-campo-global{display:flex;flex:1;align-items:center;gap:5px}#topbar-filtro-periodo-global input[type="month"]{width:100%;min-width:0}#topbar-contexto-app{order:4}.ln-dialog-overlay{padding:12px}}
  @media(max-width:520px){#ln-global-saldo strong{font-size:19px}#ln-global-saldo small{font-size:9px}.topbar-marca span{display:none}#topbar-filtro-periodo-global label{font-size:9px}#topbar-filtro-periodo-global input[type="month"]{font-size:12px}#ln-period-config{min-width:34px}.ln-dialog{padding:20px}}
</style>
<script>
(() => {
'use strict';
const C=(<?!= lancamentosNovoRegras_.toString() ?>)(),$=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let lastToken='',pack=null,pending=null,cacheKey='',generation=0,scope=C.clean(),tab='all',activeView='',viewName='';const subscribers=new Set();let investment=false;
const month=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');};
const storageKey=suffix=>'mukirana-v3:'+String(localStorage.getItem('mukirana_id')||'session')+':'+suffix;
function read(store,key){try{return JSON.parse(store.getItem(key));}catch{return null;}}
function resolve(preference){const now=month(),shift=n=>{const d=new Date(now+'-01T12:00:00Z');d.setUTCMonth(d.getUTCMonth()+n);return d.toISOString().slice(0,7);};if(preference?.relative)return normalize({Mes_Selecionado:shift({previous:-1,next:1}[preference.relative]||0),Considerar_Historico_Anterior:preference.Considerar_Historico_Anterior===true});return normalize(preference||{Mes_Selecionado:now});}
function normalize(f){const selected=String(f.Mes_Selecionado||f.Mes_Final||f.Mes_Inicial||f.Mes_Referencia||month());if(!/^\d{4}-(0[1-9]|1[0-2])$/.test(selected))throw Error('Informe um mês válido.');const history=f.Mes_Selecionado!==undefined?f.Considerar_Historico_Anterior===true:f.Mes_Inicial===''&&!!f.Mes_Final;return {Mes_Selecionado:selected,Mes_Referencia:selected,Mes_Inicial:history?'':selected,Mes_Final:selected,Considerar_Historico_Anterior:history};}
window.obterFiltroPeriodoGlobalMukirana=function(){try{return resolve(read(sessionStorage,storageKey('period'))||read(localStorage,storageKey('period-preference')));}catch{return resolve(null);}};
window.salvarFiltroPeriodoGlobalMukirana=function(f){const normalized=normalize(f);sessionStorage.setItem(storageKey('period'),JSON.stringify(normalized));return normalized;};
window.aplicarFiltroPeriodoGlobalMukirana=function(){const f=obterFiltroPeriodoGlobalMukirana();if($('mk_global_mes'))$('mk_global_mes').value=f.Mes_Selecionado;if($('mk_global_saldo_anterior'))$('mk_global_saldo_anterior').checked=f.Considerar_Historico_Anterior;return f;};
window.inicializarFiltroPeriodoGlobalMukirana=function(){aplicarFiltroPeriodoGlobalMukirana();definirFiltroPeriodoGlobalVisivelMukirana(true);reload().catch(()=>{});};
function changePeriod(f){salvarFiltroPeriodoGlobalMukirana(f);aplicarFiltroPeriodoGlobalMukirana();reload().catch(()=>{});if(typeof mukiranaTelaAtual.atualizarPeriodoGlobal==='function')mukiranaTelaAtual.atualizarPeriodoGlobal(obterFiltroPeriodoGlobalMukirana());}
window.alterarFiltroPeriodoGlobalMukirana=function(){try{changePeriod({Mes_Selecionado:$('mk_global_mes').value,Considerar_Historico_Anterior:$('mk_global_saldo_anterior').checked});}catch(e){showError(e.message);}};
function rpc(name,value){const token=localStorage.getItem('mukirana_token')||'';return new Promise((resolve,reject)=>{google.script.run.withSuccessHandler(resolve).withFailureHandler(e=>reject(Error(e.message||'Não foi possível concluir a operação.')))[name](token,value);});}
function ledgerView(){return ['Lancamentos','LancamentosNovo'].includes(activeView);}
function scopedPack(){if(!pack)return null;return {...pack,includeInvestment:ledgerView()||investment,rows:pack.rows.filter(r=>ledgerView()||investment||pack.accounts.find(a=>a.id===r.account)?.type!=='Investimento')};}
function baseRows(){if(!pack)return[];return scopedPack().rows.filter(r=>tab!=='pending'||r.status==='pending').filter(r=>tab!=='shared'||pack.entries.find(e=>e.id===r.entryId)?.shares?.length).filter(r=>tab!=='uncategorized'||r.type!=='transfer'&&!r.category&&!r.special);}
function result(){return C.query(baseRows(),scope);}
function draw(){const button=$('ln-global-saldo');if(!button)return;if(!pack){button.dataset.error='false';button.querySelector('strong').textContent='Carregando…';return;}const summary=result().summary;button.dataset.error='false';button.querySelector('strong').textContent=C.money(summary.resultCents);button.querySelector('small:last-child').textContent=(['Lancamentos','LancamentosNovo'].includes(activeView)?'Filtros · ':'')+(ledgerView()?((pack.accounts.find(a=>a.id===scope.account)?.linkedGroup?'Fatura · ':'')+(pack.accounts.find(a=>a.id===scope.account)?.name||'Todas as contas')):(investment?'Todas as contas':'Consumo e Crédito'));}
function errorState(message){const button=$('ln-global-saldo');if(button){button.dataset.error='true';button.querySelector('strong').textContent='Não foi possível calcular';button.querySelector('small:last-child').textContent='Toque para tentar novamente';}if(window.console)console.warn('Resumo global indisponível.');}
function emit(){draw();subscribers.forEach(fn=>fn(scopedPack()));}
async function load(force=false){const token=localStorage.getItem('mukirana_token')||'';if(token!==lastToken){lastToken=token;pack=null;pending=null;scope=C.clean();tab='all';investment=read(sessionStorage,storageKey('include-investment'))===true;generation++;draw();}if(!token)throw Error('Sessão expirada.');const f=obterFiltroPeriodoGlobalMukirana(),key=JSON.stringify(f)+'|'+String(localStorage.getItem('mukirana_token')||'');if(!force&&pack&&cacheKey===key)return scopedPack();if(!force&&pending&&cacheKey===key)return pending;const current=++generation;cacheKey=key;pending=rpc('lancamentosNovoListar',f).then(value=>{if(current!==generation)return load();pack=value;scope=C.normalize(baseRows(),scope).filters;pending=null;emit();return scopedPack();}).catch(e=>{if(current===generation){pending=null;errorState(e.message);}throw e;});return pending;}
async function reload(){pack=null;draw();return load(true);}
const api={load,reload,rpc,subscribe(fn){subscribers.add(fn);return()=>subscribers.delete(fn);},setFilters(filters){scope=C.clean(filters);tab=['pending','shared','uncategorized'].includes(filters.tab)?filters.tab:'all';scope=C.normalize(baseRows(),scope).filters;draw();},setView(name){activeView=name;if(name==='Login'){pack=null;pending=null;cacheKey='';lastToken='';generation++;}if(!['Lancamentos','LancamentosNovo'].includes(name)){scope=C.clean();tab='all';}draw();},getInvestment(){return investment;},setInvestment(value){investment=value===true;sessionStorage.setItem(storageKey('include-investment'),JSON.stringify(investment));scope=C.normalize(baseRows(),scope).filters;emit();},getCore(){return C;},getPeriod(){return obterFiltroPeriodoGlobalMukirana();},getActor(){return pack?.user?.id||'';}};
window.MukiranaLancamentosStore=api;
function closeDialog(){const overlay=$('ln-global-dialog');if(overlay)overlay.remove();}
function dialog(title,html,onSubmit,label='Aplicar'){closeDialog();const overlay=document.createElement('div');overlay.id='ln-global-dialog';overlay.className='ln-dialog-overlay';overlay.innerHTML=`<section class="ln-dialog" role="dialog" aria-modal="true" aria-labelledby="ln-dialog-title"><h2 id="ln-dialog-title">${esc(title)}</h2><form id="ln-dialog-form">${html}<p id="ln-dialog-error" class="ln-dialog-error" role="alert"></p><footer><button type="button" id="ln-dialog-close">Fechar</button>${onSubmit?`<button type="submit">${label}</button>`:''}</footer></form></section>`;document.body.append(overlay);$('ln-dialog-close').onclick=closeDialog;if(onSubmit)$('ln-dialog-form').onsubmit=e=>{e.preventDefault();try{onSubmit();}catch(error){$('ln-dialog-error').textContent=error.message;}};overlay.onkeydown=e=>{if(e.key==='Escape'){e.preventDefault();closeDialog();}if(e.key==='Tab'){const list=[...overlay.querySelectorAll('button,input,select')].filter(x=>!x.disabled),first=list[0],last=list.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}};setTimeout(()=>overlay.querySelector('input,select,button')?.focus(),0);}
function showError(text){dialog('Confira o período','<p>'+esc(text)+'</p>');}
function periodDialog(){const f=obterFiltroPeriodoGlobalMukirana();dialog('Preferência de período',`<p>O mês e a opção de incluir o histórico acompanham todas as telas.</p><label>Ao entrar<select id="ln-period-preset"><option value="custom">Mês escolhido</option><option value="current">Mês atual</option><option value="previous">Mês anterior</option><option value="next">Próximo mês</option></select></label><label>Mês<input id="ln-period-month" type="month" value="${f.Mes_Selecionado}" required></label><label class="ln-save"><input type="checkbox" id="ln-period-history" ${f.Considerar_Historico_Anterior?'checked':''}>Incluir saldo anterior</label><p>Marcado: do primeiro lançamento até o fim do mês. Desmarcado: somente o mês escolhido.</p><label class="ln-save"><input type="checkbox" id="ln-period-save">Salvar como minha preferência</label>`,()=>{const current={Mes_Selecionado:$('ln-period-month').value,Considerar_Historico_Anterior:$('ln-period-history').checked};normalize(current);if($('ln-period-save').checked)localStorage.setItem(storageKey('period-preference'),JSON.stringify($('ln-period-preset').value==='custom'?current:{relative:$('ln-period-preset').value,Considerar_Historico_Anterior:current.Considerar_Historico_Anterior}));changePeriod(current);closeDialog();},'Aplicar');$('ln-period-preset').onchange=e=>{if(e.target.value!=='custom')$('ln-period-month').value=resolve({relative:e.target.value}).Mes_Selecionado;};$('ln-period-month').onchange=()=>$('ln-period-preset').value='custom';}
function balanceDialog(){if(!pack){reload().catch(()=>{});return;}const s=result().summary;dialog('Resultado dos lançamentos',`<p>${['Lancamentos','LancamentosNovo'].includes(activeView)?'Considera os filtros selecionados em Lançamentos.':'Considera o período global.'}</p>${[['Receitas',s.incomeCents],['Despesas',C.negate(s.expenseCents)],['Transferências recebidas',s.transferInCents],['Transferências enviadas',C.negate(s.transferOutCents)],['Resultado',s.resultCents]].map(([name,value])=>`<div class="ln-balance-line"><span>${name}</span><strong>${C.money(value)}</strong></div>`).join('')}<p>Escopo: ${ledgerView()?'todas as contas acessíveis':investment?'todas as contas':'Consumo e Crédito'}. A acertar fica separado.</p><p>Receitas − despesas + transferências recebidas − transferências enviadas. Nas duas contas da mesma transferência, os efeitos se anulam.</p>${s.openingCents!=='0'?'<p>Saldo inicial especial no recorte: '+C.money(s.openingCents)+'. Já está incluído nas receitas ou despesas acima; alterações são feitas no cadastro da conta.</p>':''}`);}
const filter=$('topbar-filtro-periodo-global');if(filter){const gear=document.createElement('button');gear.type='button';gear.id='ln-period-config';gear.textContent='⚙';gear.setAttribute('aria-label','Configurar período e preferência');gear.onclick=periodDialog;filter.append(gear);}
const header=$('topbar-app');if(header){const saldo=document.createElement('button');saldo.type='button';saldo.id='ln-global-saldo';saldo.innerHTML='<small>Ainda posso gastar</small><strong>Carregando…</strong><small>Período global</small>';saldo.onclick=balanceDialog;header.insertBefore(saldo,$('topbar-contexto-app'));const observer=new ResizeObserver(()=>{const height=header.getBoundingClientRect().height;document.documentElement.style.setProperty('--ln-topbar-height',height+'px');});observer.observe(header);}
})();
</script>
