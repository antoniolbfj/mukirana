@media(max-width:950px){body:not(.phone) .hub-tools .help{display:none}.bulk .btn{padding:8px;font-size:12px}body:not(.phone) .entry-row,body:not(.phone) .table-head{grid-template-columns:24px 80px minmax(120px,1.4fr) minmax(100px,1fr) minmax(95px,1fr) 110px 88px 28px;gap:8px}.table-head,.entry-row{font-size:12px}}

<script>
function criarLancamentosHub(api){
 'use strict';
 const {C,phone,$,esc,money,call,toast}=api;
 const columns={date:'Data',description:'Lançamento',category:'Categoria',account:'Conta / cartão',amount:'Valor',status:'Situação'};
 const fields={description:'Descrição',date:'Data',amount:'Valor',category:'Categoria',account:'Conta de origem',status:'Situação'};
 let order={key:'date',direction:'desc'},inline=null,views=[],accountSearch='',viewLoaded=false;
 let indexed=null,entryIndex=new Map(),accountIndex=new Map(),rowIndex=new Map();
 function index(){const data=api.data();if(data!==indexed){indexed=data;entryIndex=new Map((data?.entries||[]).map(e=>[e.id,e]));accountIndex=new Map((data?.accounts||[]).map(a=>[a.id,a]));rowIndex=new Map((data?.rows||[]).map(r=>[r.key,r]));}}
 const entry=id=>{index();return entryIndex.get(id);};
 const account=id=>{index();return accountIndex.get(id);};
 const eligible=(e,field)=>!!e&&(field==='category'?e.canCategorize===true:e.canEdit&&!e.opening&&!e.special&&!e.shares?.length&&['income','expense'].includes(e.type));
 const selected=()=>[...api.selection()].map(entry).filter(Boolean);
 const decimal=v=>{v=String(v).padStart(3,'0');return v.slice(0,-2).replace(/\B(?=(\d{3})+(?!\d))/g,'.')+','+v.slice(-2);};
 function canSelect(row){return row.canEdit||row.canCategorize;}
 function sortRows(rows){const key=order.key,direction=order.direction==='asc'?1:-1;return [...rows].sort((a,b)=>{let n;if(key==='amount')n=C.compare(a.signedCents,b.signedCents);else{const field={category:'categoryName',account:'accountName'}[key]||key;n=String(a[field]||'').localeCompare(String(b[field]||''),'pt-BR',{sensitivity:'base',numeric:true});}return n*direction||a.key.localeCompare(b.key);});}
 function scopedRows(){const data=api.data();return (data?.rows||[]).filter(r=>api.tab()!=='pending'||r.status==='pending').filter(r=>api.tab()!=='uncategorized'||r.type!=='transfer'&&!r.category&&!r.special);}
 function accountOptions(){const data=api.data(),map=new Map(data.accounts.filter(a=>a.kind==='Conta').map(a=>[a.id,{...a,label:a.name+(a.active?'':' · Inativa')}]));for(const r of data.rows)if(!map.has(r.account))map.set(r.account,{id:r.account,label:r.accountName,type:'Outras origens'});const needle=accountSearch.trim().toLocaleLowerCase('pt-BR');return [...map.values()].filter(a=>!needle||a.id===api.filters().account||a.label.toLocaleLowerCase('pt-BR').includes(needle)).sort((a,b)=>a.label.localeCompare(b.label,'pt-BR'));}
 function filterAccounts(){const select=document.querySelector('[data-filter="account"]');if(!select)return;const groups={Consumo:[], 'Cartão de Crédito':[],Investimento:[], 'Outras origens':[]};for(const a of accountOptions())(groups[a.type]||groups['Outras origens']).push(a);select.disabled=false;select.innerHTML='<option value="">Todas as contas</option>'+Object.entries(groups).filter(([,a])=>a.length).map(([key,list])=>'<optgroup label="'+esc(key==='Investimento'?'Investimento / Patrimônio':key)+'">'+list.map(a=>'<option value="'+esc(a.id)+'" '+(a.id===api.filters().account?'selected':'')+'>'+esc(a.label)+'</option>').join('')+'</optgroup>').join('');if(!document.getElementById('hub-account-search')){const label=document.createElement('label');label.className='hub-filter-search';label.innerHTML='Buscar conta <input class="input" id="hub-account-search" type="search" placeholder="Nome da conta" value="'+esc(accountSearch)+'">';$('advanced').prepend(label);}}
 function captureInline(){if(inline&&$('hub-inline-value'))inline.value=$('hub-inline-value').value;}
 function controls(){if(!$('hub-tools')){const node=document.createElement('div');node.id='hub-tools';node.className='hub-tools';node.innerHTML='<button type="button" class="btn" id="hub-views">Visões ▾</button><button type="button" class="icon-btn" id="hub-refresh" aria-label="Atualizar lançamentos" title="Atualizar lançamentos">↻</button><label class="hub-sort">Ordenar <select id="hub-sort" aria-label="Ordenar lançamentos">'+Object.entries(columns).flatMap(([key,label])=>['desc','asc'].map(d=>'<option value="'+key+':'+d+'">'+label+' '+(d==='asc'?'↑':'↓')+'</option>')).join('')+'</select></label><span class="help">Clique em um campo para editar · Enter salva · Esc cancela</span>';document.querySelector('.toolbar,.phone-search').after(node);}
 $('hub-sort').value=order.key+':'+order.direction;
 const head=document.querySelector('.table-head');if(head){head.setAttribute('role','row');[...head.children].slice(1,7).forEach((node,i)=>{const key=Object.keys(columns)[i];node.setAttribute('role','columnheader');node.setAttribute('aria-sort',order.key===key?(order.direction==='asc'?'ascending':'descending'):'none');node.innerHTML='<button class="hub-sort-button '+(key===order.key?'hub-sorted':'')+'" data-hub-sort="'+key+'">'+esc(columns[key])+'<span aria-hidden="true">'+(key===order.key?(order.direction==='asc'?'↑':'↓'):'↕')+'</span></button>';});}
 const bulk=$('bulk');if(api.selection().size){const list=selected(),count=list.filter(e=>eligible(e,'category')).length;bulk.innerHTML='<strong class="hub-bulk-label">'+list.length+' selecionado(s)</strong><button class="btn" data-hub-bulk="category" '+(!count?'disabled':'')+'>Categorizar</button><button class="btn" data-hub-bulk="classification">Fixa / variável</button><button class="btn" data-action="bulk-done">Efetivar</button><button class="btn danger" data-action="bulk-delete">Excluir</button><button class="icon-btn" data-action="unselect" aria-label="Limpar seleção">×</button>';}
 for(const key of C.dimensions){const select=document.querySelector('[data-filter="'+key+'"]'),value=api.filters()[key];if(select&&value&&![...select.options].some(o=>o.value===value)){const option=document.createElement('option');option.value=value;option.textContent=key==='category'?api.data().categories.find(c=>c.id===value)?.name||value:value;option.selected=true;select.append(option);select.disabled=false;}}
 if(!phone){const heading=document.querySelector('.page-head');if(heading)document.documentElement.style.setProperty('--hub-heading-height',heading.getBoundingClientRect().height+'px');}filterAccounts();decorateRows();
 }
 function decorateRows(){index();for(const node of document.querySelectorAll('#entries [data-key]')){const row=rowIndex.get(node.dataset.key),e=entry(row.entryId);if(!e)continue;
  const indices=phone?[]:[['date',1],['description',2],['category',3],['account',4],['amount',5],['status',6]];
  if(phone){indices.push(['description',0],['amount',1]);}
  for(const [field,index] of indices){let cell=phone?(field==='description'?node.querySelector('.entry-title'):node.querySelector('.row-value')):node.children[index];if(!cell||(!e.canEdit&&!(field==='category'&&e.canCategorize)))continue;if(field==='category'&&!e.canCategorize)continue;if(e.opening||e.special==='settlement'||e.special==='projection')continue;
   let button=cell.tagName==='BUTTON'?cell:document.createElement('button');if(button!==cell){button.innerHTML=cell.innerHTML;cell.innerHTML='';cell.append(button);}button.type='button';button.classList.add('hub-cell');button.dataset.hubInline=e.id;button.dataset.field=field;button.setAttribute('aria-label','Editar '+fields[field]+' de '+e.description);delete button.dataset.detail;
  }
  if(inline?.id===e.id&&(!inline.rowKey||inline.rowKey===row.key))renderInline(node,e,row);
 }
 }
 function renderInline(node,e,row){node.classList.add('hub-editing');let options='',type='text',field=inline.field;
  if(field==='date')type='date';
  if(field==='category')options=api.data().categories.filter(c=>c.active&&c.type===(e.type==='income'?'Receita':'Despesa')).map(c=>'<option value="'+esc(c.id)+'">'+esc(C.categoryLabel(c,api.data().categories))+'</option>').join('');
  if(field==='status')options='<option value="done">Efetivado</option><option value="pending">Pendente</option>';
  if(field==='account')options=api.data().accounts.filter(a=>(a.active&&a.canUse||a.id===e.origin)&&(!e.destination||a.id!==e.destination)&&(!e.special||a.canPayFrom)).map(a=>'<option value="'+esc(a.id)+'">'+esc(a.name)+'</option>').join('');
  const div=document.createElement('div');div.className='hub-inline-row';div.innerHTML='<form id="hub-inline-form" class="hub-inline-form" novalidate>'+('<label>Campo<select class="input" id="hub-inline-field">'+Object.entries(fields).filter(([key])=>key==='category'?e.canCategorize:e.canEdit).map(([key,name])=>'<option value="'+key+'" '+(key===field?'selected':'')+'>'+esc(name)+'</option>').join('')+'</select></label>')+'<label>'+esc(fields[field])+(options?'<select class="input" id="hub-inline-value"><option value="">Selecione…</option>'+options+'</select>':'<input class="input" id="hub-inline-value" type="'+type+'" '+(field==='amount'?'inputmode="decimal"':'')+' '+(field==='description'?'maxlength="160"':'')+'>')+'</label><button class="btn primary" type="submit">Salvar</button><button class="btn" type="button" data-hub-cancel>Cancelar</button><button class="btn quiet" type="button" data-hub-complete="'+esc(e.id)+'">Edição completa</button><p class="error" id="hub-inline-error" role="alert">'+esc(inline.error||'')+'</p><p class="help">'+(e.group?'A alteração rápida afeta esta ocorrência.':'Enter salva · Esc cancela')+'</p></form>';node.append(div);$('hub-inline-value').value=inline.value||'';if(inline.busy){div.classList.add('hub-inline-saving');div.querySelectorAll('input,select,button').forEach(x=>x.disabled=true);}
 }
 async function beginInline(id,field,rowKey){if(inline?.busy)return;if(inline&&$('hub-inline-value')?.value!==inline.initial){toast('Salve ou cancele a edição atual antes de trocar de campo.');return;}const e=entry(id);if(!e||(!e.canEdit&&!(field==='category'&&e.canCategorize)))return;if(field==='category'&&!e.canCategorize)return;const value=field==='amount'?decimal(e.amountCents):field==='account'?e.origin:field==='category'?e.displayCategory:e[field];inline={id,field,value:String(value||''),initial:String(value||''),entry:{...e},rowKey:rowKey||api.data().rows.find(r=>r.entryId===id)?.key,operationId:crypto.randomUUID(),error:''};await call('editing',{active:true});api.render();setTimeout(()=>{$('hub-inline-value')?.focus();$('hub-inline-value')?.select?.();},0);}
 async function cancelInline(){if(inline?.busy)return;const id=inline?.id,field=inline?.field;inline=null;await call('editing',{active:false});api.render();const button=[...document.querySelectorAll('[data-hub-inline]')].find(b=>b.dataset.hubInline===id&&b.dataset.field===field);button?.focus();}
 async function saveInline(){if(!inline||inline.busy)return;captureInline();const state=inline,e=state.entry;state.error='';try{
  if(!state.value&&state.field!=='category')throw Error('Informe um valor.');state.busy=true;api.render();
  let result;if(state.field==='category')result=await call('hub',{operationId:state.operationId,field:'category',value:state.value,selected:[{id:e.id,version:e.version,categoryVersion:e.categoryVersion||0}]});
  else if(state.field==='status')result=await call('action',{operationId:state.operationId,action:'status',id:e.id,version:e.version,status:state.value});
  else{const request={...e,operationId:state.operationId,scope:'one',classification:e.classification||'variable',shares:(e.shares||[]).map(p=>({id:p.id,cents:p.cents}))};if(state.field==='amount'){const amount=api.parse(state.value);if(!amount||C.compare(amount,'0')<=0)throw Error('Informe um valor maior que zero.');request.amountCents=amount;}else request[{account:'origin'}[state.field]||state.field]=state.value.trim();if(state.field==='date'&&state.value>api.today())request.status='pending';result=await call('save',request);}
  if(state.resumed){await call('draft-save',null);api.setSavedDraft(null);}inline=null;await call('editing',{active:false});await api.reload();const visible=api.visible().some(r=>r.entryId===e.id);toast(result?.pendingApproval?'Alteração salva; o rateio aguarda aprovação.':visible?'Lançamento atualizado.':'Lançamento salvo; ele saiu dos filtros atuais.');
  setTimeout(()=>[...document.querySelectorAll('[data-hub-inline]')].find(b=>b.dataset.hubInline===e.id&&b.dataset.field===state.field)?.focus(),0);
 }catch(error){state.busy=false;state.error=error.message;if(inline===state){api.render();$('hub-inline-value')?.focus();}}}
 function batch(field){const all=selected(),list=all.filter(e=>eligible(e,field)),excluded=all.length-list.length;if(!list.length){toast('Nenhum selecionado permite esta alteração.');return;}const types=[...new Set(list.map(e=>e.type))];if(field==='category'&&types.length>1){toast('Selecione receitas ou despesas para aplicar uma categoria compatível.');return;}
  const options=field==='category'?api.data().categories.filter(c=>c.active&&c.type===(types[0]==='income'?'Receita':'Despesa')).map(c=>[c.id,C.categoryLabel(c,api.data().categories)]):[['fixed','Fixa'],['variable','Variável']];let lastValue=null;const request={operationId:crypto.randomUUID(),field,value:'',selected:list.map(e=>({id:e.id,version:e.version,categoryVersion:e.categoryVersion||0}))};
  api.dialog(field==='category'?'Categorizar selecionados':'Classificar selecionados',list.length+' lançamento(s) serão alterados.'+(excluded?' '+excluded+' protegido(s) ficam fora desta ação.':'')+(list.some(e=>e.shares?.length)?' Nos rateios, somente a sua categoria será alterada.':''),'<label class="field">'+(field==='category'?'Categoria e subcategoria':'Classificação')+'<select class="input" id="hub-batch-value">'+options.map(([id,name])=>'<option value="'+esc(id)+'">'+esc(name)+'</option>').join('')+'</select></label>',async()=>{const value=$('hub-batch-value').value;if(lastValue!==null&&lastValue!==value)request.operationId=crypto.randomUUID();lastValue=value;request.value=value;await call('hub',request);api.closeDialog();api.clearSelection();await api.reload();toast(list.length+' lançamento(s) atualizado(s).');},'Aplicar');
 }
 async function savedViews(){if(!viewLoaded){const result=await call('views-load');views=Array.isArray(result)?result.filter(v=>typeof v.name==='string'&&v.name.length<=60&&v.filters&&['date','description','category','account','amount','status'].includes(v.order?.key)&&['asc','desc'].includes(v.order?.direction)).slice(0,20):[];viewLoaded=true;}const built=[['all','Todos os lançamentos'],['pending','Pendentes'],['uncategorized','A categorizar']];api.dialog('Visões de Lançamentos','Escolha uma visão ou salve explicitamente os filtros e a ordenação atuais. O período continua global.','<div class="hub-view-list">'+built.map(([id,name])=>'<button class="btn" type="button" data-hub-view="'+id+'">'+esc(name)+'</button>').join('')+views.map((v,i)=>'<div class="hub-view-line"><button class="btn hub-view-name" type="button" data-hub-saved="'+i+'">'+esc(v.name)+'</button><button class="icon-btn" type="button" data-hub-remove-view="'+i+'" aria-label="Excluir visão '+esc(v.name)+'">×</button></div>').join('')+'</div><label class="field" style="margin-top:18px">Nome desta visão<input class="input" id="hub-view-name" maxlength="60" placeholder="Ex.: Despesas da minha conta"></label>',async()=>{const name=$('hub-view-name').value.trim();if(!name)throw Error('Dê um nome à visão.');const same=views.find(v=>v.name.toLocaleLowerCase('pt-BR')===name.toLocaleLowerCase('pt-BR'));if(!same&&views.length>=20)throw Error('Você pode salvar até 20 visões.');const next=views.filter(v=>v!==same);next.push({name,filters:C.clean(api.filters()),tab:api.tab(),order:{...order}});await call('views-save',next);views=next;api.closeDialog();toast('Visão salva neste navegador.');},'Salvar visão atual');}
 function applyView(v){captureInline();if(inline){toast('Salve ou cancele a edição antes de trocar a visão.');return;}api.setFilters(C.clean(v.filters));api.setTab(['pending','uncategorized'].includes(v.tab)?v.tab:'all');if(v.order)order={...v.order};api.clearSelection();api.closeDialog();api.render();}
 function addContextActions(){const sheet=$('action-sheet');if(!sheet||sheet.querySelector('[data-hub-context]'))return;const id=sheet.querySelector('[data-detail]')?.dataset.detail,e=entry(id);if(!e)return;const box=document.createElement('div');box.dataset.hubContext='true';if(e.canEdit)box.innerHTML+='<button data-hub-inline="'+esc(e.id)+'" data-field="description">Editar aqui</button>';const source=account(e.origin),dest=account(e.destination),group=dest?.linkedGroup||source?.linkedGroup||source?.group;if(group)box.innerHTML+='<button data-invoice="'+esc(group)+'">Abrir fatura</button>';if(e.group)box.innerHTML+='<button data-detail="'+esc(e.id)+'">Ver ocorrências do conjunto</button>';if(e.shares?.length)box.innerHTML+='<button data-action="approvals">Ver rateio e acertos</button>';sheet.prepend(box);}
 document.addEventListener('click',event=>{const b=event.target.closest('button');if(!b)return;if(inline&&['new','resume-draft','bulk-done','bulk-delete'].includes(b.dataset.action)||inline&&b.dataset.hubBulk){event.stopImmediatePropagation();toast('Salve ou cancele a edição atual primeiro.');return;}if(b.dataset.hubInline){event.preventDefault();api.closeActions();beginInline(b.dataset.hubInline,b.dataset.field,b.closest('[data-key]')?.dataset.key).catch(e=>toast(e.message));}if(b.hasAttribute('data-hub-cancel'))cancelInline();if(b.dataset.hubComplete){if(inline?.busy)return;captureInline();if(inline?.value!==inline?.initial){toast('Salve ou cancele este campo antes de abrir a edição completa.');return;}inline=null;call('editing',{active:false});api.render();api.edit(b.dataset.hubComplete).catch(e=>toast(e.message));}if(b.dataset.hubSort){const key=b.dataset.hubSort;order={key,direction:order.key===key&&order.direction==='asc'?'desc':'asc'};captureInline();api.render();}if(b.dataset.hubBulk)batch(b.dataset.hubBulk);if(b.id==='hub-refresh')call('reload').then(()=>api.reload()).catch(e=>toast(e.message));if(b.id==='hub-views')savedViews().catch(e=>toast(e.message));if(b.dataset.hubView)applyView({filters:{},tab:b.dataset.hubView});if(b.dataset.hubSaved!==undefined)applyView(views[Number(b.dataset.hubSaved)]);if(b.dataset.hubRemoveView!==undefined){const next=views.filter((v,i)=>i!==Number(b.dataset.hubRemoveView));call('views-save',next).then(()=>{views=next;savedViews();}).catch(e=>toast(e.message));}setTimeout(addContextActions,0);});
 document.addEventListener('change',e=>{if(e.target.id==='hub-inline-field'&&inline){const field=e.target.value;beginInline(inline.id,field,inline.rowKey).catch(e=>toast(e.message));}if(e.target.id==='hub-sort'){const [key,direction]=e.target.value.split(':');order={key,direction};captureInline();api.render();}});
 document.addEventListener('input',e=>{if(e.target.id==='hub-account-search'){accountSearch=e.target.value;filterAccounts();}if(e.target.id==='hub-inline-value'&&inline){if(inline.value!==e.target.value)inline.operationId=crypto.randomUUID();inline.value=e.target.value;}});
 document.addEventListener('submit',e=>{if(e.target.id==='hub-inline-form'){e.preventDefault();saveInline();}});
 document.addEventListener('keydown',e=>{if(inline&&!/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)&&e.key.toLowerCase()==='n'){e.preventDefault();e.stopImmediatePropagation();toast('Salve ou cancele a edição atual primeiro.');return;}if(e.target.closest('#hub-inline-form')&&e.key==='Escape'){e.preventDefault();e.stopImmediatePropagation();cancelInline();}if(e.target.closest('#hub-inline-form')&&e.key==='Enter'){e.preventDefault();saveInline();}},true);
 async function finishExit(save){captureInline();if(save){const value={hubInline:{...inline,busy:false,error:''}};await call('draft-save',value);api.setSavedDraft(value);}else if(inline?.resumed){await call('draft-save',null);api.setSavedDraft(null);}inline=null;await call('editing',{active:false});api.render();}
 async function resumeInline(saved){const e=entry(saved.id);if(!e){toast('Este lançamento não está no período atual. Ajuste o período para retomar.');return;}if(!api.visible().some(r=>r.entryId===saved.id)){api.setFilters(C.clean());api.setTab('all');}inline={...saved,resumed:true,busy:false,error:'',rowKey:api.data().rows.find(r=>r.entryId===saved.id)?.key};await call('editing',{active:true});api.render();$('hub-inline-value')?.focus();}
 return {entry,sortRows,canSelect,controls,captureInline,scopedRows,hasInline:()=>!!inline,isBusy:()=>inline?.busy===true,cancelInline,finishExit,resumeInline,refreshContext:addContextActions};
}
