<script>
function criarRateiosNovo(A){
 const C=A.core,esc=A.esc,money=C.money,uuid=()=>crypto.randomUUID(),dt=s=>s?new Date(s+'T12:00:00Z').toLocaleDateString('pt-BR'):'—',decimal=s=>(Number(s)/100).toFixed(2).replace('.',','),get=()=>A.data().rateios||{balances:[],items:[],settlements:[],approvals:[],invitations:[]};
 const status={pending:'Aguardando aprovação',approved:'Aprovado',rejected:'Correção solicitada',legacy:'Legado · aprovação não registrada',Aguardando_Credor:'Aguardando recebimento',Efetivado:'Recebimento registrado',Rejeitado:'Recebimento recusado',Cancelado:'Cancelado'};
 function box(title,body){return '<article class="box rt-card"><h3>'+esc(title)+'</h3>'+body+'</article>';}
 function button(text,attrs='',primary=false){return `<button type="button" class="btn ${primary?'primary':''}" ${attrs}>${text}</button>`;}
 function settlementCard(s){if(s.mode==='adjustment')return box('Ajuste de saldo com '+s.otherName,`<strong>${money(s.amountCents)}</strong> <span class="tag">Quitação histórica</span><p class="help">${dt(s.date)} · Sem movimentação bancária</p><p class="notice">${esc(s.adjustmentNote||'Ajuste de conciliação autorizado, sem novo pagamento ou recebimento.')}</p>`);return box((s.side==='pay'?'Pagamento para ':'Recebimento de ')+s.otherName,`<strong>${money(s.amountCents)}</strong> <span class="tag">${status[s.status]||esc(s.status)}</span><p class="help">${s.ownRegistered?'Sua ponta registrada em '+dt(s.date):'Sua ponta ainda não registrada'} · ${s.otherRegistered?'A outra pessoa já registrou':'A outra pessoa ainda não registrou'}</p>${s.reason?'<p class="notice">'+esc(s.reason)+'</p>':''}<div class="rt-actions">${s.canAttach?button(s.side==='pay'?'Registrar meu pagamento':s.invoice?'Reconhecer pagamento de fatura':'Registrar meu recebimento',`data-rt-attach="${s.id}"`,true):''}${s.canReject?button('Recusar recebimento',`data-rt-reject="${s.id}"`):''}${s.canCorrect?button('Corrigir meu pagamento',`data-rt-correct="${s.id}"`)+button('Excluir meu pagamento',`data-rt-remove="${s.id}"`):''}</div>`);}
 function viewBalances(){const r=get();if(!r.scopedSummary)return r.balances;return r.balances.map(b=>{const scoped=C.rateioBalances(r.scopedSummary.balances,r.scopedSummary.start).find(v=>v.id===b.id),balance=scoped?.balanceCents||'0',pay=C.compare(balance,'0')<0?C.negate(balance):'0',receive=C.compare(balance,'0')>0?balance:'0',minimum=(a,b)=>C.compare(a,b)<0?a:b;return {...b,balanceCents:balance,payMaxCents:minimum(pay,b.payMaxCents),receiveMaxCents:minimum(receive,b.receiveMaxCents),suggestedPayCents:minimum(pay,b.payMaxCents),suggestedReceiveCents:minimum(receive,b.receiveMaxCents)};});}
 let inlineNode=null,workspace=null;
 function region(){if(!inlineNode){inlineNode=document.createElement('section');inlineNode.id='rt-inline';inlineNode.className='box rt-inline';inlineNode.hidden=true;}if(!inlineNode.isConnected){const head=document.querySelector('.table-head')||document.getElementById('entries');head.before(inlineNode);}return inlineNode;}
 function render(){
  if(!workspace){workspace=document.createElement('section');workspace.id='rt-workspace';workspace.className='rt-workspace';workspace.setAttribute('aria-label','Rateios e acertos na lista');document.querySelector('.toolbar,.phone-chips').after(workspace);}
  workspace.hidden=!A.isShared()||A.invoiceBound();const r=get();
  if(!workspace.hidden)workspace.innerHTML=`<header class="rt-inline-head"><div><h2>Rateios e acertos</h2><p class="help">A categoria é pessoal. Sua participação em uma conta alheia aparece sem outra saída de dinheiro.</p></div><div class="rt-actions">${button('Novo rateio','data-rt-new="true"',true)}${button('Convidar pessoa','data-rt-invite="true"')}</div></header><div class="rt-balances">${viewBalances().map(b=>`<article><strong>${esc(b.name)}</strong><span class="rt-value ${C.compare(b.balanceCents,'0')<0?'negative':'positive'}">${money(b.balanceCents)}</span><small>${r.scopedSummary?.start?'Movimento líquido do mês':C.compare(b.balanceCents,'0')<0?'A pagar':'A receber'} · ${r.scopedSummary?(r.scopedSummary.start?'sem saldo anterior':'histórico até o fim do mês'):'acumulado, inclusive futuro'}</small><div class="rt-actions">${b.payMaxCents!=='0'?button('Pagar',`data-rt-pay="${b.id}"`,true):''}${b.receiveMaxCents!=='0'?button('Receber',`data-rt-receive="${b.id}"`,true):''}</div></article>`).join('')||'<p class="help">Sem saldo entre pessoas.</p>'}</div><details><summary>Acertos e aprovações (${r.settlements.length+r.approvals.length})</summary><div class="rt-records" role="table" aria-label="Acertos e aprovações">${r.settlements.map(v=>`<div class="rt-record" role="row"><span role="cell">${esc(v.otherName)}<small>${v.mode==='adjustment'?'Quitação histórica':v.side==='pay'?'Pagamento':'Recebimento'}</small></span><strong role="cell">${money(v.amountCents)}</strong><span role="cell">${esc(status[v.status]||v.status)}</span>${button('Conferir',`data-rt-settlement="${v.id}"`)}</div>`).join('')}${r.approvals.map(v=>`<div class="rt-record" role="row"><span role="cell">${esc(v.description)}<small>${v.count} ocorrência(s)</small></span><strong role="cell">${money(v.myCents)}</strong><span role="cell">${esc(status[v.status]||v.status)}</span>${button('Revisar',`data-rt-review="${v.id}"`)}</div>`).join('')}</div></details>${r.invitations.filter(i=>i.direction==='received'&&i.state==='pending').map(i=>`<div class="rt-record"><span>Convite de ${esc(i.name)}</span>${button('Aceitar',`data-rt-invitation="${i.id}" data-approve="true"`)}${button('Recusar',`data-rt-invitation="${i.id}" data-approve="false"`)}</div>`).join('')}`;
  region();
  const rowIndex=new Map(A.data().rows.map(r=>[r.key,r])),itemIndex=new Map(r.items.map(i=>[i.id,i]));
  for(const node of document.querySelectorAll('#entries [data-key]')){const row=rowIndex.get(node.dataset.key),item=itemIndex.get(row?.entryId);if(!item||node.querySelector('[data-rt-expand]'))continue;const actions=document.createElement('div');actions.className='rt-row-actions';actions.innerHTML=button('Rateio · minha parte '+money(item.myCents),`data-rt-expand="${item.id}"`);node.append(actions);}
 }
 function open(){A.setShared();}
 function expand(id){const item=get().items.find(i=>i.id===id);if(!item)return;const approval=get().approvals.find(a=>a.anchor===(item.group||item.id));A.panel('Rateio · '+item.description,'Sua categoria não altera a categoria das outras pessoas.',`<div class="panel-body"><div class="rt-inline-summary"><strong>Total ${money(item.amountCents)}</strong><strong>Sua parte ${money(item.myCents)}</strong><span class="tag">${esc(status[item.approval]||item.approval)}</span></div><p class="help">${dt(item.date)} · Pago por ${esc(item.financeName)}. A sua parte compõe o consumo por categoria. O acerto movimenta sua conta quando registrado.</p><div class="rt-people">${item.shares.map(p=>`<div class="definition"><span>${esc(p.name)}</span><strong>${money(p.cents)}</strong></div>`).join('')}</div><p>Sua categoria: <strong>${esc(A.data().categories.find(c=>c.id===item.myCategory)?.name||'Aguardando Categorização')}</strong></p><div class="rt-actions">${item.myCents!=='0'?button('Alterar minha categoria',`data-rt-category="${item.id}"`):''}${approval?button('Revisar aprovação',`data-rt-review="${approval.id}"`):''}${A.data().entries.find(e=>e.id===id)?.canEdit?button('Editar lançamento',`data-edit="${item.id}"`):''}${button('Fechar','data-close="panel"')}</div></div>`,'detail');const row=[...document.querySelectorAll('#entries [data-key]')].find(n=>A.data().rows.find(r=>r.key===n.dataset.key)?.entryId===id);if(row)row.after(region());}
 function showSettlement(id){const s=get().settlements.find(s=>s.id===id);if(s)A.panel('Acerto de rateio',s.otherName,'<div class="panel-body">'+settlementCard(s)+'</div>','detail');}
 async function start(side,other,s,correct=false){const candidates=await A.call('candidates',{side,other});const b=viewBalances().find(b=>b.id===other),amount=s?.amountCents||(side==='pay'?b?.suggestedPayCents:b?.suggestedReceiveCents)||'0',own=A.data().accounts.filter(a=>a.owner===A.data().user.id&&a.active&&a.kind==='Conta'&&!a.linkedGroup);A.draft({...A.newDraft(),acerto:true,side,other,id:s?.id||uuid(),entryId:uuid(),operationId:uuid(),version:s?.version||0,amount:amount==='0'?'':decimal(amount),date:s?.date||get().today,origin:s?.ownAccount||own.find(a=>a.id===A.contextAccount())?.id||own[0]?.id||'',existingEntry:'',invoiceExisting:!!s?.invoice,candidates,settlementAction:correct?'settle-edit':'settle'});A.editor();}
 function form(d){const s=get().settlements.find(s=>s.id===d.id),person=get().balances.find(b=>b.id===d.other)?.name||s?.otherName||'Participante',locked=s&&d.settlementAction!=='settle-edit';const own=A.data().accounts.filter(a=>a.owner===A.data().user.id&&a.active&&a.kind==='Conta'&&!a.linkedGroup);if(A.contextAccount()&&own.some(a=>a.id===A.contextAccount())){const selected=own.find(a=>a.id===A.contextAccount());own.splice(0,own.length,selected);d.origin=selected.id;}const type=d.side==='pay'?'expense':'income';const candidateEntries=d.candidates||A.data().entries;const invoices=d.side==='pay'&&!s?(d.candidates||[]).filter(e=>e.special==='invoice-payment'):[];const existing=d.candidates?d.candidates.filter(e=>!e.special):A.data().entries.filter(e=>e.type===type&&e.author===A.data().user.id&&e.sourceKind==='Conta'&&!e.opening&&!e.shares?.length&&!e.special&&e.status==='done'&&own.some(a=>a.id===e.origin));A.panel(d.side==='pay'?'Pagar rateio':'Receber rateio',person,`<form id="entry-form"><div class="panel-body"><p class="notice">${d.side==='pay'?'Você registra uma despesa na sua conta.':'Você registra uma receita na sua conta.'} ${s?'Este registro se vincula ao mesmo acerto; a dívida não será abatida novamente.':'O valor reduz o saldo total entre vocês, sem escolher despesas.'}</p><div class="field-grid"><div class="field"><label for="entry-amount">Valor</label><input class="input" id="entry-amount" inputmode="decimal" value="${esc(d.amount)}" ${locked?'readonly':''} required></div><div class="field"><label for="entry-date">Data do ${d.side==='pay'?'pagamento':'recebimento'}</label><input class="input" type="date" id="entry-date" value="${d.date}" max="${get().today}" required></div></div>${s?.invoice?'<p class="notice">O pagamento da fatura já movimentou as contas. Reconhecer este acerto não criará outra receita.</p>':`<div class="field"><label for="entry-account">Minha conta</label><select id="entry-account" class="input" required><option value="">Selecione</option>${own.map(a=>`<option value="${a.id}" ${d.origin===a.id?'selected':''}>${esc(a.name)} · ${esc(a.type)}</option>`).join('')}</select></div>${d.settlementAction!=='settle-edit'?`<div class="field"><label for="rt-existing">Lançamento financeiro</label><select class="input" id="rt-existing"><option value="">Criar lançamento especial</option>${[...existing,...invoices].map(e=>`<option value="${e.id}" ${d.existingEntry===e.id?'selected':''}>${dt(e.date)} · ${esc(e.description)} · ${money(e.amountCents)}</option>`).join('')}</select><p class="help">Para vincular um existente, valor, data e conta devem corresponder. Ele não será lançado novamente. Pagamentos de fatura existentes preservam seus efeitos como transferência.</p></div>`:''}`}${!s?'<p class="help">Máximo acumulado: '+money(d.side==='pay'?get().balances.find(b=>b.id===d.other)?.payMaxCents||'0':get().balances.find(b=>b.id===d.other)?.receiveMaxCents||'0')+'. Inclui obrigações futuras já registradas.</p>':''}<p id="entry-error" class="error" role="alert"></p></div><footer class="panel-foot"><button type="button" class="btn" data-close="panel">Sair</button><button type="submit" class="btn primary">${s?.invoice?'Reconhecer acerto':d.side==='pay'?'Registrar despesa':'Registrar receita'}</button></footer></form>`,'editor');}
 async function save(d){const amount=A.parse(d.amount);if(!amount||amount==='0')throw Error('Informe um valor positivo.');const req={action:d.settlementAction,id:d.id,version:d.version,operationId:d.operationId,entryId:d.entryId,side:d.side,other:d.other,amountCents:amount,date:d.date,account:d.origin,existingEntry:d.existingEntry&&!(d.candidates||A.data().entries).find(e=>e.id===d.existingEntry&&e.special==='invoice-payment')?d.existingEntry:undefined,existingInvoice:(d.candidates||A.data().entries).find(e=>e.id===d.existingEntry&&e.special==='invoice-payment')?.id,invoiceExisting:d.invoiceExisting===true};await A.call('rateio',req);await A.finish();A.toast('Acerto registrado.');}
 function review(id){const s=get().approvals.find(s=>s.id===id),operation=uuid();if(!s)return;const defaultCategory=s.category||get().items.find(i=>i.group===s.anchor||i.id===s.anchor)?.myCategory;A.dialog(s.action==='delete'?'Revisar exclusão':'Revisar rateio',s.description||'Conjunto de lançamentos',`<p class="notice">${s.count} ocorrência(s), de ${dt(s.firstDate)} a ${dt(s.lastDate)}. Total ${money(s.amountCents)}; sua parte ${money(s.myCents)}. A decisão abrange todo este conjunto, inclusive datas fora do período visível.</p>${(s.occurrences||[]).map(o=>`<div class="definition"><span>${dt(o.date)}</span><strong>${money(o.amountCents)}</strong></div>`).join('')}<h3>Pessoas envolvidas</h3>${(s.people||[]).map(p=>'<p class="help">'+esc(p.name)+' · '+(status[p.decision]||esc(p.decision))+(p.reason?' · '+esc(p.reason):'')+'</p>').join('')}${s.action!=='delete'&&s.myCents!=='0'?'<label class="field">Minha categoria<select id="rt-review-category" class="input"><option value="">Selecione</option>'+A.data().categories.filter(c=>c.active).map(c=>'<option value="'+c.id+'" '+(defaultCategory===c.id?'selected':'')+'>'+esc(C.categoryLabel(c,A.data().categories))+'</option>').join('')+'</select></label>':''}<label class="field">Decisão<select id="rt-review-decision" class="input"><option value="true">Aprovar</option><option value="false">Rejeitar e pedir correção</option></select></label><label class="field">Justificativa da rejeição<textarea id="rt-review-reason" class="input" maxlength="500"></textarea></label>`,async()=>{const approve=document.getElementById('rt-review-decision').value==='true',category=document.getElementById('rt-review-category')?.value||null,reason=document.getElementById('rt-review-reason').value.trim();if(approve&&s.action!=='delete'&&s.myCents!=='0'&&!category)throw Error('Escolha sua categoria.');if(!approve&&!reason)throw Error('Informe o motivo.');await A.call('decide',{id,approve,category,reason,operationId:operation});await A.refresh();open();},'Registrar decisão');}
 async function mutate(req,method='rateio'){await A.call(method,req);await A.refresh();open();}
 document.addEventListener('change',e=>{if(e.target.id==='rt-existing'){const d=A.draft();d.existingEntry=e.target.value;const entry=(d.candidates||A.data().entries).find(x=>x.id===d.existingEntry);if(entry){d.date=entry.date;d.origin=entry.origin;if(!d.version)d.amount=decimal(entry.amountCents);A.editor();}}});
 document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const ds=b.dataset;if(!Object.keys(ds).some(k=>k.startsWith('rt')))return;A.run(async()=>{
 if(ds.rtNew)A.newShared();if(ds.rtOpen)open();if(ds.rtExpand)expand(ds.rtExpand);if(ds.rtSettlement)showSettlement(ds.rtSettlement);if(ds.rtReview)review(ds.rtReview);if(ds.rtPay)await start('pay',ds.rtPay);if(ds.rtReceive)await start('receive',ds.rtReceive);if(ds.rtAttach||ds.rtCorrect){const s=get().settlements.find(s=>s.id===(ds.rtAttach||ds.rtCorrect));await start(s.side,s.other,s,!!ds.rtCorrect);}
 if(ds.rtCategory){const s=get().items.find(s=>s.id===ds.rtCategory),operationId=uuid();A.dialog('Minha categoria','A escolha altera somente sua participação neste lançamento.',`<label class="field">Categoria<select class="input" id="rt-category"><option value="">Selecione</option>${A.data().categories.filter(c=>c.active&&c.type===s.type).map(c=>`<option value="${c.id}" ${c.id===s.myCategory?'selected':''}>${esc(C.categoryLabel(c,A.data().categories))}</option>`).join('')}</select></label>`,()=>mutate({field:'category',value:document.getElementById('rt-category').value,selected:[{id:s.id,version:A.data().entries.find(e=>e.id===s.id).version,categoryVersion:A.data().entries.find(e=>e.id===s.id).categoryVersion||0}],operationId},'hub'),'Salvar categoria');}
 if(ds.rtReject||ds.rtRemove){const s=get().settlements.find(s=>s.id===(ds.rtReject||ds.rtRemove)),operationId=uuid();A.dialog(ds.rtReject?'Recusar recebimento?':'Excluir meu pagamento?',ds.rtReject?'O saldo devedor será restaurado. A despesa da outra pessoa permanece para ela corrigir.':'Seu lançamento de despesa será excluído e o saldo devedor será restaurado.',ds.rtReject?'<label class="field">Motivo<textarea class="input" id="rt-reason" maxlength="500" required></textarea></label>':'<p class="notice">'+money(s.amountCents)+' · '+esc(s.otherName)+'</p>',()=>mutate({action:ds.rtReject?'settle-reject':'settle-remove',id:s.id,version:s.version,operationId,reason:document.getElementById('rt-reason')?.value||''}),'Confirmar');}
 if(ds.rtInvite){const id=uuid(),operationId=uuid();A.dialog('Convidar pessoa','A solicitação aparecerá para a pessoa ao entrar com o e-mail informado.', '<label class="field">E-mail<input id="rt-email" class="input" type="email" maxlength="254" required></label>',()=>mutate({action:'invite',id,operationId,email:document.getElementById('rt-email').value}),'Solicitar vínculo');}
 if(ds.rtInvitation){const i=get().invitations.find(i=>i.id===ds.rtInvitation);await mutate({action:'invite-decide',id:i.id,version:i.version,approve:ds.approve==='true',operationId:uuid()});}
 });});
 return {open,review,start,form,save,render,region,expand,showSettlement};
}
</script>
<style>.rt-stack{display:grid;gap:12px}.rt-card{padding:16px;margin-bottom:12px}.rt-card h3{margin-top:0}.rt-value{font-size:23px}.rt-actions{display:flex;flex-wrap:wrap;gap:8px}.rt-center .definition{display:flex;justify-content:space-between;gap:12px;padding:8px 0}.rt-center>h3{margin-top:28px}.phone .rt-actions .btn{min-height:44px;flex:1}.phone .rt-card{border-radius:14px}.rt-actions:empty{display:none}.rt-workspace{padding:18px;border-bottom:1px solid var(--line)}.rt-inline-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px}.rt-inline-head h2{font-size:18px}.rt-balances{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:12px 0}.rt-balances article{display:flex;flex-direction:column;gap:6px;border:1px solid var(--line);border-radius:12px;padding:16px}.rt-balances small,.rt-record small{display:block;color:var(--muted);font-size:11px}.rt-records{margin-top:12px}.rt-record{display:grid;grid-template-columns:minmax(120px,1fr) 130px minmax(90px,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.rt-inline{margin:12px 0;width:100%}.rt-inline .panel-body{padding:18px}.rt-row-actions{grid-column:1/-1;display:flex;gap:8px;padding-top:5px}.rt-row-actions .btn{min-height:32px;padding:5px 8px;font-size:11px}.rt-inline-summary{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:14px}.rt-people{max-width:550px}.rt-people .definition{display:flex;justify-content:space-between;padding:8px}.phone .rt-balances{grid-template-columns:1fr}.phone .rt-record{grid-template-columns:1fr auto}.phone .rt-inline-head{align-items:flex-start;flex-wrap:wrap}.phone .rt-inline{border-radius:12px}.rt-workspace summary{cursor:pointer;min-height:40px;padding:10px 0}
.rt-balances article{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 14px;padding:12px 16px}.rt-balances article>strong,.rt-balances article>small{grid-column:1}.rt-balances article>.rt-value{grid-column:1;font-size:21px}.rt-balances article>.rt-actions{grid-column:2;grid-row:1/4;align-self:center}.rt-workspace>.rt-inline-head{padding:0 0 8px}.rt-workspace{padding:14px 18px}.phone .rt-balances article{grid-template-columns:1fr}.phone .rt-balances article>.rt-actions{grid-column:1;grid-row:auto}.phone .rt-inline-head .help{line-height:1.45}
</style>
