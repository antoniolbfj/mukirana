<script>
function criarRateiosNovo(A){
 const C=A.core,esc=A.esc,money=C.money,uuid=()=>crypto.randomUUID(),dt=s=>s?new Date(s+'T12:00:00Z').toLocaleDateString('pt-BR'):'—',decimal=s=>(Number(s)/100).toFixed(2).replace('.',','),get=()=>A.data().rateios||{balances:[],items:[],settlements:[],approvals:[],invitations:[]};
 const status={pending:'Aguardando aprovação',approved:'Aprovado',rejected:'Correção solicitada',legacy:'Legado · aprovação não registrada',Aguardando_Credor:'Aguardando recebimento',Efetivado:'Recebimento registrado',Rejeitado:'Recebimento recusado',Cancelado:'Cancelado'};
 function box(title,body){return '<article class="box rt-card"><h3>'+esc(title)+'</h3>'+body+'</article>';}
 function button(text,attrs='',primary=false){return `<button type="button" class="btn ${primary?'primary':''}" ${attrs}>${text}</button>`;}
 function settlementCard(s){if(s.mode==='adjustment')return box('Ajuste de saldo com '+s.otherName,`<strong>${money(s.amountCents)}</strong> <span class="tag">Quitação histórica</span><p class="help">${dt(s.date)} · Sem movimentação bancária</p><p class="notice">${esc(s.adjustmentNote||'Ajuste de conciliação autorizado, sem novo pagamento ou recebimento.')}</p>`);return box((s.side==='pay'?'Pagamento para ':'Recebimento de ')+s.otherName,`<strong>${money(s.amountCents)}</strong> <span class="tag">${status[s.status]||esc(s.status)}</span><p class="help">${s.ownRegistered?'Sua ponta registrada em '+dt(s.date):'Sua ponta ainda não registrada'} · ${s.otherRegistered?'A outra pessoa já registrou':'A outra pessoa ainda não registrou'}</p>${s.reason?'<p class="notice">'+esc(s.reason)+'</p>':''}<div class="rt-actions">${s.canAttach?button(s.side==='pay'?'Registrar meu pagamento':s.invoice?'Reconhecer pagamento de fatura':'Registrar meu recebimento',`data-rt-attach="${s.id}"`,true):''}${s.canReject?button('Recusar recebimento',`data-rt-reject="${s.id}"`):''}${s.canCorrect?button('Corrigir meu pagamento',`data-rt-correct="${s.id}"`)+button('Excluir meu pagamento',`data-rt-remove="${s.id}"`):''}</div>`);}
 function open(){const r=get();A.panel('Rateios e acertos','Saldos entre pessoas · acumulados, inclusive registros futuros',`<div class="panel-body rt-center"><p class="notice">A acertar fica separado do seu resultado. Cada pagamento ou recebimento é registrado por você na sua conta. As duas pontas abatem uma única dívida.</p><div class="rt-stack">${r.balances.map(b=>box(b.name,`<strong class="rt-value">${money(b.balanceCents)}</strong><p class="help">${C.compare(b.balanceCents,'0')>=0?'A receber':'A pagar'} · até o mês atual ${money(b.dueCents)}</p><div class="rt-actions">${b.payMaxCents!=='0'?button('Pagar',`data-rt-pay="${b.id}"`,true):''}${b.receiveMaxCents!=='0'?button('Receber',`data-rt-receive="${b.id}"`,true):''}</div>`)).join('')||'<p class="help">Nenhum saldo entre pessoas registrado.</p>'}</div><h3>Acertos registrados</h3><p class="help">Pagamentos aguardando recebimento já reservam o saldo. Confira os registros existentes antes de iniciar outro acerto.</p>${r.settlements.map(settlementCard).join('')||'<p class="help">Ainda não há acertos.</p>'}<h3>Aprovações</h3>${r.approvals.map(s=>box(s.description||'Rateio',`<span class="tag">${status[s.status]||esc(s.status)}</span><p class="help">${s.count} ocorrência(s) · total ${money(s.amountCents)} · sua participação ${money(s.myCents)}</p>${button('Revisar conjunto',`data-rt-review="${s.id}"`)}`)).join('')||'<p class="help">Sem solicitações.</p>'}<h3>Participações no período</h3><p class="help">Os lançamentos abaixo são informativos. Somente movimentos de suas contas integram seu resultado.</p>${r.items.map(s=>box(s.description,`<p class="help">${dt(s.date)} · ${esc(s.financeName||'Responsável financeiro')} · ${status[s.approval]||esc(s.approval)}</p><p>Total ${money(s.amountCents)} · sua parte <strong>${money(s.myCents)}</strong></p>${s.shares.map(p=>`<div class="definition"><span>${esc(p.name)}</span><strong>${money(p.cents)}</strong></div>`).join('')}${s.myCents!=='0'?'<p class="help">Sua categoria: '+esc(A.data().categories.find(c=>c.id===s.myCategory)?.name||'Aguardando Categorização')+'</p>'+button('Minha categoria',`data-rt-category="${s.id}"`):''}${A.data().entries.find(e=>e.id===s.id&&e.canEdit)?button('Editar lançamento',`data-edit="${s.id}"`):''}${s.linkedSettlement?'<p class="help">Vinculado a acerto histórico; IDs e valores preservados.</p>':''}`)).join('')||'<p class="help">Sem participações neste período.</p>'}<h3>Pessoas</h3><p class="help">Convites concedem apenas vínculo para ratear, sem acesso a contas.</p>${button('Convidar por e-mail','data-rt-invite="true"')}${r.invitations.map(i=>`<div class="rt-card"><strong>${esc(i.name)}</strong><p class="help">${i.direction==='sent'?'Solicitação enviada':'Solicitação recebida'} · ${status[i.state]}</p>${i.direction==='received'&&i.state==='pending'?button('Aceitar',`data-rt-invitation="${i.id}" data-approve="true"`)+button('Recusar',`data-rt-invitation="${i.id}" data-approve="false"`):''}</div>`).join('')}</div>`,'detail');}
 async function start(side,other,s,correct=false){const candidates=await A.call('candidates',{side,other});const b=get().balances.find(b=>b.id===other),amount=s?.amountCents||(side==='pay'?b?.suggestedPayCents:b?.suggestedReceiveCents)||'0',own=A.data().accounts.filter(a=>a.owner===A.data().user.id&&a.active&&a.kind==='Conta'&&!a.linkedGroup);A.draft({...A.newDraft(),acerto:true,side,other,id:s?.id||uuid(),entryId:uuid(),operationId:uuid(),version:s?.version||0,amount:amount==='0'?'':decimal(amount),date:s?.date||get().today,origin:s?.ownAccount||own[0]?.id||'',existingEntry:'',invoiceExisting:!!s?.invoice,candidates,settlementAction:correct?'settle-edit':'settle'});A.editor();}
 function form(d){const s=get().settlements.find(s=>s.id===d.id),person=get().balances.find(b=>b.id===d.other)?.name||s?.otherName||'Participante',locked=s&&d.settlementAction!=='settle-edit';const own=A.data().accounts.filter(a=>a.owner===A.data().user.id&&a.active&&a.kind==='Conta'&&!a.linkedGroup);const type=d.side==='pay'?'expense':'income';const candidateEntries=d.candidates||A.data().entries;const invoices=d.side==='pay'&&!s?(d.candidates||[]).filter(e=>e.special==='invoice-payment'):[];const existing=d.candidates?d.candidates.filter(e=>!e.special):A.data().entries.filter(e=>e.type===type&&e.author===A.data().user.id&&e.sourceKind==='Conta'&&!e.opening&&!e.shares?.length&&!e.special&&e.status==='done'&&own.some(a=>a.id===e.origin));A.panel(d.side==='pay'?'Pagar rateio':'Receber rateio',person,`<form id="entry-form"><div class="panel-body"><p class="notice">${d.side==='pay'?'Você registra uma despesa na sua conta.':'Você registra uma receita na sua conta.'} ${s?'Este registro se vincula ao mesmo acerto; a dívida não será abatida novamente.':'O valor reduz o saldo total entre vocês, sem escolher despesas.'}</p><div class="field-grid"><div class="field"><label for="entry-amount">Valor</label><input class="input" id="entry-amount" inputmode="decimal" value="${esc(d.amount)}" ${locked?'readonly':''} required></div><div class="field"><label for="entry-date">Data do ${d.side==='pay'?'pagamento':'recebimento'}</label><input class="input" type="date" id="entry-date" value="${d.date}" max="${get().today}" required></div></div>${s?.invoice?'<p class="notice">O pagamento da fatura já movimentou as contas. Reconhecer este acerto não criará outra receita.</p>':`<div class="field"><label for="entry-account">Minha conta</label><select id="entry-account" class="input" required><option value="">Selecione</option>${own.map(a=>`<option value="${a.id}" ${d.origin===a.id?'selected':''}>${esc(a.name)} · ${esc(a.type)}</option>`).join('')}</select></div>${d.settlementAction!=='settle-edit'?`<div class="field"><label for="rt-existing">Lançamento financeiro</label><select class="input" id="rt-existing"><option value="">Criar lançamento especial</option>${[...existing,...invoices].map(e=>`<option value="${e.id}" ${d.existingEntry===e.id?'selected':''}>${dt(e.date)} · ${esc(e.description)} · ${money(e.amountCents)}</option>`).join('')}</select><p class="help">Para vincular um existente, valor, data e conta devem corresponder. Ele não será lançado novamente. Pagamentos de fatura existentes preservam seus efeitos como transferência.</p></div>`:''}`}${!s?'<p class="help">Máximo acumulado: '+money(d.side==='pay'?get().balances.find(b=>b.id===d.other)?.payMaxCents||'0':get().balances.find(b=>b.id===d.other)?.receiveMaxCents||'0')+'. Inclui obrigações futuras já registradas.</p>':''}<p id="entry-error" class="error" role="alert"></p></div><footer class="panel-foot"><button type="button" class="btn" data-close="panel">Sair</button><button type="submit" class="btn primary">${s?.invoice?'Reconhecer acerto':d.side==='pay'?'Registrar despesa':'Registrar receita'}</button></footer></form>`,'editor');}
 async function save(d){const amount=A.parse(d.amount);if(!amount||amount==='0')throw Error('Informe um valor positivo.');const req={action:d.settlementAction,id:d.id,version:d.version,operationId:d.operationId,entryId:d.entryId,side:d.side,other:d.other,amountCents:amount,date:d.date,account:d.origin,existingEntry:d.existingEntry&&!(d.candidates||A.data().entries).find(e=>e.id===d.existingEntry&&e.special==='invoice-payment')?d.existingEntry:undefined,existingInvoice:(d.candidates||A.data().entries).find(e=>e.id===d.existingEntry&&e.special==='invoice-payment')?.id,invoiceExisting:d.invoiceExisting===true};await A.call('rateio',req);await A.finish();A.toast('Acerto registrado.');}
 function review(id){const s=get().approvals.find(s=>s.id===id),operation=uuid();if(!s)return;A.dialog(s.action==='delete'?'Revisar exclusão':'Revisar rateio',s.description||'Conjunto de lançamentos',`<p class="notice">${s.count} ocorrência(s), de ${dt(s.firstDate)} a ${dt(s.lastDate)}. Total ${money(s.amountCents)}; sua parte ${money(s.myCents)}. A decisão abrange todo este conjunto, inclusive datas fora do período visível.</p>${(s.occurrences||[]).map(o=>`<div class="definition"><span>${dt(o.date)}</span><strong>${money(o.amountCents)}</strong></div>`).join('')}<h3>Pessoas envolvidas</h3>${(s.people||[]).map(p=>'<p class="help">'+esc(p.name)+' · '+(status[p.decision]||esc(p.decision))+(p.reason?' · '+esc(p.reason):'')+'</p>').join('')}${s.action!=='delete'&&s.myCents!=='0'?'<label class="field">Minha categoria<select id="rt-review-category" class="input"><option value="">Selecione</option>'+A.data().categories.filter(c=>c.active).map(c=>'<option value="'+c.id+'" '+(s.category===c.id?'selected':'')+'>'+esc(c.name)+'</option>').join('')+'</select></label>':''}<label class="field">Decisão<select id="rt-review-decision" class="input"><option value="true">Aprovar</option><option value="false">Rejeitar e pedir correção</option></select></label><label class="field">Justificativa da rejeição<textarea id="rt-review-reason" class="input" maxlength="500"></textarea></label>`,async()=>{const approve=document.getElementById('rt-review-decision').value==='true',category=document.getElementById('rt-review-category')?.value||null,reason=document.getElementById('rt-review-reason').value.trim();if(approve&&s.action!=='delete'&&s.myCents!=='0'&&!category)throw Error('Escolha sua categoria.');if(!approve&&!reason)throw Error('Informe o motivo.');await A.call('decide',{id,approve,category,reason,operationId:operation});await A.refresh();open();},'Registrar decisão');}
 async function mutate(req){await A.call('rateio',req);await A.refresh();open();}
 document.addEventListener('change',e=>{if(e.target.id==='rt-existing'){const d=A.draft();d.existingEntry=e.target.value;const entry=(d.candidates||A.data().entries).find(x=>x.id===d.existingEntry);if(entry){d.date=entry.date;d.origin=entry.origin;if(!d.version)d.amount=decimal(entry.amountCents);A.editor();}}});
 document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const ds=b.dataset;if(!Object.keys(ds).some(k=>k.startsWith('rt')))return;A.run(async()=>{
 if(ds.rtOpen)open();if(ds.rtReview)review(ds.rtReview);if(ds.rtPay)await start('pay',ds.rtPay);if(ds.rtReceive)await start('receive',ds.rtReceive);if(ds.rtAttach||ds.rtCorrect){const s=get().settlements.find(s=>s.id===(ds.rtAttach||ds.rtCorrect));await start(s.side,s.other,s,!!ds.rtCorrect);}
 if(ds.rtCategory){const s=get().items.find(s=>s.id===ds.rtCategory),operationId=uuid();A.dialog('Minha categoria','A escolha será aplicada às suas participações do conjunto.',`<label class="field">Categoria<select class="input" id="rt-category"><option value="">Selecione</option>${A.data().categories.filter(c=>c.active&&c.type===s.type).map(c=>`<option value="${c.id}" ${c.id===s.myCategory?'selected':''}>${esc(c.name)}</option>`).join('')}</select></label>`,()=>mutate({action:'category',id:s.id,category:document.getElementById('rt-category').value,operationId}),'Salvar categoria');}
 if(ds.rtReject||ds.rtRemove){const s=get().settlements.find(s=>s.id===(ds.rtReject||ds.rtRemove)),operationId=uuid();A.dialog(ds.rtReject?'Recusar recebimento?':'Excluir meu pagamento?',ds.rtReject?'O saldo devedor será restaurado. A despesa da outra pessoa permanece para ela corrigir.':'Seu lançamento de despesa será excluído e o saldo devedor será restaurado.',ds.rtReject?'<label class="field">Motivo<textarea class="input" id="rt-reason" maxlength="500" required></textarea></label>':'<p class="notice">'+money(s.amountCents)+' · '+esc(s.otherName)+'</p>',()=>mutate({action:ds.rtReject?'settle-reject':'settle-remove',id:s.id,version:s.version,operationId,reason:document.getElementById('rt-reason')?.value||''}),'Confirmar');}
 if(ds.rtInvite){const id=uuid(),operationId=uuid();A.dialog('Convidar pessoa','A solicitação aparecerá para a pessoa ao entrar com o e-mail informado.', '<label class="field">E-mail<input id="rt-email" class="input" type="email" maxlength="254" required></label>',()=>mutate({action:'invite',id,operationId,email:document.getElementById('rt-email').value}),'Solicitar vínculo');}
 if(ds.rtInvitation){const i=get().invitations.find(i=>i.id===ds.rtInvitation);await mutate({action:'invite-decide',id:i.id,version:i.version,approve:ds.approve==='true',operationId:uuid()});}
 });});
 return {open,review,start,form,save};
}
</script>
<style>.rt-stack{display:grid;gap:12px}.rt-card{padding:16px;margin-bottom:12px}.rt-card h3{margin-top:0}.rt-value{font-size:23px}.rt-actions{display:flex;flex-wrap:wrap;gap:8px}.rt-center .definition{display:flex;justify-content:space-between;gap:12px;padding:8px 0}.rt-center>h3{margin-top:28px}.phone .rt-actions .btn{min-height:44px;flex:1}.phone .rt-card{border-radius:14px}.rt-actions:empty{display:none}</style>
