<div id="transfers-view" hidden></div>
<template id="transfers-template"><?!= includeFinanceStyles_(); ?>
<div id="transfers-content" class="finance-content" data-theme="light"><a class="skip-link" href="#page-title">Ir para o conteúdo</a>
<div class="shell"><aside class="sidebar"><a class="brand" href="#" id="tr-brand"><span>mukirana.</span></a><p class="nav-label">MEU ESPAÇO</p><nav aria-label="Navegação principal"><a href="#" id="tr-transactions" class="nav-item">Lançamentos</a><a href="#" class="nav-item current" aria-current="page">Transferências</a><a href="#" id="tr-accounts" class="nav-item">Contas</a><a href="#" id="tr-categories" class="nav-item">Categorias</a></nav><div class="sidebar-bottom"><p>Pequenos passos.<br>Mais espaço para seus planos.</p><span>Seu dinheiro. Seu espaço.</span></div></aside>
<div class="workspace"><header class="topbar"><div class="breadcrumb"><button id="tr-home" class="text-button">Meu espaço</button><span class="slash">/</span><strong>Transferências</strong></div><div class="top-actions"><button id="reload" class="text-button">Atualizar</button><label class="theme-control"><span>Tema</span><select id="theme"><option value="light">Claro</option><option value="dark">Escuro</option><option value="sepia">Sépia</option></select></label></div></header>
<main><div class="page-heading"><div><p class="eyebrow">ENTRE SUAS CONTAS</p><h1 id="page-title" tabindex="-1">Minhas transferências.</h1><p class="description">Mova valores entre suas contas de Consumo, Investimento e Cartão.</p></div><button id="new-transfer" class="button primary">+ Transferência</button></div>
<section class="period-panel" aria-label="Período global"><div><label for="period-preset">Período</label><select id="period-preset"><option value="current">Mês atual</option><option value="previous">Mês anterior</option><option value="next">Próximo mês</option><option value="all">Todo o histórico</option><option value="custom">Personalizado</option></select></div><div><label for="start-date">De</label><input type="date" id="start-date"></div><div><label for="end-date">Até</label><input type="date" id="end-date"></div><button id="apply-period" class="button">Aplicar</button><p id="period-error" class="field-error" role="alert" hidden></p></section>
<div class="stats two tx-stats" aria-label="Transferências no período"><div class="stat-card"><span><span>Valor transferido</span><strong id="amount-total">—</strong></span></div><div class="stat-card"><span><span>Transferências</span><strong id="count-total">—</strong></span></div></div>
<p class="totals-note">Cada transferência é contada uma vez, incluindo as previstas. Esses valores não entram nos totais de receitas e despesas.</p>
<div class="tx-filters"><div class="search"><label class="sr-only" for="search">Buscar pela descrição</label><input id="search" type="search" maxlength="160" placeholder="Buscar pela descrição" autocomplete="off"></div><label><span class="sr-only">Conta de origem ou destino</span><select id="account-filter"><option value="">Todas as contas</option></select></label></div>
<p id="account-balance" class="totals-note" hidden></p><div id="page-error" class="info-note" role="alert" hidden></div>
<section class="category-panel" aria-labelledby="list-title"><div class="panel-heading"><div><h2 id="list-title">Suas transferências</h2><span id="result-count" class="muted" role="status"></span></div><span class="privacy-note">Somente você</span></div><div id="entry-list" aria-live="polite"></div><div class="load-more"><button id="more" class="button" hidden>Carregar mais</button></div></section>
<div class="bottom-note"><span>Aportes, resgates e pagamentos de cartão usam a mesma transferência.</span><span>Valores em reais.</span></div></main></div></div>
<dialog id="editor" class="drawer" aria-labelledby="editor-title"><form id="entry-form" novalidate><div class="drawer-heading"><div><p class="eyebrow">TRANSFERÊNCIA ENTRE CONTAS</p><h2 id="editor-title">Nova transferência.</h2></div><button type="button" id="close-editor" class="icon-button" aria-label="Fechar formulário">×</button></div><div class="drawer-body">
<p id="editor-note" class="field-hint" role="status"></p>
<div class="field"><label for="description">Descrição</label><input id="description" maxlength="160" required autocomplete="off" placeholder="Ex.: Aporte na reserva" aria-describedby="description-error"><p id="description-error" class="field-error" role="alert" hidden></p></div>
<div class="field-pair"><div class="field"><label for="amount">Valor</label><input id="amount" inputmode="decimal" placeholder="0,00" required autocomplete="off" aria-describedby="amount-error"><p id="amount-error" class="field-error" role="alert" hidden></p></div><div class="field"><label for="date">Data</label><input id="date" type="date" required aria-describedby="date-error"><p id="date-error" class="field-error" role="alert" hidden></p></div></div>
<div class="field"><div class="field-label"><label for="source">Conta de origem</label><button type="button" id="quick-source" class="text-button">+ Nova conta</button></div><select id="source" required aria-describedby="source-error"></select><p id="source-error" class="field-error" role="alert" hidden></p></div>
<div class="field"><div class="field-label"><label for="destination">Conta de destino</label><button type="button" id="quick-destination" class="text-button">+ Nova conta</button></div><select id="destination" required aria-describedby="destination-error"></select><p id="destination-error" class="field-error" role="alert" hidden></p></div>
<p class="info-note">O valor sai da origem e entra no destino na mesma data. Editar ou excluir esta transferência altera os dois movimentos juntos.</p><p id="future-note" class="info-note" hidden>Esta transferência é futura. Ela afeta a projeção e passa a compor o saldo atual na data informada.</p>
<p id="form-error" class="field-error" role="alert" tabindex="-1" hidden></p><button type="button" id="review" class="text-button" hidden>Fechar e recarregar lista</button>
</div><div class="drawer-footer"><button type="button" id="cancel-editor" class="button">Cancelar</button><button id="save-entry" class="button primary" type="submit">Salvar transferência</button></div></form></dialog>
<dialog id="confirm" class="modal" aria-labelledby="confirm-title"><h2 id="confirm-title"></h2><p id="confirm-description" class="description"></p><div class="modal-actions"><button id="confirm-cancel" class="button">Voltar</button><button id="confirm-accept" class="button primary">Confirmar</button></div></dialog>
<dialog id="quick" class="modal" aria-labelledby="quick-title"><form id="quick-form" novalidate><h2 id="quick-title">Nova conta.</h2><p class="description">Continue sua transferência com os dados já preenchidos.</p><div class="field"><label for="quick-name">Nome</label><input id="quick-name" maxlength="80" required autocomplete="off"></div><div class="field"><label for="quick-type">Tipo de conta</label><select id="quick-type"><option value="consumption">Consumo</option><option value="investment">Investimento</option><option value="credit">Cartão de Crédito</option></select></div><p id="quick-error" class="field-error" role="alert" hidden></p><div class="modal-actions"><button id="quick-cancel" type="button" class="button">Cancelar</button><button id="quick-save" type="submit" class="button primary">Criar e selecionar</button></div></form></dialog>
<div id="toast" class="toast" role="status" hidden><span id="toast-text"></span><button id="toast-action" class="text-button" hidden>Ver mês</button><button id="toast-close" class="icon-button" aria-label="Fechar aviso">×</button></div>
</div></template>
